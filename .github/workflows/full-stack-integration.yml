name: AEKO Runtime Contract Integration

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  workflow_run:
    workflows: ["AEKO CLI release binaries"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: aeko-runtime-contract-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: Ubuntu production-compose API/RPC/WS integration
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Resolve validated image and CLI producers
        id: producers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
              echo "CLI release producer did not succeed: $WORKFLOW_RUN_CONCLUSION" >&2
              exit 1
            fi
            source_sha="$WORKFLOW_RUN_SHA"
            cli_run_id="$WORKFLOW_RUN_ID"
          else
            source_sha="$PR_SOURCE_SHA"
            cli_run_id=""
          fi

          test -n "$source_sha"
          short_sha="${source_sha:0:12}"

          find_run() {
            local workflow_file="$1"
            gh api               -H "Accept: application/vnd.github+json"               "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?head_sha=${source_sha}&per_page=20"               --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0]'
          }

          echo "Waiting for AEKO DevOps to validate and push immutable runtime images for $source_sha"
          devops_run_id=""
          for _ in $(seq 1 360); do
            run_json="$(find_run build-images.yml)"
            if [ "$run_json" != "null" ] && [ -n "$run_json" ]; then
              devops_run_id="$(jq -r '.id' <<<"$run_json")"
              status="$(jq -r '.status' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "AEKO DevOps run $devops_run_id completed with $conclusion" >&2
                  exit 1
                fi
                break
              fi
            fi
            sleep 10
          done
          test -n "$devops_run_id" || {
            echo "No AEKO DevOps run found for $source_sha" >&2
            exit 1
          }

          if [ -z "$cli_run_id" ]; then
            echo "Waiting for the Linux CLI release artifact for $source_sha"
            for _ in $(seq 1 360); do
              run_json="$(find_run cli-release.yml)"
              if [ "$run_json" != "null" ] && [ -n "$run_json" ]; then
                cli_run_id="$(jq -r '.id' <<<"$run_json")"
                status="$(jq -r '.status' <<<"$run_json")"
                conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
                artifact_count="$(gh api                   -H "Accept: application/vnd.github+json"                   "repos/${GITHUB_REPOSITORY}/actions/runs/${cli_run_id}/artifacts"                   --jq '[.artifacts[] | select(.name == "cli-x86_64-unknown-linux-gnu" and .expired == false)] | length')"
                if [ "$artifact_count" -gt 0 ]; then
                  break
                fi
                if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                  echo "CLI release run $cli_run_id completed with $conclusion before producing the Linux artifact" >&2
                  exit 1
                fi
              fi
              sleep 10
            done
          fi

          test -n "$cli_run_id" || {
            echo "No CLI release run found for $source_sha" >&2
            exit 1
          }

          artifact_count="$(gh api             -H "Accept: application/vnd.github+json"             "repos/${GITHUB_REPOSITORY}/actions/runs/${cli_run_id}/artifacts"             --jq '[.artifacts[] | select(.name == "cli-x86_64-unknown-linux-gnu" and .expired == false)] | length')"
          if [ "$artifact_count" -eq 0 ]; then
            echo "Linux CLI release artifact is unavailable for run $cli_run_id" >&2
            exit 1
          fi

          {
            echo "source_sha=$source_sha"
            echo "sha_tag=$short_sha"
            echo "devops_run_id=$devops_run_id"
            echo "cli_run_id=$cli_run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout validated source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.producers.outputs.source_sha }}
          fetch-depth: 0

      - name: Download Linux CLI release artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-x86_64-unknown-linux-gnu
          path: artifacts/cli-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.producers.outputs.cli_run_id }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run production-compose API/RPC/WS/CLI gate
        env:
          AEKO_CI_IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}
          AEKO_CI_IMAGE_TAG: ${{ steps.producers.outputs.sha_tag }}
          AEKO_CI_CLI_ARCHIVE: ${{ github.workspace }}/artifacts/cli-release/aeko-cli-x86_64-unknown-linux-gnu.tar.gz
          AEKO_CI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/runtime-contract
        run: bash scripts/ci-docker-full-stack-integration.sh

      - name: Upload runtime-contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeko-runtime-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-contract
          if-no-files-found: ignore
          retention-days: 7
