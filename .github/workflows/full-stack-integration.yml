name: AEKO Runtime Contract Integration

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: AEKO DevOps run that produced the runtime artifacts
        required: true
        type: string
      build_sha:
        description: Exact commit or merge SHA used to build the runtime artifacts
        required: true
        type: string
      source_head_sha:
        description: Source branch head SHA for producer provenance verification
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: aeko-runtime-contract-${{ inputs.producer_run_id }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: Ubuntu production-compose API/RPC/WS integration
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Verify producer run provenance
        id: producer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          BUILD_SHA: ${{ inputs.build_sha }}
          SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
        run: |
          set -euo pipefail
          : "${PRODUCER_RUN_ID:?producer run id is required}"
          : "${BUILD_SHA:?build SHA is required}"
          : "${SOURCE_HEAD_SHA:?source head SHA is required}"

          run_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}")"

          producer_repo="$(jq -r '.head_repository.full_name // empty' <<<"$run_json")"
          producer_head_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
          producer_event="$(jq -r '.event // empty' <<<"$run_json")"

          if [ "$producer_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "Runtime artifacts came from unexpected repository: $producer_repo" >&2
            exit 1
          fi
          if [ "$producer_head_sha" != "$SOURCE_HEAD_SHA" ]; then
            echo "Producer head SHA $producer_head_sha does not match expected source head $SOURCE_HEAD_SHA" >&2
            exit 1
          fi
          case "$producer_event" in
            pull_request|push|workflow_dispatch) ;;
            *)
              echo "Unsupported runtime artifact producer event: $producer_event" >&2
              exit 1
              ;;
          esac

          short_sha="${BUILD_SHA:0:12}"
          {
            echo "build_sha=$BUILD_SHA"
            echo "sha_tag=$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout validated build commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.producer.outputs.build_sha }}
          fetch-depth: 0

      - name: Download runtime tools artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-tools
          path: artifacts/runtime-tools
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Download network runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-network
          path: artifacts/runtime-network
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Download Explorer API runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-explorer-api
          path: artifacts/runtime-explorer-api
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Verify and load immutable runtime artifacts
        shell: bash
        env:
          EXPECTED_BUILD_SHA: ${{ steps.producer.outputs.build_sha }}
          SHA_TAG: ${{ steps.producer.outputs.sha_tag }}
        run: |
          set -euo pipefail

          for provenance in \
            artifacts/runtime-tools/ci-source-sha.txt \
            artifacts/runtime-network/ci-source-sha.txt \
            artifacts/runtime-explorer-api/ci-source-sha.txt \
            artifacts/runtime-tools/cli-release/ci-source-sha.txt
          do
            test -s "$provenance"
            actual_sha="$(tr -d '\r\n' < "$provenance")"
            if [ "$actual_sha" != "$EXPECTED_BUILD_SHA" ]; then
              echo "Artifact $provenance was built from $actual_sha, expected $EXPECTED_BUILD_SHA" >&2
              exit 1
            fi
          done

          gzip -dc artifacts/runtime-tools/aeko-tools-image.tar.gz | docker load
          gzip -dc artifacts/runtime-network/aeko-network-images.tar.gz | docker load
          gzip -dc artifacts/runtime-explorer-api/aeko-explorer-api-image.tar.gz | docker load

          for image in \
            aeko-tools \
            aeko-validator \
            aeko-faucet \
            aeko-social-bootstrap \
            aeko-protocol-bootstrap \
            aeko-explorer-api
          do
            docker image inspect "aeko-ci/${image}:${SHA_TAG}" >/dev/null
          done

          echo "Loaded exact runtime artifacts for $EXPECTED_BUILD_SHA without a registry pull."

      - name: Run production-compose API/RPC/WS/CLI gate
        env:
          AEKO_CI_IMAGE_REPOSITORY: aeko-ci
          AEKO_CI_IMAGE_TAG: ${{ steps.producer.outputs.sha_tag }}
          AEKO_CI_CLI_ARCHIVE: ${{ github.workspace }}/artifacts/runtime-tools/cli-release/aeko-cli-x86_64-unknown-linux-gnu.tar.gz
          AEKO_CI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/runtime-contract
        run: bash scripts/ci-docker-full-stack-integration.sh

      - name: Upload runtime-contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeko-runtime-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-contract
          if-no-files-found: ignore
          retention-days: 7
