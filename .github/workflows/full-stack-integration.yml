name: AEKO Runtime Contract Integration

on:
  workflow_call:
    inputs:
      selection_mode:
        description: Artifact selection policy
        required: true
        type: string
      producer_run_id:
        description: Current AEKO DevOps producer run for exact/overlay modes
        required: false
        type: string
      build_sha:
        description: Current build/merge SHA stamped into current artifacts
        required: false
        type: string
      source_head_sha:
        description: Current source branch head SHA
        required: false
        type: string
      target_ref:
        description: Baseline branch/ref
        required: true
        type: string
      use_current_tools:
        required: false
        default: false
        type: boolean
      use_current_network:
        required: false
        default: false
        type: boolean
      use_current_explorer_api:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      selection_mode:
        description: Artifact selection policy
        required: true
        default: exact
        type: choice
        options:
          - exact
          - overlay
          - last-success
      producer_run_id:
        description: Current AEKO DevOps producer run for exact/overlay modes
        required: false
        type: string
      build_sha:
        description: Current build/merge SHA stamped into current artifacts
        required: false
        type: string
      source_head_sha:
        description: Current source branch head SHA
        required: false
        type: string
      target_ref:
        description: Baseline branch/ref
        required: true
        type: string
      use_current_tools:
        required: false
        default: false
        type: boolean
      use_current_network:
        required: false
        default: false
        type: boolean
      use_current_explorer_api:
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  contents: read

concurrency:
  group: aeko-runtime-contract-${{ inputs.selection_mode }}-${{ inputs.target_ref }}-${{ inputs.producer_run_id || 'auto' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve / Runtime artifact sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checkout_sha: ${{ steps.resolve.outputs.checkout_sha }}
      runtime_tag_sha: ${{ steps.resolve.outputs.runtime_tag_sha }}
      tools_run_id: ${{ steps.resolve.outputs.tools_run_id }}
      tools_expected_sha: ${{ steps.resolve.outputs.tools_expected_sha }}
      network_run_id: ${{ steps.resolve.outputs.network_run_id }}
      network_expected_sha: ${{ steps.resolve.outputs.network_expected_sha }}
      explorer_run_id: ${{ steps.resolve.outputs.explorer_run_id }}
      explorer_expected_sha: ${{ steps.resolve.outputs.explorer_expected_sha }}
    steps:
      - name: Resolve exact, overlay, or known-good artifacts
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.selection_mode }}
          INPUT_RUN_ID: ${{ inputs.producer_run_id }}
          INPUT_BUILD_SHA: ${{ inputs.build_sha }}
          INPUT_SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
          TARGET_REF: ${{ inputs.target_ref }}
          USE_CURRENT_TOOLS: ${{ inputs.use_current_tools }}
          USE_CURRENT_NETWORK: ${{ inputs.use_current_network }}
          USE_CURRENT_EXPLORER_API: ${{ inputs.use_current_explorer_api }}
        run: |
          set -euo pipefail
          : "${TARGET_REF:?target ref is required}"

          artifact_exists() {
            local run_id="$1" name="$2"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" |
              jq -e --arg name "$name" '.artifacts | any(.name == $name and .expired == false)' >/dev/null
          }

          complete_runtime_run() {
            local run_id="$1"
            artifact_exists "$run_id" aeko-runtime-tools &&
              artifact_exists "$run_id" aeko-runtime-network &&
              artifact_exists "$run_id" aeko-runtime-explorer-api
          }

          compatible_with_current_source() {
            local candidate_sha="$1"
            [ -z "$INPUT_SOURCE_HEAD_SHA" ] && return 0
            [ "$candidate_sha" = "$INPUT_SOURCE_HEAD_SHA" ] && return 0
            local comparison merge_base
            comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$candidate_sha...$INPUT_SOURCE_HEAD_SHA" 2>/dev/null || true)"
            [ -n "$comparison" ] || return 1
            merge_base="$(jq -r '.merge_base_commit.sha // empty' <<<"$comparison")"
            [ "$merge_base" = "$candidate_sha" ]
          }

          resolve_baseline() {
            local runs candidate_id candidate_sha
            if [ -n "$INPUT_SOURCE_HEAD_SHA" ]; then
              runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build-images.yml/runs" -f status=success -f per_page=50)"
            else
              runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build-images.yml/runs" -f branch="$TARGET_REF" -f status=success -f per_page=30)"
            fi

            while IFS=$'\t' read -r candidate_id candidate_sha; do
              [ -n "$candidate_id" ] || continue
              [ "$candidate_id" = "${INPUT_RUN_ID:-}" ] && continue
              compatible_with_current_source "$candidate_sha" || continue
              if complete_runtime_run "$candidate_id"; then
                printf '%s\t%s\n' "$candidate_id" "$candidate_sha"
                return 0
              fi
            done < <(jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv' <<<"$runs")
            return 1
          }

          verify_current_run() {
            : "${INPUT_RUN_ID:?current producer_run_id is required}"
            : "${INPUT_BUILD_SHA:?current build_sha is required}"
            : "${INPUT_SOURCE_HEAD_SHA:?current source_head_sha is required}"
            local run_json
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID")"
            test "$(jq -r '.head_repository.full_name // empty' <<<"$run_json")" = "$GITHUB_REPOSITORY"
            test "$(jq -r '.head_sha // empty' <<<"$run_json")" = "$INPUT_SOURCE_HEAD_SHA"
          }

          checkout_sha="${INPUT_BUILD_SHA:-}"
          runtime_tag_sha="${INPUT_BUILD_SHA:-}"
          tools_run_id=""
          tools_expected_sha=""
          network_run_id=""
          network_expected_sha=""
          explorer_run_id=""
          explorer_expected_sha=""

          if [ "$MODE" = exact ]; then
            verify_current_run
            complete_runtime_run "$INPUT_RUN_ID"
            tools_run_id="$INPUT_RUN_ID"; tools_expected_sha="$INPUT_BUILD_SHA"
            network_run_id="$INPUT_RUN_ID"; network_expected_sha="$INPUT_BUILD_SHA"
            explorer_run_id="$INPUT_RUN_ID"; explorer_expected_sha="$INPUT_BUILD_SHA"
          elif [ "$MODE" = overlay ]; then
            verify_current_run
            baseline="$(resolve_baseline)" || {
              echo "No compatible successful runtime baseline exists for $TARGET_REF" >&2
              exit 1
            }
            IFS=$'\t' read -r baseline_run_id baseline_head_sha <<<"$baseline"

            if [ "$USE_CURRENT_TOOLS" = true ]; then
              artifact_exists "$INPUT_RUN_ID" aeko-runtime-tools
              tools_run_id="$INPUT_RUN_ID"; tools_expected_sha="$INPUT_BUILD_SHA"
            else
              tools_run_id="$baseline_run_id"
            fi
            if [ "$USE_CURRENT_NETWORK" = true ]; then
              artifact_exists "$INPUT_RUN_ID" aeko-runtime-network
              network_run_id="$INPUT_RUN_ID"; network_expected_sha="$INPUT_BUILD_SHA"
            else
              network_run_id="$baseline_run_id"
            fi
            if [ "$USE_CURRENT_EXPLORER_API" = true ]; then
              artifact_exists "$INPUT_RUN_ID" aeko-runtime-explorer-api
              explorer_run_id="$INPUT_RUN_ID"; explorer_expected_sha="$INPUT_BUILD_SHA"
            else
              explorer_run_id="$baseline_run_id"
            fi
          elif [ "$MODE" = last-success ]; then
            if [ -n "$INPUT_RUN_ID" ] && [ -n "$INPUT_BUILD_SHA" ] && [ -n "$INPUT_SOURCE_HEAD_SHA" ]; then
              verify_current_run
            fi
            baseline="$(resolve_baseline)" || {
              echo "No compatible successful runtime baseline exists for $TARGET_REF" >&2
              exit 1
            }
            IFS=$'\t' read -r baseline_run_id baseline_head_sha <<<"$baseline"
            tools_run_id="$baseline_run_id"
            network_run_id="$baseline_run_id"
            explorer_run_id="$baseline_run_id"
            if [ -z "$checkout_sha" ]; then checkout_sha="$baseline_head_sha"; fi
            if [ -z "$runtime_tag_sha" ]; then runtime_tag_sha="$baseline_head_sha"; fi
          else
            echo "Unsupported selection mode: $MODE" >&2
            exit 2
          fi

          : "${checkout_sha:?checkout SHA could not be resolved}"
          : "${runtime_tag_sha:?runtime tag SHA could not be resolved}"

          {
            echo "checkout_sha=$checkout_sha"
            echo "runtime_tag_sha=$runtime_tag_sha"
            echo "tools_run_id=$tools_run_id"
            echo "tools_expected_sha=$tools_expected_sha"
            echo "network_run_id=$network_run_id"
            echo "network_expected_sha=$network_expected_sha"
            echo "explorer_run_id=$explorer_run_id"
            echo "explorer_expected_sha=$explorer_expected_sha"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved $MODE runtime sources: tools=$tools_run_id network=$network_run_id explorer=$explorer_run_id"

  chain-contract:
    name: Chain Contract / Critical RPC + WebSocket
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout contract source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_sha }}
          fetch-depth: 0
      - name: Download runtime tools artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-tools
          path: artifacts/runtime-tools
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.tools_run_id }}
      - name: Download network runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-network
          path: artifacts/runtime-network
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.network_run_id }}
      - name: Download Explorer API runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-explorer-api
          path: artifacts/runtime-explorer-api
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.explorer_run_id }}
      - name: Verify provenance and load runtime images
        id: artifacts
        shell: bash
        env:
          RUNTIME_TAG_SHA: ${{ needs.resolve.outputs.runtime_tag_sha }}
          EXPECTED_TOOLS_SHA: ${{ needs.resolve.outputs.tools_expected_sha }}
          EXPECTED_NETWORK_SHA: ${{ needs.resolve.outputs.network_expected_sha }}
          EXPECTED_EXPLORER_SHA: ${{ needs.resolve.outputs.explorer_expected_sha }}
        run: bash .github/actions/devops/pipeline/load-runtime-artifacts.sh
      - name: Run critical chain contract
        env:
          AEKO_CI_IMAGE_REPOSITORY: aeko-ci
          AEKO_CI_IMAGE_TAG: ${{ steps.artifacts.outputs.sha_tag }}
          AEKO_CI_CLI_ARCHIVE: ${{ github.workspace }}/artifacts/runtime-tools/cli-release/aeko-cli-x86_64-unknown-linux-gnu.tar.gz
          AEKO_CI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/runtime-chain-contract
          AEKO_CI_CONTRACT_SCOPE: chain
        run: bash scripts/ci-docker-full-stack-integration.sh
      - name: Upload chain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeko-runtime-chain-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-chain-contract
          if-no-files-found: ignore
          retention-days: 7

  rpc-method-contract:
    name: RPC Method Contract / Individual JSON-RPC calls
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout contract source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_sha }}
          fetch-depth: 0
      - name: Download runtime tools artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-tools
          path: artifacts/runtime-tools
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.tools_run_id }}
      - name: Download network runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-network
          path: artifacts/runtime-network
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.network_run_id }}
      - name: Download Explorer API runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-explorer-api
          path: artifacts/runtime-explorer-api
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.explorer_run_id }}
      - name: Verify provenance and load runtime images
        id: artifacts
        shell: bash
        env:
          RUNTIME_TAG_SHA: ${{ needs.resolve.outputs.runtime_tag_sha }}
          EXPECTED_TOOLS_SHA: ${{ needs.resolve.outputs.tools_expected_sha }}
          EXPECTED_NETWORK_SHA: ${{ needs.resolve.outputs.network_expected_sha }}
          EXPECTED_EXPLORER_SHA: ${{ needs.resolve.outputs.explorer_expected_sha }}
        run: bash .github/actions/devops/pipeline/load-runtime-artifacts.sh
      - name: Probe every declared JSON-RPC method
        env:
          AEKO_CI_IMAGE_REPOSITORY: aeko-ci
          AEKO_CI_IMAGE_TAG: ${{ steps.artifacts.outputs.sha_tag }}
          AEKO_CI_CLI_ARCHIVE: ${{ github.workspace }}/artifacts/runtime-tools/cli-release/aeko-cli-x86_64-unknown-linux-gnu.tar.gz
          AEKO_CI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/runtime-rpc-methods
          AEKO_CI_CONTRACT_SCOPE: rpc-methods
        run: bash scripts/ci-docker-full-stack-integration.sh
      - name: Upload RPC method results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeko-runtime-rpc-methods-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-rpc-methods
          if-no-files-found: ignore
          retention-days: 7

  backend-contract:
    name: Backend Contract / ${{ matrix.flow }}
    needs: resolve
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        flow:
          - route-surface
          - settings
          - funding-public
          - funding-admin
          - funding-airdrop
          - social-protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout contract source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_sha }}
          fetch-depth: 0
      - name: Download runtime tools artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-tools
          path: artifacts/runtime-tools
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.tools_run_id }}
      - name: Download network runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-network
          path: artifacts/runtime-network
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.network_run_id }}
      - name: Download Explorer API runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-explorer-api
          path: artifacts/runtime-explorer-api
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.explorer_run_id }}
      - name: Verify provenance and load runtime images
        id: artifacts
        shell: bash
        env:
          RUNTIME_TAG_SHA: ${{ needs.resolve.outputs.runtime_tag_sha }}
          EXPECTED_TOOLS_SHA: ${{ needs.resolve.outputs.tools_expected_sha }}
          EXPECTED_NETWORK_SHA: ${{ needs.resolve.outputs.network_expected_sha }}
          EXPECTED_EXPLORER_SHA: ${{ needs.resolve.outputs.explorer_expected_sha }}
        run: bash .github/actions/devops/pipeline/load-runtime-artifacts.sh
      - name: Run backend interaction flow
        env:
          AEKO_CI_IMAGE_REPOSITORY: aeko-ci
          AEKO_CI_IMAGE_TAG: ${{ steps.artifacts.outputs.sha_tag }}
          AEKO_CI_CLI_ARCHIVE: ${{ github.workspace }}/artifacts/runtime-tools/cli-release/aeko-cli-x86_64-unknown-linux-gnu.tar.gz
          AEKO_CI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/runtime-backend-${{ matrix.flow }}
          AEKO_CI_CONTRACT_SCOPE: application
          AEKO_CI_APPLICATION_FLOW: ${{ matrix.flow }}
        run: bash scripts/ci-docker-full-stack-integration.sh
      - name: Upload backend flow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeko-runtime-backend-${{ matrix.flow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-backend-${{ matrix.flow }}
          if-no-files-found: ignore
          retention-days: 7

  cli-contract:
    name: CLI Contract / Release binary
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout contract source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.checkout_sha }}
          fetch-depth: 0
      - name: Download runtime tools artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-tools
          path: artifacts/runtime-tools
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.tools_run_id }}
      - name: Download network runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-network
          path: artifacts/runtime-network
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.network_run_id }}
      - name: Download Explorer API runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-explorer-api
          path: artifacts/runtime-explorer-api
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.explorer_run_id }}
      - name: Verify provenance and load runtime images
        id: artifacts
        shell: bash
        env:
          RUNTIME_TAG_SHA: ${{ needs.resolve.outputs.runtime_tag_sha }}
          EXPECTED_TOOLS_SHA: ${{ needs.resolve.outputs.tools_expected_sha }}
          EXPECTED_NETWORK_SHA: ${{ needs.resolve.outputs.network_expected_sha }}
          EXPECTED_EXPLORER_SHA: ${{ needs.resolve.outputs.explorer_expected_sha }}
        run: bash .github/actions/devops/pipeline/load-runtime-artifacts.sh
      - name: Run CLI contract
        env:
          AEKO_CI_IMAGE_REPOSITORY: aeko-ci
          AEKO_CI_IMAGE_TAG: ${{ steps.artifacts.outputs.sha_tag }}
          AEKO_CI_CLI_ARCHIVE: ${{ github.workspace }}/artifacts/runtime-tools/cli-release/aeko-cli-x86_64-unknown-linux-gnu.tar.gz
          AEKO_CI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/runtime-cli-contract
          AEKO_CI_CONTRACT_SCOPE: protocol
        run: bash scripts/ci-docker-full-stack-integration.sh
      - name: Upload CLI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeko-runtime-cli-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime-cli-contract
          if-no-files-found: ignore
          retention-days: 7

  runtime-contract-summary:
    name: Summary / Runtime contract
    if: always()
    needs:
      - resolve
      - chain-contract
      - rpc-method-contract
      - backend-contract
      - cli-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate contract results
        shell: bash
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          CHAIN_RESULT: ${{ needs.chain-contract.result }}
          RPC_METHOD_RESULT: ${{ needs.rpc-method-contract.result }}
          BACKEND_RESULT: ${{ needs.backend-contract.result }}
          CLI_RESULT: ${{ needs.cli-contract.result }}
        run: |
          set -euo pipefail
          {
            echo "## AEKO runtime contract result"
            echo
            echo "| Contract | Result |"
            echo "| --- | --- |"
            echo "| Artifact resolution | $RESOLVE_RESULT |"
            echo "| Critical RPC + WebSocket | $CHAIN_RESULT |"
            echo "| Individual RPC methods | $RPC_METHOD_RESULT |"
            echo "| Backend interaction flows | $BACKEND_RESULT |"
            echo "| Release CLI | $CLI_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for result in "$RESOLVE_RESULT" "$CHAIN_RESULT" "$RPC_METHOD_RESULT" "$BACKEND_RESULT" "$CLI_RESULT"; do
            [ "$result" = "success" ] || failed=1
          done
          [ "$failed" -eq 0 ] || { echo "One or more runtime contract shards failed or were skipped." >&2; exit 1; }
          echo "[PASS] all runtime contract shards passed"
