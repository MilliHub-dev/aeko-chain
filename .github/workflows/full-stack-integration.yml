name: AEKO Full Stack Docker Integration

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeko-full-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-full-stack:
    name: Ubuntu Docker full-stack integration
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run built-image integration gate
        env:
          AEKO_CI_IMAGE_TAG: ${{ github.sha }}
          AEKO_CI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/full-stack
        run: bash scripts/ci-docker-full-stack-integration.sh

      - name: Upload full-stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeko-full-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/full-stack
          if-no-files-found: ignore
          retention-days: 7
