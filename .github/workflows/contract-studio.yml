name: AEKO Contract Studio

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/explorer/editor/**"
      - "docker/Dockerfile"
      - ".github/actions/devops/explorer-editor/**"
      - ".github/workflows/contract-studio.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/explorer/editor/**"
      - "docker/Dockerfile"
      - ".github/actions/devops/explorer-editor/**"
      - ".github/workflows/contract-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeko-contract-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Studio / Quality and image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Studio
        uses: ./.github/actions/devops/explorer-editor
        with:
          validate-source: "true"
          build-image: "true"
          sha-tag: ${{ github.sha }}

  publish:
    name: Studio / Publish and deploy
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Contract Studio image
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}
          SHA_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build             --target editor-web             -t "$IMAGE_REPOSITORY/aeko-editor-web:$SHA_TAG"             -t "$IMAGE_REPOSITORY/aeko-editor-web:latest"             -f docker/Dockerfile .
          docker push "$IMAGE_REPOSITORY/aeko-editor-web:$SHA_TAG"
          docker push "$IMAGE_REPOSITORY/aeko-editor-web:latest"

      - name: Trigger Contract Studio deployment
        if: ${{ secrets.WEBHOOK_EXPLORER_EDITOR != '' && secrets.WEBHOOK_API_KEY != '' }}
        shell: bash
        env:
          DEPLOY_ENDPOINT: ${{ secrets.WEBHOOK_EXPLORER_EDITOR }}
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $WEBHOOK_API_KEY"             "$DEPLOY_ENDPOINT"
