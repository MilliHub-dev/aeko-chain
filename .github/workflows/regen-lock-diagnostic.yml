name: Regenerate stale Cargo lockfile

on:
  push:
    branches:
      - fix/rust-sdk-lock-node24-actions

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'MilliHub-dev/aeko-chain' && github.ref == 'refs/heads/fix/rust-sdk-lock-node24-actions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Regenerate and verify the lockfile delta
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          cargo check -p aeko-rust-sdk --all-targets

          echo '=== Cargo.lock resolver diff ==='
          git diff -- Cargo.lock

          test "$(git diff --numstat -- Cargo.lock)" = $'1\t0\tCargo.lock'
          git diff -- Cargo.lock | grep -F '+ "aeko-social-monetization-program",'

          if [ -n "$(git status --porcelain --untracked-files=no | grep -v '^ M Cargo.lock$' || true)" ]; then
            echo 'Unexpected tracked files changed while regenerating Cargo.lock.' >&2
            git status --short
            exit 1
          fi

      - name: Commit Cargo-generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: refresh Cargo.lock for explorer monetization dependency'
          git push origin "HEAD:${GITHUB_REF_NAME}"
