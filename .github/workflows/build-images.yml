name: Build AEKO Network Images

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aeko
          POSTGRES_PASSWORD: aeko
          POSTGRES_DB: aeko_explorer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeko -d aeko_explorer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployment contracts
        shell: bash
        env:
          AEKO_PUBLIC_IP: 203.0.113.10
          AEKO_KEYS_DIR: ../files/aeko-keys
          EXPLORER_DATABASE_URL: postgres://aeko:aeko@postgres:5432/aeko_explorer
          AEKO_IMAGE_TAG: ci
        run: |
          set -euo pipefail
          bash -n docker/validator-entrypoint.sh
          bash -n scripts/deploy-testnet.sh
          python3 scripts/validate-deployment-contract.py
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.dokploy.yml config >/dev/null

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.3
        with:
          version: "v0.5.4"

      - name: Validate Explorer PostgreSQL backend
        env:
          AEKO_EXPLORER_TEST_DATABASE_URL: postgres://aeko:aeko@127.0.0.1:5432/aeko_explorer_test
        run: cargo test -p aeko-explorer-backend

      - name: Validate Explorer web backend contract
        working-directory: apps/explorer/web
        run: |
          npm ci
          npm test
          # The application already has unrelated repository-wide ESLint debt.
          # Gate the Explorer/backend contract and the active network/social
          # acceptance surfaces directly, then use the Vite production build
          # as the broad frontend integration check.
          npx eslint \
            src/components/NetworkConsoleModal.jsx \
            src/components/NetworkConsoleModalV2.jsx \
            src/components/social/NetworkSocialModal.jsx \
            src/pages/Faucet.jsx \
            src/pages/SocialTestV2.jsx \
            src/utils/explorerApi.js \
            src/utils/explorerData.js \
            src/utils/aekoRpcClient.js \
            src/utils/aekoWsClient.js \
            src/utils/aekoSocialActions.js \
            src/utils/aekoSocialNft.js \
            src/utils/socialConsoleState.js \
            src/utils/testConsoleApi.js \
            src/utils/aekoRpcClient.test.js \
            src/utils/aekoWsClient.test.js \
            src/utils/explorerData.test.js \
            src/utils/explorerSourcePolicy.test.js \
            src/utils/networkConsoleContract.test.js \
            src/utils/socialConsoleState.test.js
          npm run build

      - name: Validate Node Social SDK wire contract
        working-directory: apps/sdk/node
        run: |
          npm ci
          npm run release:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build complete network image set
        shell: bash
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          PUSH_ARGS=()
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            : "${REGISTRY_USER:?DOCKERHUB_USERNAME secret is required for image publishing}"
            PUSH_ARGS+=(--push)
          else
            PUSH_ARGS+=(--load)
          fi

          build_target() {
            local target="$1"
            shift
            local tags=()
            local build_args=()
            local image
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              # Use the same role names consumed by docker-compose.yml so the
              # exact images built for the PR can be booted for dogfood.
              for image in "$@"; do
                tags+=(--tag "aeko-ci/${image}:${SHA_TAG}")
              done
              if [ "$target" = "explorer-ui" ]; then
                build_args+=(
                  --build-arg VITE_AEKO_LOCAL_RPC=http://127.0.0.1:8899
                  --build-arg VITE_AEKO_LOCAL_WS=ws://127.0.0.1:8900
                  --build-arg VITE_AEKO_LOCAL_EXPLORER_API=http://127.0.0.1:8088
                )
              fi
            else
              for image in "$@"; do
                tags+=(--tag "${REGISTRY_USER}/${image}:latest")
                tags+=(--tag "${REGISTRY_USER}/${image}:${SHA_TAG}")
              done
            fi
            echo "==> Building ${target}"
            docker buildx build \
              --file Dockerfile \
              --target "${target}" \
              "${build_args[@]}" \
              "${tags[@]}" \
              "${PUSH_ARGS[@]}" \
              .
          }

          build_target validator aeko-validator aeko-node
          build_target faucet aeko-faucet
          build_target social-bootstrap aeko-social-bootstrap
          build_target tools aeko-tools
          build_target explorer-api aeko-explorer-api aeko-explorer-backend
          build_target explorer-ui aeko-explorer-ui

      - name: Dogfood PR-built network and Social custody flow
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          export AEKO_IMAGE_REPOSITORY=aeko-ci
          export AEKO_IMAGE_TAG="$SHA_TAG"
          export AEKO_KEYS_DIR="$PWD/local-testnet"
          export EXPLORER_DATABASE_URL='postgres://aeko:aeko@postgres:5432/aeko_explorer_ci'

          cleanup() {
            docker rm -f aeko-ci-postgres >/dev/null 2>&1 || true
            docker compose -f docker-compose.yml down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          mkdir -p "$AEKO_KEYS_DIR"
          for key in faucet-keypair stake-keypair validator-1-keypair vote-1-keypair rpc-node-keypair; do
            docker run --rm \
              -v "$AEKO_KEYS_DIR:/keys" \
              "aeko-ci/aeko-tools:${SHA_TAG}" \
              aeko-keygen new --no-bip39-passphrase --silent --outfile "/keys/${key}.json"
          done

          # Starting faucet creates the canonical Compose network. Attach an
          # isolated PostgreSQL instance to that same network so Explorer uses
          # a real database without adding PostgreSQL to the production stack.
          docker compose -f docker-compose.yml up -d faucet
          COMPOSE_NETWORK=$(docker inspect aeko-faucet --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')
          test -n "$COMPOSE_NETWORK"
          docker run -d --name aeko-ci-postgres \
            --network "$COMPOSE_NETWORK" \
            --network-alias postgres \
            -e POSTGRES_USER=aeko \
            -e POSTGRES_PASSWORD=aeko \
            -e POSTGRES_DB=aeko_explorer_ci \
            postgres:16-alpine >/dev/null

          for _ in $(seq 1 30); do
            if docker exec aeko-ci-postgres pg_isready -U aeko -d aeko_explorer_ci >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec aeko-ci-postgres pg_isready -U aeko -d aeko_explorer_ci

          docker compose -f docker-compose.yml up -d validator social-bootstrap explorer-api explorer-ui

          RPC_READY=0
          for _ in $(seq 1 90); do
            HEALTH=$(curl -sS --max-time 3 -X POST -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
              http://127.0.0.1:8899 2>/dev/null || true)
            if printf '%s' "$HEALTH" | grep -q '"result":"ok"'; then
              RPC_READY=1
              break
            fi
            sleep 2
          done
          if [ "$RPC_READY" -ne 1 ]; then
            docker logs --tail 120 aeko-validator || true
            exit 1
          fi

          API_READY=0
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 3 http://127.0.0.1:8088/health >/dev/null 2>&1; then
              API_READY=1
              break
            fi
            sleep 2
          done
          if [ "$API_READY" -ne 1 ]; then
            docker logs --tail 120 aeko-social-bootstrap || true
            docker logs --tail 120 aeko-explorer-api || true
            exit 1
          fi

          AEKO_RPC_URL=http://127.0.0.1:8899 \
          AEKO_EXPLORER_API_URL=http://127.0.0.1:8088 \
            python3 scripts/smoke-aeko-social.py

          curl -fsS http://127.0.0.1:4000/ >/dev/null

          # Execute the actual SocialTestV2 page in a real browser. The page
          # creates/signs with its own browser-local test wallet and only marks
          # the full flow PASS after post/NFT/engagement/custody records are
          # confirmed on RPC and observed through Explorer projections.
          BROWSER_DIR=$(mktemp -d)
          cd "$BROWSER_DIR"
          npm init -y >/dev/null 2>&1
          npm install --silent --ignore-scripts playwright@1.55.0
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$CHROME_BIN" ]; then
            npx playwright install --with-deps chromium
          fi
          export CHROME_BIN
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const executablePath = process.env.CHROME_BIN || undefined;
          const browser = await chromium.launch({
            headless: true,
            executablePath,
            args: ['--no-sandbox'],
          });
          const page = await browser.newPage();
          const consoleErrors = [];
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('pageerror', (error) => consoleErrors.push(error.message));

          try {
            const response = await page.goto('http://127.0.0.1:4000/network-tools/social-e2e', {
              waitUntil: 'domcontentloaded',
              timeout: 30_000,
            });
            if (!response?.ok()) throw new Error(`Social E2E page returned HTTP ${response?.status()}`);
            const runButton = page.getByRole('button', { name: 'Run custody + asset flow' });
            await runButton.waitFor({ state: 'visible', timeout: 30_000 });
            await runButton.click();

            const success = 'Post + NFT + engagement + real stake escrow + real tip transfer + Explorer projections all passed.';
            let finalState = 'running';
            let excerpt = '';
            for (let attempt = 0; attempt < 300; attempt += 1) {
              const result = await page.evaluate((successText) => {
                const text = document.body.innerText;
                if (text.includes(successText)) return { state: 'pass', excerpt: successText };
                const marker = text.indexOf('Full custody + asset flow');
                const sample = marker >= 0 ? text.slice(marker, marker + 900) : text.slice(0, 900);
                if (sample.includes('FAIL')) return { state: 'fail', excerpt: sample };
                return { state: 'running', excerpt: sample };
              }, success);
              finalState = result.state;
              excerpt = result.excerpt;
              if (finalState !== 'running') break;
              await page.waitForTimeout(1_000);
            }
            if (finalState !== 'pass') {
              throw new Error(`SocialTestV2 did not pass. State=${finalState}. UI evidence: ${excerpt}`);
            }
            console.log('[PASS] SocialTestV2 signed custody + NFT flow passed against PR-built runtime');
            if (consoleErrors.length) console.log('[browser console errors observed]', consoleErrors.join('\n'));
          } finally {
            await browser.close();
          }
          NODE
