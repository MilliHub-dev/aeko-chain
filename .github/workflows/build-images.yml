name: AEKO DevOps (single runner)

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeko-devops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  devops:
    # Deliberately one job: every local composite action below executes on this
    # same ubuntu-latest VM and shares its checkout, caches, Docker daemon,
    # Buildx builder, authentication, and filesystem.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed domains
        id: changes
        uses: ./.github/actions/devops/detect-changes

      - name: Reject unowned app paths
        if: steps.changes.outputs.unmapped_app == 'true'
        shell: bash
        run: |
          echo "An apps/** path changed without explicit DevOps ownership." >&2
          echo "Add a classifier mapping and self-contained app action before merging." >&2
          exit 1

      - name: Resolve release mode
        id: release
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          printf 'Release mode: publish=%s sha=%s\n' "$publish" "${GITHUB_SHA::12}"

      - name: Install pinned Rust toolchain and native prerequisites
        if: steps.changes.outputs.rust_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.0
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          fi
          rustc --version
          cargo --version
          protoc --version

      - name: Set up shared Rust compilation cache
        if: steps.changes.outputs.rust_needed == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Set up shared Node runtime/cache
        if: steps.changes.outputs.node_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/explorer/web/package-lock.json
            apps/sdk/js/package-lock.json
            apps/sdk/node/package-lock.json

      - name: Set up shared Python runtime
        if: steps.changes.outputs.python_needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up shared Docker Buildx
        if: >-
          steps.changes.outputs.core == 'true' ||
          steps.changes.outputs.packaging == 'true' ||
          steps.changes.outputs.admin == 'true' ||
          steps.changes.outputs.cli == 'true' ||
          steps.changes.outputs.explorer_backend == 'true' ||
          steps.changes.outputs.explorer_web == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub once
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.dockerized == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Phase 2: lightweight/independent validation. These processes share the
      # same checkout and tool/cache environment but do not contend on a Cargo
      # build graph. Network formatting uses a detached temporary worktree, so
      # it never mutates the primary checkout while the other readers execute.
      - name: Parallel independent validation
        id: parallel_validation
        if: >-
          steps.changes.outputs.admin == 'true' ||
          steps.changes.outputs.explorer_web == 'true' ||
          steps.changes.outputs.sdk_js == 'true' ||
          steps.changes.outputs.sdk_node == 'true' ||
          steps.changes.outputs.sdk_python == 'true' ||
          steps.changes.outputs.core == 'true' ||
          steps.changes.outputs.packaging == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          RUN_ADMIN: ${{ steps.changes.outputs.admin }}
          RUN_EXPLORER_WEB: ${{ steps.changes.outputs.explorer_web }}
          SDK_JS: ${{ steps.changes.outputs.sdk_js }}
          SDK_NODE: ${{ steps.changes.outputs.sdk_node }}
          SDK_PYTHON: ${{ steps.changes.outputs.sdk_python }}
          RELEASE_JS: ${{ steps.changes.outputs.sdk_release_js }}
          RELEASE_NODE: ${{ steps.changes.outputs.sdk_release_node }}
          RELEASE_PYTHON: ${{ steps.changes.outputs.sdk_release_python }}
          RUN_NETWORK_PREFLIGHT: ${{ (steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}
          NETWORK_VALIDATE_SOURCE: ${{ steps.changes.outputs.core }}
          SHA_TAG: ${{ steps.release.outputs.sha_tag }}
        run: |
          set -uo pipefail

          admin_outcome="skipped"
          explorer_web_outcome="skipped"
          sdk_js_outcome="skipped"
          sdk_node_outcome="skipped"
          sdk_python_outcome="skipped"
          network_preflight_outcome="skipped"
          sdk_non_rust_outcome="skipped"
          declare -A pids=()

          status_to_outcome() {
            case "$1" in
              0) printf 'success' ;;
              130|143) printf 'cancelled' ;;
              *) printf 'failure' ;;
            esac
          }

          launch() {
            local key="$1"
            shift
            echo "Launching ${key} validation on the shared runner."
            (
              "$@"
            ) > >(sed -u "s/^/[${key}] /") 2> >(sed -u "s/^/[${key}] /" >&2) &
            pids["$key"]=$!
          }

          cleanup() {
            local pid
            for pid in "${pids[@]:-}"; do
              kill "$pid" 2>/dev/null || true
            done
          }
          trap 'cleanup; exit 130' INT
          trap 'cleanup; exit 143' TERM

          sdk_result="${RUNNER_TEMP}/aeko-sdk-non-rust-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.out"
          rm -f "$sdk_result"

          if [ "$RUN_ADMIN" = "true" ]; then
            launch admin env HOST_BUILD=false bash .github/actions/devops/admin/validate.sh
          fi

          if [ "$RUN_EXPLORER_WEB" = "true" ]; then
            launch explorer-web env               VALIDATE_SOURCE=true               HOST_BUILD=false               BUILD_IMAGE=false               PUBLISH=false               SHA_TAG="$SHA_TAG"               bash .github/actions/devops/explorer-web/run.sh
          fi

          if [ "$SDK_JS" = "true" ] || [ "$SDK_NODE" = "true" ] || [ "$SDK_PYTHON" = "true" ]; then
            launch sdk-non-rust env               SDK_JS="$SDK_JS"               SDK_NODE="$SDK_NODE"               SDK_PYTHON="$SDK_PYTHON"               RELEASE_JS="$RELEASE_JS"               RELEASE_NODE="$RELEASE_NODE"               RELEASE_PYTHON="$RELEASE_PYTHON"               RESULT_FILE="$sdk_result"               bash .github/actions/devops/sdk/validate-non-rust.sh
          fi

          if [ "$RUN_NETWORK_PREFLIGHT" = "true" ]; then
            launch network-preflight env               VALIDATE_SOURCE="$NETWORK_VALIDATE_SOURCE"               PUBLISH=false               bash .github/actions/devops/network/preflight.sh
          fi

          wait_child() {
            local key="$1"
            local variable="$2"
            local status outcome
            if [ -z "${pids[$key]+x}" ]; then
              return 0
            fi
            wait "${pids[$key]}"
            status=$?
            outcome="$(status_to_outcome "$status")"
            printf -v "$variable" '%s' "$outcome"
          }

          wait_child admin admin_outcome
          wait_child explorer-web explorer_web_outcome
          wait_child sdk-non-rust sdk_non_rust_outcome
          wait_child network-preflight network_preflight_outcome

          if [ -f "$sdk_result" ]; then
            # The SDK runner writes only fixed outcome keys.
            # shellcheck disable=SC1090
            source "$sdk_result"
          elif [ "$sdk_non_rust_outcome" != "skipped" ]; then
            [ "$SDK_JS" = "true" ] && sdk_js_outcome="$sdk_non_rust_outcome"
            [ "$SDK_NODE" = "true" ] && sdk_node_outcome="$sdk_non_rust_outcome"
            [ "$SDK_PYTHON" = "true" ] && sdk_python_outcome="$sdk_non_rust_outcome"
          fi
          rm -f "$sdk_result"

          {
            echo "admin_outcome=$admin_outcome"
            echo "explorer_web_outcome=$explorer_web_outcome"
            echo "sdk_js_outcome=$sdk_js_outcome"
            echo "sdk_node_outcome=$sdk_node_outcome"
            echo "sdk_python_outcome=$sdk_python_outcome"
            echo "network_preflight_outcome=$network_preflight_outcome"
          } >> "$GITHUB_OUTPUT"

          printf 'Parallel validation outcomes: admin=%s web=%s sdk-js=%s sdk-node=%s sdk-python=%s network-preflight=%s\n'             "$admin_outcome" "$explorer_web_outcome" "$sdk_js_outcome"             "$sdk_node_outcome" "$sdk_python_outcome" "$network_preflight_outcome"

          case "$admin_outcome:$explorer_web_outcome:$sdk_js_outcome:$sdk_node_outcome:$sdk_python_outcome:$network_preflight_outcome" in
            *failure*|*cancelled*) exit 1 ;;
          esac

      # Phase 3: Rust-heavy validation. GitHub steps inside one job are
      # sequential, intentionally enforcing a concurrency limit of one large
      # Cargo graph at a time while preserving the shared sccache/target state.
      - name: Validate CLI Rust workload
        id: cli_validation
        if: steps.changes.outputs.cli == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/cli
        with:
          validate-source: "true"
          host-build: "false"
          build-image: "false"
          publish: "false"
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Validate Explorer backend Rust workload
        id: explorer_backend_validation
        if: steps.changes.outputs.explorer_backend == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/explorer-backend
        with:
          validate-source: "true"
          host-build: "false"
          build-image: "false"
          publish: "false"
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Validate Rust SDK workload
        id: sdk_rust_validation
        if: steps.changes.outputs.sdk_rust == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/sdk
        with:
          js: "false"
          node: "false"
          python: "false"
          rust: "true"
          release-js: "false"
          release-node: "false"
          release-python: "false"
          release-rust: ${{ steps.changes.outputs.sdk_release_rust }}

      - name: Validate blockchain network Rust workload
        id: network_validation
        if: steps.changes.outputs.core == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/network
        with:
          run-preflight: "false"
          validate-source: "true"
          build-image: "false"
          publish: "false"
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      # Phase 4: image builds are isolated from source validation and run only
      # for selected deployable domains. Each image has a stable GHA BuildKit
      # cache scope, so fresh hosted runners can import/export compiler/layer
      # cache rather than relying only on ephemeral local BuildKit mounts.
      - name: Build selected network images
        id: network_image
        if: >-
          (github.event_name == 'pull_request' || success()) &&
          (steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') &&
          steps.parallel_validation.outputs.network_preflight_outcome == 'success' &&
          (steps.changes.outputs.core != 'true' || steps.network_validation.outcome == 'success')
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/network
        with:
          run-preflight: "false"
          validate-source: "false"
          build-image: "true"
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Build selected CLI image
        id: cli_image
        if: >-
          (github.event_name == 'pull_request' || success()) &&
          (steps.changes.outputs.cli == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')) &&
          (steps.changes.outputs.cli != 'true' || steps.cli_validation.outcome == 'success')
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/cli
        with:
          validate-source: "false"
          host-build: "false"
          build-image: "true"
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Build selected Explorer backend image
        id: explorer_backend_image
        if: >-
          (github.event_name == 'pull_request' || success()) &&
          (steps.changes.outputs.explorer_backend == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')) &&
          (steps.changes.outputs.explorer_backend != 'true' || steps.explorer_backend_validation.outcome == 'success')
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/explorer-backend
        with:
          validate-source: "false"
          host-build: "false"
          build-image: "true"
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Build selected Explorer frontend image
        id: explorer_web_image
        if: >-
          (github.event_name == 'pull_request' || success()) &&
          (steps.changes.outputs.explorer_web == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')) &&
          (steps.changes.outputs.explorer_web != 'true' || steps.parallel_validation.outputs.explorer_web_outcome == 'success')
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/explorer-web
        with:
          validate-source: "false"
          build-image: "true"
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Build selected admin image
        id: admin_image
        if: >-
          (github.event_name == 'pull_request' || success()) &&
          (steps.changes.outputs.admin == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')) &&
          (steps.changes.outputs.admin != 'true' || steps.parallel_validation.outputs.admin_outcome == 'success')
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/admin
        with:
          validate-source: "false"
          build-image: "true"
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      # Phase 5: report the actual domain and phase that failed. PR domain
      # steps use continue-on-error so independent selected domains still run.
      - name: Aggregate pull-request validation results
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          PARALLEL_OUTCOME: ${{ steps.parallel_validation.outcome }}
          ADMIN_VALIDATION: ${{ steps.parallel_validation.outputs.admin_outcome }}
          EXPLORER_WEB_VALIDATION: ${{ steps.parallel_validation.outputs.explorer_web_outcome }}
          SDK_JS_VALIDATION: ${{ steps.parallel_validation.outputs.sdk_js_outcome }}
          SDK_NODE_VALIDATION: ${{ steps.parallel_validation.outputs.sdk_node_outcome }}
          SDK_PYTHON_VALIDATION: ${{ steps.parallel_validation.outputs.sdk_python_outcome }}
          NETWORK_PREFLIGHT: ${{ steps.parallel_validation.outputs.network_preflight_outcome }}
          CLI_VALIDATION: ${{ steps.cli_validation.outcome }}
          EXPLORER_BACKEND_VALIDATION: ${{ steps.explorer_backend_validation.outcome }}
          SDK_RUST_VALIDATION: ${{ steps.sdk_rust_validation.outcome }}
          NETWORK_VALIDATION: ${{ steps.network_validation.outcome }}
          NETWORK_IMAGE: ${{ steps.network_image.outcome }}
          CLI_IMAGE: ${{ steps.cli_image.outcome }}
          EXPLORER_BACKEND_IMAGE: ${{ steps.explorer_backend_image.outcome }}
          EXPLORER_WEB_IMAGE: ${{ steps.explorer_web_image.outcome }}
          ADMIN_IMAGE: ${{ steps.admin_image.outcome }}
        run: |
          set -euo pipefail
          failures=()

          record_failure() {
            local label="$1"
            local outcome="$2"
            case "$outcome" in
              failure|cancelled)
                failures+=("${label}:${outcome}")
                ;;
            esac
          }

          record_failure "admin:validation" "$ADMIN_VALIDATION"
          record_failure "explorer-web:validation" "$EXPLORER_WEB_VALIDATION"
          record_failure "sdk-js:validation" "$SDK_JS_VALIDATION"
          record_failure "sdk-node:validation" "$SDK_NODE_VALIDATION"
          record_failure "sdk-python:validation" "$SDK_PYTHON_VALIDATION"
          record_failure "network:preflight" "$NETWORK_PREFLIGHT"
          record_failure "cli:rust-validation" "$CLI_VALIDATION"
          record_failure "explorer-backend:rust-validation" "$EXPLORER_BACKEND_VALIDATION"
          record_failure "sdk-rust:validation" "$SDK_RUST_VALIDATION"
          record_failure "network:rust-validation" "$NETWORK_VALIDATION"
          record_failure "network:image" "$NETWORK_IMAGE"
          record_failure "cli:image" "$CLI_IMAGE"
          record_failure "explorer-backend:image" "$EXPLORER_BACKEND_IMAGE"
          record_failure "explorer-web:image" "$EXPLORER_WEB_IMAGE"
          record_failure "admin:image" "$ADMIN_IMAGE"

          # Fail closed if the parallel orchestrator itself died before it could
          # emit a concrete child result.
          if [ "$PARALLEL_OUTCOME" = "failure" ] || [ "$PARALLEL_OUTCOME" = "cancelled" ]; then
            concrete_failure=false
            for outcome in               "$ADMIN_VALIDATION" "$EXPLORER_WEB_VALIDATION" "$SDK_JS_VALIDATION"               "$SDK_NODE_VALIDATION" "$SDK_PYTHON_VALIDATION" "$NETWORK_PREFLIGHT"; do
              case "$outcome" in
                failure|cancelled) concrete_failure=true ;;
              esac
            done
            if [ "$concrete_failure" != "true" ]; then
              failures+=("parallel-validation:${PARALLEL_OUTCOME}")
            fi
          fi

          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'One or more selected PR domains failed:\n' >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi

          echo "All selected PR domains and image gates passed."

      # Package registries are irreversible release channels, so publish SDKs
      # only after every selected validation/build succeeds.
      - name: Publish changed SDK packages
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.sdk_release_any == 'true'
        uses: ./.github/actions/devops/sdk-publish
        with:
          js: ${{ steps.changes.outputs.sdk_release_js }}
          node: ${{ steps.changes.outputs.sdk_release_node }}
          python: ${{ steps.changes.outputs.sdk_release_python }}
          rust: ${{ steps.changes.outputs.sdk_release_rust }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          crates-token: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Promote only validated Docker images to latest
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.dockerized == 'true'
        uses: ./.github/actions/devops/promote-images
        with:
          registry-user: ${{ secrets.DOCKERHUB_USERNAME }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}
          network: ${{ (steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}
          admin: ${{ (steps.changes.outputs.admin == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}
          cli: ${{ (steps.changes.outputs.cli == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}
          explorer-backend: ${{ (steps.changes.outputs.explorer_backend == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}
          explorer-web: ${{ (steps.changes.outputs.explorer_web == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}

      - name: Trigger production deployment after successful promotion
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.deployable == 'true'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
        run: |
          set -euo pipefail
          : "${WEBHOOK_URL:?WEBHOOK_URL secret is required}"
          : "${WEBHOOK_API_KEY:?WEBHOOK_API_KEY secret is required}"
          # GitHub secrets can accidentally include a trailing CR/LF when copied.
          # Coolify's deploy endpoint is POST-only; normalize only line endings,
          # never echo either secret.
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '\r\n')"
          WEBHOOK_API_KEY="$(printf '%s' "$WEBHOOK_API_KEY" | tr -d '\r\n')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${WEBHOOK_API_KEY}" \
            "$WEBHOOK_URL"
