name: AEKO DevOps (single runner)

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "contracts/**"
      - "scripts/smoke-hello-program.py"
      - ".github/actions/devops/smart-contracts/**"
      - ".github/workflows/smart-contracts.yml"
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "contracts/**"
      - "scripts/smoke-hello-program.py"
      - ".github/actions/devops/smart-contracts/**"
      - ".github/workflows/smart-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeko-devops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "false"
  RUSTC_WRAPPER: sccache
  AEKO_ALLOW_INTERNAL_PR_IMAGE_PUSH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && '1' || '0' }}

jobs:
  classify:
    name: Plan / Change set
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      admin: ${{ steps.changes.outputs.admin }}
      cli: ${{ steps.changes.outputs.cli }}
      core: ${{ steps.changes.outputs.core }}
      packaging: ${{ steps.changes.outputs.packaging }}
      smart_contracts: ${{ steps.changes.outputs.smart_contracts }}
      explorer_backend: ${{ steps.changes.outputs.explorer_backend }}
      explorer_web: ${{ steps.changes.outputs.explorer_web }}
      coolify_bootstrap: ${{ steps.changes.outputs.coolify_bootstrap }}
      coolify_faucet_tools: ${{ steps.changes.outputs.coolify_faucet_tools }}
      coolify_validator: ${{ steps.changes.outputs.coolify_validator }}
      coolify_explorer_api: ${{ steps.changes.outputs.coolify_explorer_api }}
      coolify_explorer_ui: ${{ steps.changes.outputs.coolify_explorer_ui }}
      coolify_operations_web: ${{ steps.changes.outputs.coolify_operations_web }}
      sdk_js: ${{ steps.changes.outputs.sdk_js }}
      sdk_node: ${{ steps.changes.outputs.sdk_node }}
      sdk_python: ${{ steps.changes.outputs.sdk_python }}
      sdk_rust: ${{ steps.changes.outputs.sdk_rust }}
      sdk_release_js: ${{ steps.changes.outputs.sdk_release_js }}
      sdk_release_node: ${{ steps.changes.outputs.sdk_release_node }}
      sdk_release_python: ${{ steps.changes.outputs.sdk_release_python }}
      sdk_release_rust: ${{ steps.changes.outputs.sdk_release_rust }}
      dockerized: ${{ steps.changes.outputs.dockerized }}
      deployable: ${{ steps.changes.outputs.deployable }}
      ci_pipeline: ${{ steps.changes.outputs.ci_pipeline }}
      publish: ${{ steps.release.outputs.publish }}
      publish_admin: ${{ steps.release.outputs.publish_admin }}
      publish_cli: ${{ steps.release.outputs.publish_cli }}
      publish_explorer_backend: ${{ steps.release.outputs.publish_explorer_backend }}
      publish_explorer_web: ${{ steps.release.outputs.publish_explorer_web }}
      publish_network: ${{ steps.release.outputs.publish_network }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
      run_admin: ${{ steps.plan.outputs.run_admin }}
      run_cli: ${{ steps.plan.outputs.run_cli }}
      run_explorer_backend: ${{ steps.plan.outputs.run_explorer_backend }}
      run_explorer_web: ${{ steps.plan.outputs.run_explorer_web }}
      run_network: ${{ steps.plan.outputs.run_network }}
      run_sdk_non_rust: ${{ steps.plan.outputs.run_sdk_non_rust }}
      run_sdk_rust: ${{ steps.plan.outputs.run_sdk_rust }}
      build_admin: ${{ steps.plan.outputs.build_admin }}
      build_tools: ${{ steps.plan.outputs.build_tools }}
      build_explorer_backend: ${{ steps.plan.outputs.build_explorer_backend }}
      build_explorer_web: ${{ steps.plan.outputs.build_explorer_web }}
      build_network: ${{ steps.plan.outputs.build_network }}
      run_ci_contract: ${{ steps.plan.outputs.run_ci_contract }}
      run_runtime_contract: ${{ steps.plan.outputs.run_runtime_contract }}
      runtime_contract_mode: ${{ steps.plan.outputs.runtime_contract_mode }}
      deploy_explorer_api: ${{ steps.plan.outputs.deploy_explorer_api }}
      deploy_explorer_ui: ${{ steps.plan.outputs.deploy_explorer_ui }}
      deploy_operations_web: ${{ steps.plan.outputs.deploy_operations_web }}
      stateful_coolify_release: ${{ steps.plan.outputs.stateful_coolify_release }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed domains
        id: changes
        uses: ./.github/actions/devops/detect-changes

      - name: Reject unowned app paths
        if: steps.changes.outputs.unmapped_app == 'true'
        shell: bash
        run: |
          echo "An apps/** path changed without explicit DevOps ownership." >&2
          echo "Add a classifier mapping and self-contained app action before merging." >&2
          exit 1

      - name: Resolve release mode
        id: release
        shell: bash
        env:
          DOCKERIZED: ${{ steps.changes.outputs.dockerized }}
          CI_PIPELINE: ${{ steps.changes.outputs.ci_pipeline }}
          INTERNAL_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}
          ADMIN: ${{ steps.changes.outputs.admin }}
          CLI: ${{ steps.changes.outputs.cli }}
          CORE: ${{ steps.changes.outputs.core }}
          PACKAGING: ${{ steps.changes.outputs.packaging }}
          EXPLORER_BACKEND: ${{ steps.changes.outputs.explorer_backend }}
          EXPLORER_WEB: ${{ steps.changes.outputs.explorer_web }}
        run: bash .github/actions/devops/pipeline/resolve-release.sh

      - name: Plan independent domain jobs
        id: plan
        shell: bash
        env:
          ADMIN: ${{ steps.changes.outputs.admin }}
          CLI: ${{ steps.changes.outputs.cli }}
          CORE: ${{ steps.changes.outputs.core }}
          PACKAGING: ${{ steps.changes.outputs.packaging }}
          EXPLORER_BACKEND: ${{ steps.changes.outputs.explorer_backend }}
          EXPLORER_WEB: ${{ steps.changes.outputs.explorer_web }}
          COOLIFY_BOOTSTRAP: ${{ steps.changes.outputs.coolify_bootstrap }}
          COOLIFY_FAUCET_TOOLS: ${{ steps.changes.outputs.coolify_faucet_tools }}
          COOLIFY_VALIDATOR: ${{ steps.changes.outputs.coolify_validator }}
          COOLIFY_EXPLORER_API: ${{ steps.changes.outputs.coolify_explorer_api }}
          COOLIFY_EXPLORER_UI: ${{ steps.changes.outputs.coolify_explorer_ui }}
          COOLIFY_OPERATIONS_WEB: ${{ steps.changes.outputs.coolify_operations_web }}
          SDK_JS: ${{ steps.changes.outputs.sdk_js }}
          SDK_NODE: ${{ steps.changes.outputs.sdk_node }}
          SDK_PYTHON: ${{ steps.changes.outputs.sdk_python }}
          SDK_RUST: ${{ steps.changes.outputs.sdk_rust }}
          CI_PIPELINE: ${{ steps.changes.outputs.ci_pipeline }}
        run: bash .github/actions/devops/pipeline/plan.sh

  ci_contract:
    name: Quality / CI contracts
    needs: classify
    if: needs.classify.outputs.run_ci_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate DevOps action contracts
        uses: ./.github/actions/devops/pipeline/ci-contract
        with:
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  web_ui:
    name: Explorer / UI
    needs: classify
    if: >-
      needs.classify.outputs.run_admin == 'true' ||
      needs.classify.outputs.build_admin == 'true' ||
      needs.classify.outputs.run_explorer_web == 'true' ||
      needs.classify.outputs.build_explorer_web == 'true'
    uses: ./.github/workflows/devops-web-ui.yml
    with:
      validate_admin: ${{ needs.classify.outputs.run_admin }}
      build_admin: ${{ needs.classify.outputs.build_admin }}
      validate_explorer_web: ${{ needs.classify.outputs.run_explorer_web }}
      build_explorer_web: ${{ needs.classify.outputs.build_explorer_web }}
      sha_tag: ${{ needs.classify.outputs.sha_tag }}

  cli:
    name: Quality / CLI source
    needs: classify
    if: needs.classify.outputs.run_cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare CLI quality runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: "true"

      - name: Validate CLI and keygen source
        uses: ./.github/actions/devops/cli
        with:
          validate-source: "true"
          host-build: "false"
          build-image: "false"
          publish: "false"
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  runtime_tools:
    name: Runtime / Tools producer
    needs: classify
    if: needs.classify.outputs.build_tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare tools image runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          docker: "true"

      - name: Build operator tools image
        uses: ./.github/actions/devops/cli
        with:
          validate-source: "false"
          host-build: "false"
          build-image: "true"
          publish: "false"
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

      - name: Package runtime tools image and Linux CLI payload
        shell: bash
        env:
          SHA_TAG: ${{ needs.classify.outputs.sha_tag }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/aeko-runtime-tools"
          rm -rf "$out"
          mkdir -p "$out/cli-release/package"
          image="aeko-ci/aeko-tools:${SHA_TAG}"
          docker image inspect "$image" >/dev/null
          docker save "$image" | gzip -1 > "$out/aeko-tools-image.tar.gz"

          cid="$(docker create --entrypoint /bin/sh "$image" -c true)"
          cleanup_container() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup_container EXIT HUP INT TERM
          docker cp "$cid:/usr/local/bin/aeko" "$out/cli-release/package/aeko"
          docker cp "$cid:/usr/local/bin/aeko-keygen" "$out/cli-release/package/aeko-keygen"
          chmod 0755 "$out/cli-release/package/aeko" "$out/cli-release/package/aeko-keygen"

          tar -C "$out/cli-release/package" -czf "$out/cli-release/aeko-cli-x86_64-unknown-linux-gnu.tar.gz" aeko aeko-keygen
          (cd "$out/cli-release" && sha256sum aeko-cli-x86_64-unknown-linux-gnu.tar.gz > aeko-cli-x86_64-unknown-linux-gnu.tar.gz.sha256)
          printf '%s\n' "$GITHUB_SHA" > "$out/ci-source-sha.txt"
          cp "$out/ci-source-sha.txt" "$out/cli-release/ci-source-sha.txt"

      - name: Upload runtime tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeko-runtime-tools
          path: ${{ runner.temp }}/aeko-runtime-tools
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  cli_linux_release:
    name: Release / Linux CLI validation
    needs: runtime_tools
    if: needs.runtime_tools.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Linux CLI payload
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-tools
          path: ${{ runner.temp }}/aeko-runtime-tools

      - name: Exercise Linux CLI update check and installer from tools image
        shell: bash
        env:
          CLI_RELEASE_DIR: ${{ runner.temp }}/aeko-runtime-tools/cli-release
        run: |
          set -euo pipefail
          # actions/upload-artifact/download-artifact does not preserve Unix mode bits.
          # Restore the executable contract before exercising the exact downloaded binaries.
          test -s "$CLI_RELEASE_DIR/package/aeko"
          test -s "$CLI_RELEASE_DIR/package/aeko-keygen"
          chmod 0755 "$CLI_RELEASE_DIR/package/aeko" "$CLI_RELEASE_DIR/package/aeko-keygen"
          test -x "$CLI_RELEASE_DIR/package/aeko"
          test -x "$CLI_RELEASE_DIR/package/aeko-keygen"
          test -s "$CLI_RELEASE_DIR/aeko-cli-x86_64-unknown-linux-gnu.tar.gz"
          test -s "$CLI_RELEASE_DIR/aeko-cli-x86_64-unknown-linux-gnu.tar.gz.sha256"

          check_dir="$RUNNER_TEMP/aeko-cli-linux-release-check"
          install_dir="$RUNNER_TEMP/aeko-cli-install-test"
          self_update_dir="$RUNNER_TEMP/aeko-cli-self-update-test"
          rm -rf "$check_dir" "$install_dir" "$self_update_dir"
          mkdir -p "$check_dir/mock" "$install_dir" "$self_update_dir"

          cp "$CLI_RELEASE_DIR/aeko-cli-x86_64-unknown-linux-gnu.tar.gz" "$check_dir/"
          cp "$CLI_RELEASE_DIR/aeko-cli-x86_64-unknown-linux-gnu.tar.gz.sha256" "$check_dir/"
          cp install/aeko-cli-install.sh "$check_dir/mock/aeko-cli-install.sh"
          short_sha="${GITHUB_SHA::12}"
          printf '{"tag_name":"cli-main-%s","html_url":"https://example.invalid/aeko-cli"}\n' "$short_sha" > "$check_dir/mock/latest.json"

          python3 -m http.server 18765 --bind 127.0.0.1 --directory "$check_dir" >"$RUNNER_TEMP/aeko-cli-http.log" 2>&1 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup_server EXIT HUP INT TERM

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18765/mock/latest.json >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:18765/mock/latest.json >/dev/null

          AEKO_CLI_RELEASE_API_URL=http://127.0.0.1:18765/mock/latest.json \
            "$CLI_RELEASE_DIR/package/aeko" update --check | tee "$RUNNER_TEMP/aeko-update-check.log"
          grep -Fq "AEKO CLI is up to date." "$RUNNER_TEMP/aeko-update-check.log"
          "$CLI_RELEASE_DIR/package/aeko" --help | grep -Fq "AEKO QUICK START"

          cp "$CLI_RELEASE_DIR/package/aeko" "$self_update_dir/aeko"
          cp "$CLI_RELEASE_DIR/package/aeko-keygen" "$self_update_dir/aeko-keygen"
          printf '{"tag_name":"cli-main-ffffffffffff","html_url":"https://example.invalid/aeko-cli-update"}\n' > "$check_dir/mock/update.json"
          AEKO_CLI_RELEASE_API_URL=http://127.0.0.1:18765/mock/update.json \
            AEKO_CLI_ASSET_BASE_URL=http://127.0.0.1:18765 \
            "$self_update_dir/aeko" update --yes | tee "$RUNNER_TEMP/aeko-self-update.log"
          grep -Fq "AEKO CLI is updated to cli-main-ffffffffffff." "$RUNNER_TEMP/aeko-self-update.log"
          "$self_update_dir/aeko" --version
          "$self_update_dir/aeko-keygen" --version

          curl -fsSL http://127.0.0.1:18765/mock/aeko-cli-install.sh | \
            AEKO_CLI_ASSET_BASE_URL=http://127.0.0.1:18765 \
            AEKO_INSTALL_DIR="$install_dir" \
            sh
          "$install_dir/aeko" --version
          "$install_dir/aeko-keygen" --version

  runtime_services:
    name: Runtime / Producers
    needs: classify
    if: >-
      needs.classify.outputs.run_explorer_backend == 'true' ||
      needs.classify.outputs.build_explorer_backend == 'true' ||
      needs.classify.outputs.run_network == 'true' ||
      needs.classify.outputs.build_network == 'true'
    uses: ./.github/workflows/devops-runtime-services.yml
    with:
      validate_explorer_backend: ${{ needs.classify.outputs.run_explorer_backend }}
      build_explorer_backend: ${{ needs.classify.outputs.build_explorer_backend }}
      validate_network: ${{ needs.classify.outputs.run_network }}
      build_network: ${{ needs.classify.outputs.build_network }}
      sha_tag: ${{ needs.classify.outputs.sha_tag }}

  sdk_validation:
    name: SDK
    needs: classify
    if: needs.classify.outputs.run_sdk_non_rust == 'true' || needs.classify.outputs.run_sdk_rust == 'true'
    uses: ./.github/workflows/devops-sdk-validation.yml
    with:
      run_sdk_non_rust: ${{ needs.classify.outputs.run_sdk_non_rust }}
      run_sdk_rust: ${{ needs.classify.outputs.run_sdk_rust }}
      enforce_rust_lockfile_clean: ${{ needs.classify.outputs.sdk_rust }}

  cli_windows_release:
    name: Release / Windows CLI (non-blocking)
    needs: cli
    if: >-
      needs.cli.result == 'success' &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/main'
      )
    runs-on: windows-2022
    timeout-minutes: 45
    continue-on-error: true
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_STRIP: symbols
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: sccache
      TARGET: x86_64-pc-windows-msvc
      ARCHIVE: aeko-cli-x86_64-pc-windows-msvc.zip
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Stamp CLI source commit
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          echo "CI_COMMIT=$commit" >> "$GITHUB_ENV"
          mkdir -p dist
          printf '%s\n' "$commit" > dist/ci-source-sha.txt

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add --toolchain 1.85.0 "$TARGET"
          rustup default 1.85.0
          rustc --version
          cargo --version
          sccache --version

      - name: Install Windows native dependencies
        shell: bash
        run: |
          set -euo pipefail
          vcpkg install openssl:x64-windows-static-md
          vcpkg integrate install
          choco install protoc -y --no-progress
          printf 'PROTOC=C:\\ProgramData\\chocolatey\\lib\\protoc\\tools\\bin\\protoc.exe\n' >> "$GITHUB_ENV"

      - name: Build CLI and keygen for Windows
        shell: bash
        run: cargo build --release --locked --target "$TARGET" -p aeko-cli -p aeko-keygen

      - name: Verify and package Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "target/$env:TARGET/release/aeko.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'aeko.exe --version failed' }
          & "target/$env:TARGET/release/aeko-keygen.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'aeko-keygen.exe --version failed' }
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/$env:TARGET/release/aeko.exe" dist/package/aeko.exe
          Copy-Item "target/$env:TARGET/release/aeko-keygen.exe" dist/package/aeko-keygen.exe
          Compress-Archive -Path dist/package/aeko.exe,dist/package/aeko-keygen.exe -DestinationPath "dist/$env:ARCHIVE" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$env:ARCHIVE").Hash.ToLowerInvariant()
          "$hash  $env:ARCHIVE" | Set-Content -NoNewline "dist/$env:ARCHIVE.sha256"

      - name: Exercise Windows PowerShell 5.1 CLI update check and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'aeko-cli-install-test'
          New-Item -ItemType Directory -Force -Path dist/mock | Out-Null
          Copy-Item install/aeko-cli-install.ps1 dist/mock/aeko-cli-install.ps1
          $shortSha = (git rev-parse --short=12 HEAD).Trim()
          @{
            tag_name = "cli-main-$shortSha"
            html_url = "https://example.invalid/aeko-cli"
          } | ConvertTo-Json -Compress | Set-Content -Encoding ascii dist/mock/latest.json

          $server = Start-Process -FilePath python -ArgumentList '-m','http.server','18766','--bind','127.0.0.1','--directory','dist' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18766/mock/latest.json | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw 'local CLI release test server did not become ready' }

            $env:AEKO_CLI_RELEASE_API_URL = 'http://127.0.0.1:18766/mock/latest.json'
            $check = (& "target/$env:TARGET/release/aeko.exe" update --check 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "aeko update --check failed: $check" }
            if ($check -notmatch 'AEKO CLI is up to date\.') { throw "unexpected update output: $check" }
            $help = (& "target/$env:TARGET/release/aeko.exe" --help 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $help -notmatch 'AEKO QUICK START') { throw 'AEKO CLI rich help is missing' }

            $selfUpdateDir = Join-Path $env:RUNNER_TEMP 'aeko-cli-self-update-test'
            New-Item -ItemType Directory -Force -Path $selfUpdateDir | Out-Null
            Copy-Item "target/$env:TARGET/release/aeko.exe" (Join-Path $selfUpdateDir 'aeko.exe')
            Copy-Item "target/$env:TARGET/release/aeko-keygen.exe" (Join-Path $selfUpdateDir 'aeko-keygen.exe')
            @{
              tag_name = 'cli-main-ffffffffffff'
              html_url = 'https://example.invalid/aeko-cli-update'
            } | ConvertTo-Json -Compress | Set-Content -Encoding ascii dist/mock/update.json
            $env:AEKO_CLI_RELEASE_API_URL = 'http://127.0.0.1:18766/mock/update.json'
            $env:AEKO_CLI_ASSET_BASE_URL = 'http://127.0.0.1:18766'
            $selfUpdate = (& (Join-Path $selfUpdateDir 'aeko.exe') update --yes 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "aeko update --yes failed: $selfUpdate" }
            if ($selfUpdate -notmatch 'AEKO update cli-main-ffffffffffff started') { throw "unexpected self-update output: $selfUpdate" }
            Start-Sleep -Seconds 5
            & (Join-Path $selfUpdateDir 'aeko.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'self-updated aeko.exe failed' }
            & (Join-Path $selfUpdateDir 'aeko-keygen.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'self-updated aeko-keygen.exe failed' }

            $env:AEKO_CLI_RELEASE_API_URL = 'http://127.0.0.1:18766/mock/latest.json'
            $env:AEKO_CLI_ASSET_BASE_URL = 'http://127.0.0.1:18766'
            $env:AEKO_INSTALL_DIR = $installDir
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "irm 'http://127.0.0.1:18766/mock/aeko-cli-install.ps1' | iex"
            if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 irm | iex installer failed with exit code $LASTEXITCODE" }

            & (Join-Path $installDir 'aeko.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'installed aeko.exe failed' }
            & (Join-Path $installDir 'aeko-keygen.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'installed aeko-keygen.exe failed' }
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -LiteralPath install/aeko-cli-install.ps1 -Raw)) | Out-Null

      - name: Upload Windows CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-x86_64-pc-windows-msvc
          path: |
            dist/aeko-cli-x86_64-pc-windows-msvc.zip
            dist/aeko-cli-x86_64-pc-windows-msvc.zip.sha256
            dist/ci-source-sha.txt
          if-no-files-found: error
          retention-days: 7

      - name: Mark Windows release assets ready
        id: ready
        shell: bash
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  devops:
    name: Gate / Required checks
    needs:
      - classify
      - ci_contract
      - web_ui
      - cli
      - runtime_tools
      - cli_linux_release
      - runtime_services
      - sdk_validation
      - runtime_contract
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Aggregate selected job results
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EXPECT_CI_CONTRACT: ${{ needs.classify.outputs.run_ci_contract }}
          CI_CONTRACT_RESULT: ${{ needs.ci_contract.result }}
          EXPECT_WEB_UI: ${{ needs.classify.outputs.run_admin == 'true' || needs.classify.outputs.build_admin == 'true' || needs.classify.outputs.run_explorer_web == 'true' || needs.classify.outputs.build_explorer_web == 'true' }}
          WEB_UI_RESULT: ${{ needs.web_ui.result }}
          EXPECT_CLI: ${{ needs.classify.outputs.run_cli }}
          CLI_RESULT: ${{ needs.cli.result }}
          EXPECT_RUNTIME_TOOLS: ${{ needs.classify.outputs.build_tools }}
          RUNTIME_TOOLS_RESULT: ${{ needs.runtime_tools.result }}
          EXPECT_CLI_LINUX_RELEASE: ${{ needs.classify.outputs.build_tools }}
          CLI_LINUX_RELEASE_RESULT: ${{ needs.cli_linux_release.result }}
          EXPECT_RUNTIME_SERVICES: ${{ needs.classify.outputs.run_explorer_backend == 'true' || needs.classify.outputs.build_explorer_backend == 'true' || needs.classify.outputs.run_network == 'true' || needs.classify.outputs.build_network == 'true' }}
          RUNTIME_SERVICES_RESULT: ${{ needs.runtime_services.result }}
          EXPECT_SDK_VALIDATION: ${{ needs.classify.outputs.run_sdk_non_rust == 'true' || needs.classify.outputs.run_sdk_rust == 'true' }}
          SDK_VALIDATION_RESULT: ${{ needs.sdk_validation.result }}
          EXPECT_RUNTIME_CONTRACT: ${{ needs.classify.outputs.run_runtime_contract == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          RUNTIME_CONTRACT_RESULT: ${{ needs.runtime_contract.result }}
        run: bash .github/actions/devops/pipeline/verify-results.sh

  runtime_contract:
    name: Integration / Runtime contract
    needs:
      - classify
      - runtime_tools
      - runtime_services
    if: >-
      always() &&
      needs.classify.outputs.run_runtime_contract == 'true' &&
      (needs.classify.outputs.build_tools != 'true' || needs.runtime_tools.result == 'success') &&
      (
        (needs.classify.outputs.build_explorer_backend != 'true' && needs.classify.outputs.build_network != 'true') ||
        needs.runtime_services.result == 'success'
      ) &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/full-stack-integration.yml
    with:
      selection_mode: ${{ needs.classify.outputs.runtime_contract_mode }}
      producer_run_id: ${{ github.run_id }}
      build_sha: ${{ github.sha }}
      source_head_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      target_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
      use_current_tools: ${{ needs.classify.outputs.build_tools == 'true' }}
      use_current_network: ${{ needs.classify.outputs.build_network == 'true' }}
      use_current_explorer_api: ${{ needs.classify.outputs.build_explorer_backend == 'true' }}

  cli_release_publish:
    name: Publish / CLI binaries (best effort)
    needs:
      - classify
      - cli_windows_release
      - devops
      - runtime_contract
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.devops.result == 'success' &&
      (needs.classify.outputs.run_runtime_contract != 'true' || needs.runtime_contract.result == 'success') &&
      needs.cli_windows_release.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconfirm successful main source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Download Linux CLI assets from tools build
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-tools
          path: release-input/linux

      - name: Download Windows CLI assets
        uses: actions/download-artifact@v4
        with:
          name: cli-x86_64-pc-windows-msvc
          path: release-input/windows

      - name: Verify release asset provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          linux_sha="$(tr -d '\r\n' < release-input/linux/ci-source-sha.txt)"
          windows_sha="$(tr -d '\r\n' < release-input/windows/ci-source-sha.txt)"
          if [ "$linux_sha" != "$SOURCE_SHA" ] || [ "$windows_sha" != "$SOURCE_SHA" ]; then
            echo "CLI release provenance mismatch: linux=$linux_sha windows=$windows_sha expected=$SOURCE_SHA" >&2
            exit 1
          fi

          mkdir -p release-assets
          cp release-input/linux/cli-release/aeko-cli-x86_64-unknown-linux-gnu.tar.gz release-assets/
          cp release-input/linux/cli-release/aeko-cli-x86_64-unknown-linux-gnu.tar.gz.sha256 release-assets/
          cp release-input/windows/aeko-cli-x86_64-pc-windows-msvc.zip release-assets/
          cp release-input/windows/aeko-cli-x86_64-pc-windows-msvc.zip.sha256 release-assets/

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          TAG="cli-main-${short_sha}"
          TITLE="AEKO CLI main ${short_sha}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch --tags origin
            existing_sha="$(git rev-list -n 1 "$TAG")"
            if [ "$existing_sha" != "$SOURCE_SHA" ]; then
              echo "Existing release $TAG points to $existing_sha, expected $SOURCE_SHA." >&2
              exit 1
            fi
            echo "GitHub Release $TAG already exists for $SOURCE_SHA; leaving published assets unchanged."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --tags origin
            existing_sha="$(git rev-list -n 1 "$TAG")"
            if [ "$existing_sha" != "$SOURCE_SHA" ]; then
              echo "Existing tag $TAG points to $existing_sha, expected $SOURCE_SHA." >&2
              exit 1
            fi
          fi

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          cat > "$notes_file" <<EOF
          Automated AEKO CLI binaries published from successful AEKO DevOps main run #${SOURCE_RUN_NUMBER}.

          Source commit: https://github.com/${GH_REPO}/commit/${SOURCE_SHA}
          Validating workflow: https://github.com/${GH_REPO}/actions/runs/${SOURCE_RUN_ID}
          EOF

          gh release create "$TAG" release-assets/* \
            --target "$SOURCE_SHA" \
            --title "$TITLE" \
            --notes-file "$notes_file" \
            --latest

  sdk_publish:
    name: Publish / SDKs (best effort)
    needs:
      - classify
      - devops
      - runtime_contract
    if: ${{ always() && needs.devops.result == 'success' && (needs.classify.outputs.run_runtime_contract != 'true' || needs.runtime_contract.result == 'success') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.classify.outputs.sdk_release_js == 'true' || needs.classify.outputs.sdk_release_node == 'true' || needs.classify.outputs.sdk_release_python == 'true' || needs.classify.outputs.sdk_release_rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare SDK release runner
        continue-on-error: true
        uses: ./.github/actions/devops/pipeline/setup
        with:
          node: ${{ (needs.classify.outputs.sdk_release_js == 'true' || needs.classify.outputs.sdk_release_node == 'true') && 'true' || 'false' }}
          python: ${{ needs.classify.outputs.sdk_release_python }}
          rust: ${{ needs.classify.outputs.sdk_release_rust }}

      - name: Publish selected SDK packages without blocking Docker release
        id: sdk_release
        continue-on-error: true
        uses: ./.github/actions/devops/sdk-publish
        with:
          js: ${{ needs.classify.outputs.sdk_release_js }}
          node: ${{ needs.classify.outputs.sdk_release_node }}
          python: ${{ needs.classify.outputs.sdk_release_python }}
          rust: ${{ needs.classify.outputs.sdk_release_rust }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          crates-token: ${{ secrets.CRATES_IO_TOKEN }}
          best-effort: "true"

      - name: Record SDK release continuation
        if: always()
        shell: bash
        env:
          SDK_RELEASE_OUTCOME: ${{ steps.sdk_release.outcome }}
        run: |
          echo "SDK registry publication is best-effort in AEKO DevOps."
          echo "Composite publication step outcome: ${SDK_RELEASE_OUTCOME:-unknown}"
          echo "Docker image promotion and production deployment are independent of SDK registry availability."

  release:
    name: Deploy / Promote images
    needs:
      - classify
      - devops
      - runtime_contract
    if: >-
      always() &&
      needs.classify.outputs.publish == 'true' &&
      needs.devops.result == 'success' &&
      (needs.classify.outputs.run_runtime_contract != 'true' || needs.runtime_contract.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Prepare release runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          docker: "true"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download tools release artifact
        if: needs.classify.outputs.publish_cli == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-tools
          path: artifacts/release/tools

      - name: Download network release artifact
        if: needs.classify.outputs.publish_network == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-network
          path: artifacts/release/network

      - name: Download Explorer API release artifact
        if: needs.classify.outputs.publish_explorer_backend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-explorer-api
          path: artifacts/release/explorer-api

      - name: Download Explorer UI release artifact
        if: needs.classify.outputs.publish_explorer_web == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-explorer-ui
          path: artifacts/release/explorer-ui

      - name: Download Operations Web release artifact
        if: needs.classify.outputs.publish_admin == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aeko-runtime-operations-web
          path: artifacts/release/operations-web

      - name: Publish validated immutable Docker images
        shell: bash
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SHA_TAG: ${{ needs.classify.outputs.sha_tag }}
          PUBLISH_ADMIN: ${{ needs.classify.outputs.publish_admin }}
          PUBLISH_CLI: ${{ needs.classify.outputs.publish_cli }}
          PUBLISH_EXPLORER_BACKEND: ${{ needs.classify.outputs.publish_explorer_backend }}
          PUBLISH_EXPLORER_WEB: ${{ needs.classify.outputs.publish_explorer_web }}
          PUBLISH_NETWORK: ${{ needs.classify.outputs.publish_network }}
        run: bash .github/actions/devops/pipeline/publish-runtime-images.sh

      - name: Promote only validated Docker images to latest
        uses: ./.github/actions/devops/promote-images
        with:
          registry-user: ${{ secrets.DOCKERHUB_USERNAME }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}
          network: ${{ needs.classify.outputs.publish_network }}
          admin: ${{ needs.classify.outputs.publish_admin }}
          cli: ${{ needs.classify.outputs.publish_cli }}
          explorer-backend: ${{ needs.classify.outputs.publish_explorer_backend }}
          explorer-web: ${{ needs.classify.outputs.publish_explorer_web }}

      - name: Trigger legacy production deployment after successful promotion
        if: (needs.classify.outputs.deployable == 'true' || needs.classify.outputs.ci_pipeline == 'true') && vars.COOLIFY_DEPLOYMENT_MODE != 'split'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
        run: |
          set -euo pipefail
          : "${WEBHOOK_URL:?WEBHOOK_URL secret is required}"
          : "${WEBHOOK_API_KEY:?WEBHOOK_API_KEY secret is required}"
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '\r\n')"
          WEBHOOK_API_KEY="$(printf '%s' "$WEBHOOK_API_KEY" | tr -d '\r\n')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${WEBHOOK_API_KEY}" \
            "$WEBHOOK_URL"

      - name: Trigger selected split Coolify application deployments
        if: vars.COOLIFY_DEPLOYMENT_MODE == 'split' && (needs.classify.outputs.deploy_explorer_api == 'true' || needs.classify.outputs.deploy_explorer_ui == 'true' || needs.classify.outputs.deploy_operations_web == 'true' || needs.classify.outputs.stateful_coolify_release == 'true')
        shell: bash
        env:
          DEPLOY_EXPLORER_API: ${{ needs.classify.outputs.deploy_explorer_api }}
          DEPLOY_EXPLORER_UI: ${{ needs.classify.outputs.deploy_explorer_ui }}
          DEPLOY_OPERATIONS_WEB: ${{ needs.classify.outputs.deploy_operations_web }}
          STATEFUL_COOLIFY_RELEASE: ${{ needs.classify.outputs.stateful_coolify_release }}
          COOLIFY_EXPLORER_API_WEBHOOK_URL: ${{ secrets.COOLIFY_EXPLORER_API_WEBHOOK_URL }}
          COOLIFY_EXPLORER_API_WEBHOOK_API_KEY: ${{ secrets.COOLIFY_EXPLORER_API_WEBHOOK_API_KEY }}
          COOLIFY_EXPLORER_UI_WEBHOOK_URL: ${{ secrets.COOLIFY_EXPLORER_UI_WEBHOOK_URL }}
          COOLIFY_EXPLORER_UI_WEBHOOK_API_KEY: ${{ secrets.COOLIFY_EXPLORER_UI_WEBHOOK_API_KEY }}
          COOLIFY_OPERATIONS_WEB_WEBHOOK_URL: ${{ secrets.COOLIFY_OPERATIONS_WEB_WEBHOOK_URL }}
          COOLIFY_OPERATIONS_WEB_WEBHOOK_API_KEY: ${{ secrets.COOLIFY_OPERATIONS_WEB_WEBHOOK_API_KEY }}
        run: bash .github/actions/devops/pipeline/deploy-coolify-split.sh
