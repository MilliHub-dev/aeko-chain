name: AEKO DevOps (single runner)

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeko-devops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  classify:
    name: Classify change set
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      admin: ${{ steps.changes.outputs.admin }}
      cli: ${{ steps.changes.outputs.cli }}
      core: ${{ steps.changes.outputs.core }}
      packaging: ${{ steps.changes.outputs.packaging }}
      explorer_backend: ${{ steps.changes.outputs.explorer_backend }}
      explorer_web: ${{ steps.changes.outputs.explorer_web }}
      sdk_js: ${{ steps.changes.outputs.sdk_js }}
      sdk_node: ${{ steps.changes.outputs.sdk_node }}
      sdk_python: ${{ steps.changes.outputs.sdk_python }}
      sdk_rust: ${{ steps.changes.outputs.sdk_rust }}
      sdk_release_js: ${{ steps.changes.outputs.sdk_release_js }}
      sdk_release_node: ${{ steps.changes.outputs.sdk_release_node }}
      sdk_release_python: ${{ steps.changes.outputs.sdk_release_python }}
      sdk_release_rust: ${{ steps.changes.outputs.sdk_release_rust }}
      dockerized: ${{ steps.changes.outputs.dockerized }}
      deployable: ${{ steps.changes.outputs.deployable }}
      ci_pipeline: ${{ steps.changes.outputs.ci_pipeline }}
      publish: ${{ steps.release.outputs.publish }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
      run_admin: ${{ steps.plan.outputs.run_admin }}
      run_cli: ${{ steps.plan.outputs.run_cli }}
      run_explorer_backend: ${{ steps.plan.outputs.run_explorer_backend }}
      run_explorer_web: ${{ steps.plan.outputs.run_explorer_web }}
      run_network: ${{ steps.plan.outputs.run_network }}
      run_sdk_non_rust: ${{ steps.plan.outputs.run_sdk_non_rust }}
      run_sdk_rust: ${{ steps.plan.outputs.run_sdk_rust }}
      run_ci_contract: ${{ steps.plan.outputs.run_ci_contract }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed domains
        id: changes
        uses: ./.github/actions/devops/detect-changes

      - name: Reject unowned app paths
        if: steps.changes.outputs.unmapped_app == 'true'
        shell: bash
        run: |
          echo "An apps/** path changed without explicit DevOps ownership." >&2
          echo "Add a classifier mapping and self-contained app action before merging." >&2
          exit 1

      - name: Resolve release mode
        id: release
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          printf 'Release mode: publish=%s sha=%s\n' "$publish" "${GITHUB_SHA::12}"

      - name: Plan independent domain jobs
        id: plan
        shell: bash
        env:
          ADMIN: ${{ steps.changes.outputs.admin }}
          CLI: ${{ steps.changes.outputs.cli }}
          CORE: ${{ steps.changes.outputs.core }}
          PACKAGING: ${{ steps.changes.outputs.packaging }}
          EXPLORER_BACKEND: ${{ steps.changes.outputs.explorer_backend }}
          EXPLORER_WEB: ${{ steps.changes.outputs.explorer_web }}
          SDK_JS: ${{ steps.changes.outputs.sdk_js }}
          SDK_NODE: ${{ steps.changes.outputs.sdk_node }}
          SDK_PYTHON: ${{ steps.changes.outputs.sdk_python }}
          SDK_RUST: ${{ steps.changes.outputs.sdk_rust }}
          CI_PIPELINE: ${{ steps.changes.outputs.ci_pipeline }}
        run: |
          set -euo pipefail

          run_admin=false
          run_cli=false
          run_explorer_backend=false
          run_explorer_web=false
          run_network=false
          run_sdk_non_rust=false
          run_sdk_rust=false
          run_ci_contract=false

          if [ "$ADMIN" = "true" ] || [ "$PACKAGING" = "true" ]; then
            run_admin=true
          fi
          if [ "$CLI" = "true" ] || [ "$PACKAGING" = "true" ]; then
            run_cli=true
          fi
          if [ "$EXPLORER_BACKEND" = "true" ] || [ "$PACKAGING" = "true" ]; then
            run_explorer_backend=true
          fi
          if [ "$EXPLORER_WEB" = "true" ] || [ "$PACKAGING" = "true" ]; then
            run_explorer_web=true
          fi
          if [ "$CORE" = "true" ] || [ "$PACKAGING" = "true" ]; then
            run_network=true
          fi

          # A core release rebuilds every deployable application image on main,
          # matching the existing release contract without making core-only PRs
          # compile unrelated application images.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$CORE" = "true" ]; then
            run_admin=true
            run_cli=true
            run_explorer_backend=true
            run_explorer_web=true
          fi

          # CI implementation PRs are the proof run for this orchestrator. Build
          # every deployable target on independent runners while leaving product
          # source validation scoped to actual product changes. This measures the
          # image DAG without turning a CI-only PR into unrelated product debt.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$CI_PIPELINE" = "true" ]; then
            run_admin=true
            run_cli=true
            run_explorer_backend=true
            run_explorer_web=true
            run_network=true
            run_ci_contract=true
          elif [ "$CI_PIPELINE" = "true" ]; then
            run_ci_contract=true
          fi

          if [ "$SDK_JS" = "true" ] || [ "$SDK_NODE" = "true" ] || [ "$SDK_PYTHON" = "true" ]; then
            run_sdk_non_rust=true
          fi
          if [ "$SDK_RUST" = "true" ]; then
            run_sdk_rust=true
          fi

          {
            echo "run_admin=$run_admin"
            echo "run_cli=$run_cli"
            echo "run_explorer_backend=$run_explorer_backend"
            echo "run_explorer_web=$run_explorer_web"
            echo "run_network=$run_network"
            echo "run_sdk_non_rust=$run_sdk_non_rust"
            echo "run_sdk_rust=$run_sdk_rust"
            echo "run_ci_contract=$run_ci_contract"
          } >> "$GITHUB_OUTPUT"

          printf 'DAG selection: admin=%s cli=%s backend=%s web=%s network=%s sdk-non-rust=%s sdk-rust=%s ci-contract=%s\n' \
            "$run_admin" "$run_cli" "$run_explorer_backend" "$run_explorer_web" \
            "$run_network" "$run_sdk_non_rust" "$run_sdk_rust" "$run_ci_contract"

  ci_contract:
    name: CI contract smoke
    needs: classify
    if: needs.classify.outputs.run_ci_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate DevOps action contracts
        uses: ./.github/actions/devops/pipeline/ci-contract
        with:
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  admin:
    name: Operations Web
    needs: classify
    if: needs.classify.outputs.run_admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Operations Web runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          node: ${{ needs.classify.outputs.admin }}
          docker: "true"

      - name: Log in to Docker Hub
        if: needs.classify.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and build Operations Web
        uses: ./.github/actions/devops/admin
        with:
          validate-source: ${{ needs.classify.outputs.admin }}
          build-image: "true"
          publish: ${{ needs.classify.outputs.publish }}
          registry-user: ${{ needs.classify.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  explorer_web:
    name: Explorer Web
    needs: classify
    if: needs.classify.outputs.run_explorer_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Explorer Web runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          node: ${{ needs.classify.outputs.explorer_web }}
          docker: "true"

      - name: Log in to Docker Hub
        if: needs.classify.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and build Explorer Web
        uses: ./.github/actions/devops/explorer-web
        with:
          validate-source: ${{ needs.classify.outputs.explorer_web }}
          build-image: "true"
          publish: ${{ needs.classify.outputs.publish }}
          registry-user: ${{ needs.classify.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  cli:
    name: CLI and tools
    needs: classify
    if: needs.classify.outputs.run_cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare CLI runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: ${{ needs.classify.outputs.cli }}
          docker: "true"

      - name: Log in to Docker Hub
        if: needs.classify.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and build CLI image
        uses: ./.github/actions/devops/cli
        with:
          validate-source: ${{ needs.classify.outputs.cli }}
          host-build: "false"
          build-image: "true"
          publish: ${{ needs.classify.outputs.publish }}
          registry-user: ${{ needs.classify.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  explorer_backend:
    name: Explorer backend
    needs: classify
    if: needs.classify.outputs.run_explorer_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Explorer backend runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: ${{ needs.classify.outputs.explorer_backend }}
          docker: "true"

      - name: Log in to Docker Hub
        if: needs.classify.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and build Explorer backend image
        uses: ./.github/actions/devops/explorer-backend
        with:
          validate-source: ${{ needs.classify.outputs.explorer_backend }}
          host-build: "false"
          build-image: "true"
          publish: ${{ needs.classify.outputs.publish }}
          registry-user: ${{ needs.classify.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  network:
    name: Blockchain network
    needs: classify
    if: needs.classify.outputs.run_network == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare network runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: ${{ needs.classify.outputs.core }}
          python: ${{ needs.classify.outputs.core }}
          docker: "true"

      - name: Log in to Docker Hub
        if: needs.classify.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and build network images
        uses: ./.github/actions/devops/network
        with:
          run-preflight: ${{ (needs.classify.outputs.core == 'true' || needs.classify.outputs.packaging == 'true') && 'true' || 'false' }}
          validate-source: ${{ needs.classify.outputs.core }}
          build-image: "true"
          publish: ${{ needs.classify.outputs.publish }}
          registry-user: ${{ needs.classify.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  sdk_non_rust:
    name: External SDKs (JS / Node / Python)
    needs: classify
    if: needs.classify.outputs.run_sdk_non_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare non-Rust SDK runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          node: ${{ (needs.classify.outputs.sdk_js == 'true' || needs.classify.outputs.sdk_node == 'true') && 'true' || 'false' }}
          python: ${{ needs.classify.outputs.sdk_python }}

      - name: Validate selected non-Rust SDKs
        uses: ./.github/actions/devops/sdk
        with:
          js: ${{ needs.classify.outputs.sdk_js }}
          node: ${{ needs.classify.outputs.sdk_node }}
          python: ${{ needs.classify.outputs.sdk_python }}
          rust: "false"
          release-js: ${{ needs.classify.outputs.sdk_release_js }}
          release-node: ${{ needs.classify.outputs.sdk_release_node }}
          release-python: ${{ needs.classify.outputs.sdk_release_python }}
          release-rust: "false"

  sdk_rust:
    name: External SDK (Rust)
    needs: classify
    if: needs.classify.outputs.run_sdk_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Rust SDK runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: "true"

      - name: Validate Rust SDK
        uses: ./.github/actions/devops/sdk
        with:
          js: "false"
          node: "false"
          python: "false"
          rust: "true"
          release-js: "false"
          release-node: "false"
          release-python: "false"
          release-rust: ${{ needs.classify.outputs.sdk_release_rust }}

  devops:
    name: devops
    needs:
      - classify
      - ci_contract
      - admin
      - explorer_web
      - cli
      - explorer_backend
      - network
      - sdk_non_rust
      - sdk_rust
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Aggregate selected job results
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EXPECT_CI_CONTRACT: ${{ needs.classify.outputs.run_ci_contract }}
          CI_CONTRACT_RESULT: ${{ needs.ci_contract.result }}
          EXPECT_ADMIN: ${{ needs.classify.outputs.run_admin }}
          ADMIN_RESULT: ${{ needs.admin.result }}
          EXPECT_EXPLORER_WEB: ${{ needs.classify.outputs.run_explorer_web }}
          EXPLORER_WEB_RESULT: ${{ needs.explorer_web.result }}
          EXPECT_CLI: ${{ needs.classify.outputs.run_cli }}
          CLI_RESULT: ${{ needs.cli.result }}
          EXPECT_EXPLORER_BACKEND: ${{ needs.classify.outputs.run_explorer_backend }}
          EXPLORER_BACKEND_RESULT: ${{ needs.explorer_backend.result }}
          EXPECT_NETWORK: ${{ needs.classify.outputs.run_network }}
          NETWORK_RESULT: ${{ needs.network.result }}
          EXPECT_SDK_NON_RUST: ${{ needs.classify.outputs.run_sdk_non_rust }}
          SDK_NON_RUST_RESULT: ${{ needs.sdk_non_rust.result }}
          EXPECT_SDK_RUST: ${{ needs.classify.outputs.run_sdk_rust }}
          SDK_RUST_RESULT: ${{ needs.sdk_rust.result }}
        run: bash .github/actions/devops/pipeline/verify-results.sh

  release:
    name: Promote and deploy
    needs:
      - classify
      - devops
    if: needs.classify.outputs.publish == 'true' && needs.classify.outputs.dockerized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare release runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          docker: "true"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote only validated Docker images to latest
        uses: ./.github/actions/devops/promote-images
        with:
          registry-user: ${{ secrets.DOCKERHUB_USERNAME }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}
          network: ${{ needs.classify.outputs.run_network }}
          admin: ${{ needs.classify.outputs.run_admin }}
          cli: ${{ needs.classify.outputs.run_cli }}
          explorer-backend: ${{ needs.classify.outputs.run_explorer_backend }}
          explorer-web: ${{ needs.classify.outputs.run_explorer_web }}

      - name: Trigger production deployment after successful promotion
        if: needs.classify.outputs.deployable == 'true'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
        run: |
          set -euo pipefail
          : "${WEBHOOK_URL:?WEBHOOK_URL secret is required}"
          : "${WEBHOOK_API_KEY:?WEBHOOK_API_KEY secret is required}"
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '\r\n')"
          WEBHOOK_API_KEY="$(printf '%s' "$WEBHOOK_API_KEY" | tr -d '\r\n')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${WEBHOOK_API_KEY}" \
            "$WEBHOOK_URL"
