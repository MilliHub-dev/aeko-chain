name: Build AEKO Network Images

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployment contracts
        shell: bash
        env:
          AEKO_PUBLIC_IP: 203.0.113.10
          AEKO_KEYS_DIR: ../files/aeko-keys
          EXPLORER_DATABASE_URL: postgres://aeko:aeko@postgres:5432/aeko_explorer
          AEKO_IMAGE_TAG: ci
        run: |
          set -euo pipefail
          bash -n docker/validator-entrypoint.sh
          bash -n scripts/deploy-testnet.sh
          python3 scripts/validate-deployment-contract.py
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.dokploy.yml config >/dev/null

      - name: Validate Node Social SDK wire contract
        working-directory: apps/sdk/node
        run: |
          npm ci
          npm run release:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build complete network image set
        shell: bash
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          PUSH_ARGS=()
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            : "${REGISTRY_USER:?DOCKERHUB_USERNAME secret is required for image publishing}"
            PUSH_ARGS=(--push)
          fi

          build_target() {
            local target="$1"
            shift
            local tags=()
            local image

            # PR builds prove every target is buildable. Main builds publish
            # canonical and temporary compatibility names.
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              tags+=(--tag "aeko-ci/${target}:${SHA_TAG}")
            else
              for image in "$@"; do
                tags+=(--tag "${REGISTRY_USER}/${image}:latest")
                tags+=(--tag "${REGISTRY_USER}/${image}:${SHA_TAG}")
              done
            fi

            echo "==> Building ${target}"
            docker buildx build \
              --file Dockerfile \
              --target "${target}" \
              "${tags[@]}" \
              "${PUSH_ARGS[@]}" \
              .
          }

          # Same executable, two runtime roles: validator + optional RPC node.
          # aeko-node is retained as a temporary compatibility alias.
          build_target validator aeko-validator aeko-node
          build_target faucet aeko-faucet
          build_target social-bootstrap aeko-social-bootstrap
          build_target tools aeko-tools
          # aeko-explorer-backend is retained as a compatibility alias.
          build_target explorer-api aeko-explorer-api aeko-explorer-backend
          build_target explorer-ui aeko-explorer-ui
