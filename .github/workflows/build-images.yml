name: AEKO DevOps (single runner)

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeko-devops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  devops:
    # Deliberately one job: every local composite action below executes on this
    # same ubuntu-latest VM and shares its checkout, caches, Docker daemon,
    # Buildx builder, authentication, and filesystem.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed domains
        id: changes
        uses: ./.github/actions/devops/detect-changes

      - name: Reject unowned app paths
        if: steps.changes.outputs.unmapped_app == 'true'
        shell: bash
        run: |
          echo "An apps/** path changed without explicit DevOps ownership." >&2
          echo "Add a classifier mapping and self-contained app action before merging." >&2
          exit 1

      - name: Resolve release mode
        id: release
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          printf 'Release mode: publish=%s sha=%s\n' "$publish" "${GITHUB_SHA::12}"

      - name: Install pinned Rust toolchain components
        if: steps.changes.outputs.rust_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Set up shared Rust compilation cache
        if: steps.changes.outputs.rust_needed == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Set up shared Node runtime/cache
        if: steps.changes.outputs.node_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/explorer/web/package-lock.json
            apps/sdk/js/package-lock.json
            apps/sdk/node/package-lock.json

      - name: Set up shared Python runtime
        if: steps.changes.outputs.python_needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up shared Docker Buildx
        if: >-
          steps.changes.outputs.core == 'true' ||
          steps.changes.outputs.admin == 'true' ||
          steps.changes.outputs.cli == 'true' ||
          steps.changes.outputs.explorer_backend == 'true' ||
          steps.changes.outputs.explorer_web == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub once
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.dockerized == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate/build admin application
        if: steps.changes.outputs.admin == 'true' || steps.changes.outputs.core == 'true'
        uses: ./.github/actions/devops/admin
        with:
          build-image: ${{ (steps.changes.outputs.admin == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Validate selected external SDKs
        if: steps.changes.outputs.sdk_any == 'true' || steps.changes.outputs.core == 'true'
        uses: ./.github/actions/devops/sdk
        with:
          js: ${{ (steps.changes.outputs.sdk_js == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          node: ${{ (steps.changes.outputs.sdk_node == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          python: ${{ (steps.changes.outputs.sdk_python == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          rust: ${{ (steps.changes.outputs.sdk_rust == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          release-js: ${{ steps.changes.outputs.sdk_release_js }}
          release-node: ${{ steps.changes.outputs.sdk_release_node }}
          release-python: ${{ steps.changes.outputs.sdk_release_python }}
          release-rust: ${{ steps.changes.outputs.sdk_release_rust }}

      - name: Validate/build CLI and tools
        if: steps.changes.outputs.cli == 'true' || steps.changes.outputs.core == 'true'
        uses: ./.github/actions/devops/cli
        with:
          build-image: ${{ (steps.changes.outputs.cli == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Validate/build Explorer backend
        if: steps.changes.outputs.explorer_backend == 'true' || steps.changes.outputs.core == 'true'
        uses: ./.github/actions/devops/explorer-backend
        with:
          build-image: ${{ (steps.changes.outputs.explorer_backend == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Validate/build Explorer frontend
        if: steps.changes.outputs.explorer_web == 'true' || steps.changes.outputs.core == 'true'
        uses: ./.github/actions/devops/explorer-web
        with:
          build-image: ${{ (steps.changes.outputs.explorer_web == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Validate/build full blockchain network
        if: steps.changes.outputs.core == 'true'
        uses: ./.github/actions/devops/network
        with:
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Dogfood immutable full-network release
        if: steps.changes.outputs.core == 'true' && steps.release.outputs.publish == 'true'
        uses: ./.github/actions/devops/network-dogfood
        with:
          registry-user: ${{ secrets.DOCKERHUB_USERNAME }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      # Package registries are irreversible release channels, so publish SDKs
      # only after every selected validation/build (and core dogfood) succeeds.
      - name: Publish changed SDK packages
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.sdk_release_any == 'true'
        uses: ./.github/actions/devops/sdk-publish
        with:
          js: ${{ steps.changes.outputs.sdk_release_js }}
          node: ${{ steps.changes.outputs.sdk_release_node }}
          python: ${{ steps.changes.outputs.sdk_release_python }}
          rust: ${{ steps.changes.outputs.sdk_release_rust }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          crates-token: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Promote only validated Docker images to latest
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.dockerized == 'true'
        uses: ./.github/actions/devops/promote-images
        with:
          registry-user: ${{ secrets.DOCKERHUB_USERNAME }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}
          network: ${{ steps.changes.outputs.core }}
          admin: ${{ (steps.changes.outputs.admin == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          cli: ${{ (steps.changes.outputs.cli == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          explorer-backend: ${{ (steps.changes.outputs.explorer_backend == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}
          explorer-web: ${{ (steps.changes.outputs.explorer_web == 'true' || steps.changes.outputs.core == 'true') && 'true' || 'false' }}

      - name: Trigger Dokploy after successful promotion
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.deployable == 'true'
        shell: bash
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          : "${DOKPLOY_WEBHOOK_URL:?DOKPLOY_WEBHOOK_URL secret is required}"
          curl --fail-with-body --silent --show-error --request POST "$DOKPLOY_WEBHOOK_URL"
