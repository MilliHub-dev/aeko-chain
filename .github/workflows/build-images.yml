name: Build AEKO Network Images

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aeko
          POSTGRES_PASSWORD: aeko
          POSTGRES_DB: aeko_explorer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeko -d aeko_explorer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployment contracts
        shell: bash
        env:
          AEKO_PUBLIC_IP: 203.0.113.10
          AEKO_KEYS_DIR: ../files/aeko-keys
          EXPLORER_DATABASE_URL: postgres://aeko:aeko@postgres:5432/aeko_explorer
          AEKO_IMAGE_TAG: ci
        run: |
          set -euo pipefail
          bash -n docker/validator-entrypoint.sh
          bash -n scripts/deploy-testnet.sh
          python3 scripts/validate-deployment-contract.py
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.dokploy.yml config >/dev/null

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.3
        with:
          version: "v0.5.4"

      - name: Validate Explorer PostgreSQL backend
        env:
          AEKO_EXPLORER_TEST_DATABASE_URL: postgres://aeko:aeko@127.0.0.1:5432/aeko_explorer_test
        run: cargo test -p aeko-explorer-backend

      - name: Validate Node Social SDK wire contract
        working-directory: apps/sdk/node
        run: |
          npm ci
          npm run release:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build complete network image set
        shell: bash
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          PUSH_ARGS=()
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            : "${REGISTRY_USER:?DOCKERHUB_USERNAME secret is required for image publishing}"
            PUSH_ARGS+=(--push)
          else
            PUSH_ARGS+=(--load)
          fi

          build_target() {
            local target="$1"
            shift
            local tags=()
            local image
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              tags+=(--tag "aeko-ci/${target}:${SHA_TAG}")
            else
              for image in "$@"; do
                tags+=(--tag "${REGISTRY_USER}/${image}:latest")
                tags+=(--tag "${REGISTRY_USER}/${image}:${SHA_TAG}")
              done
            fi
            echo "==> Building ${target}"
            docker buildx build \
              --file Dockerfile \
              --target "${target}" \
              "${tags[@]}" \
              "${PUSH_ARGS[@]}" \
              .
          }

          build_target validator aeko-validator aeko-node
          build_target faucet aeko-faucet
          build_target social-bootstrap aeko-social-bootstrap
          build_target tools aeko-tools
          build_target explorer-api aeko-explorer-api aeko-explorer-backend
          build_target explorer-ui aeko-explorer-ui
