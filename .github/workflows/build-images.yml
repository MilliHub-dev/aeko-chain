name: AEKO DevOps (single runner)

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeko-devops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  devops:
    # Deliberately one job: every local composite action below executes on this
    # same ubuntu-latest VM and shares its checkout, caches, Docker daemon,
    # Buildx builder, authentication, and filesystem.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed domains
        id: changes
        uses: ./.github/actions/devops/detect-changes

      - name: Reject unowned app paths
        if: steps.changes.outputs.unmapped_app == 'true'
        shell: bash
        run: |
          echo "An apps/** path changed without explicit DevOps ownership." >&2
          echo "Add a classifier mapping and self-contained app action before merging." >&2
          exit 1

      - name: Resolve release mode
        id: release
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          printf 'Release mode: publish=%s sha=%s\n' "$publish" "${GITHUB_SHA::12}"

      - name: Install pinned Rust toolchain and native prerequisites
        if: steps.changes.outputs.rust_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.0
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          fi
          rustc --version
          cargo --version
          protoc --version

      - name: Set up shared Rust compilation cache
        if: steps.changes.outputs.rust_needed == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Set up shared Node runtime/cache
        if: steps.changes.outputs.node_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/explorer/web/package-lock.json
            apps/sdk/js/package-lock.json
            apps/sdk/node/package-lock.json

      - name: Set up shared Python runtime
        if: steps.changes.outputs.python_needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up shared Docker Buildx
        if: >-
          steps.changes.outputs.core == 'true' ||
          steps.changes.outputs.packaging == 'true' ||
          steps.changes.outputs.admin == 'true' ||
          steps.changes.outputs.cli == 'true' ||
          steps.changes.outputs.explorer_backend == 'true' ||
          steps.changes.outputs.explorer_web == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub once
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.dockerized == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Explorer Web and the full network are independent workloads once shared
      # runner setup is complete. Keep one job/VM/checkout/Docker daemon/cache,
      # but execute these two expensive domains as concurrent child processes.
      # Network preflight stays serial because its rustfmt compatibility gate
      # temporarily edits/restores the worktree before parallel readers start.
      - name: Run network preflight before concurrent workloads
        id: network_preflight
        if: >-
          steps.changes.outputs.core == 'true' ||
          steps.changes.outputs.packaging == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          VALIDATE_SOURCE: ${{ steps.changes.outputs.core }}
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: bash .github/actions/devops/network/preflight.sh

      - name: Validate/build Explorer frontend and blockchain network concurrently
        id: parallel_domains
        if: >-
          steps.changes.outputs.explorer_web == 'true' ||
          steps.changes.outputs.core == 'true' ||
          steps.changes.outputs.packaging == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          RUN_EXPLORER_WEB: ${{ (steps.changes.outputs.explorer_web == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')) && 'true' || 'false' }}
          RUN_NETWORK: ${{ (steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}
          EXPLORER_VALIDATE_SOURCE: ${{ steps.changes.outputs.explorer_web }}
          EXPLORER_BUILD_IMAGE: ${{ (steps.changes.outputs.explorer_web == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')) && 'true' || 'false' }}
          NETWORK_VALIDATE_SOURCE: ${{ steps.changes.outputs.core }}
          NETWORK_PREFLIGHT_OUTCOME: ${{ steps.network_preflight.outcome }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          REGISTRY_USER: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          SHA_TAG: ${{ steps.release.outputs.sha_tag }}
        run: |
          set -uo pipefail

          explorer_pid=""
          network_pid=""
          explorer_outcome="skipped"
          network_outcome="skipped"

          cleanup() {
            if [ -n "$explorer_pid" ]; then
              kill "$explorer_pid" 2>/dev/null || true
            fi
            if [ -n "$network_pid" ]; then
              kill "$network_pid" 2>/dev/null || true
            fi
          }
          trap 'cleanup; exit 130' INT
          trap 'cleanup; exit 143' TERM

          status_to_outcome() {
            case "$1" in
              0) printf 'success' ;;
              130|143) printf 'cancelled' ;;
              *) printf 'failure' ;;
            esac
          }

          if [ "$RUN_EXPLORER_WEB" = "true" ]; then
            echo "Launching Explorer Web on the shared runner."
            (
              export VALIDATE_SOURCE="$EXPLORER_VALIDATE_SOURCE"
              export BUILD_IMAGE="$EXPLORER_BUILD_IMAGE"
              export PUBLISH REGISTRY_USER SHA_TAG
              bash .github/actions/devops/explorer-web/run.sh
            ) > >(sed -u 's/^/[explorer-web] /') 2> >(sed -u 's/^/[explorer-web] /' >&2) &
            explorer_pid=$!
          fi

          if [ "$RUN_NETWORK" = "true" ]; then
            if [ "$NETWORK_PREFLIGHT_OUTCOME" = "success" ]; then
              echo "Launching blockchain network validation/build on the shared runner."
              (
                export VALIDATE_SOURCE="$NETWORK_VALIDATE_SOURCE"
                export PUBLISH REGISTRY_USER SHA_TAG
                bash .github/actions/devops/network/run.sh
              ) > >(sed -u 's/^/[network] /') 2> >(sed -u 's/^/[network] /' >&2) &
              network_pid=$!
            else
              case "$NETWORK_PREFLIGHT_OUTCOME" in
                cancelled) network_outcome="cancelled" ;;
                *) network_outcome="failure" ;;
              esac
              echo "[network] workload not launched because preflight outcome was $NETWORK_PREFLIGHT_OUTCOME." >&2
            fi
          fi

          if [ -n "$explorer_pid" ]; then
            wait "$explorer_pid"
            explorer_status=$?
            explorer_outcome="$(status_to_outcome "$explorer_status")"
          fi

          if [ -n "$network_pid" ]; then
            wait "$network_pid"
            network_status=$?
            network_outcome="$(status_to_outcome "$network_status")"
          fi

          echo "explorer_web_outcome=$explorer_outcome" >> "$GITHUB_OUTPUT"
          echo "network_outcome=$network_outcome" >> "$GITHUB_OUTPUT"
          printf 'Concurrent domain outcomes: explorer-web=%s network=%s\n' "$explorer_outcome" "$network_outcome"

          case "$explorer_outcome:$network_outcome" in
            *failure*|*cancelled*) exit 1 ;;
          esac

      # Other selected domains remain ordinary composite actions on this same
      # runner and execute after the concurrent web/network pair completes.
      - name: Validate/build admin application
        id: admin
        if: steps.changes.outputs.admin == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/admin
        with:
          validate-source: ${{ steps.changes.outputs.admin == 'true' && 'true' || 'false' }}
          build-image: ${{ (steps.changes.outputs.admin == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')) && 'true' || 'false' }}
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Validate selected external SDKs
        id: sdk
        if: steps.changes.outputs.sdk_any == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/sdk
        with:
          js: ${{ steps.changes.outputs.sdk_js == 'true' && 'true' || 'false' }}
          node: ${{ steps.changes.outputs.sdk_node == 'true' && 'true' || 'false' }}
          python: ${{ steps.changes.outputs.sdk_python == 'true' && 'true' || 'false' }}
          rust: ${{ steps.changes.outputs.sdk_rust == 'true' && 'true' || 'false' }}
          release-js: ${{ steps.changes.outputs.sdk_release_js }}
          release-node: ${{ steps.changes.outputs.sdk_release_node }}
          release-python: ${{ steps.changes.outputs.sdk_release_python }}
          release-rust: ${{ steps.changes.outputs.sdk_release_rust }}

      - name: Validate/build CLI and tools
        id: cli
        if: steps.changes.outputs.cli == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/cli
        with:
          validate-source: ${{ steps.changes.outputs.cli == 'true' && 'true' || 'false' }}
          build-image: ${{ (steps.changes.outputs.cli == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')) && 'true' || 'false' }}
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Validate/build Explorer backend
        id: explorer_backend
        if: steps.changes.outputs.explorer_backend == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/devops/explorer-backend
        with:
          validate-source: ${{ steps.changes.outputs.explorer_backend == 'true' && 'true' || 'false' }}
          build-image: ${{ (steps.changes.outputs.explorer_backend == 'true' || steps.changes.outputs.packaging == 'true' || (github.event_name != 'pull_request' && steps.changes.outputs.core == 'true')) && 'true' || 'false' }}
          publish: ${{ steps.release.outputs.publish }}
          registry-user: ${{ steps.release.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}

      - name: Aggregate pull-request validation results
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          ADMIN_OUTCOME: ${{ steps.admin.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          CLI_OUTCOME: ${{ steps.cli.outcome }}
          EXPLORER_BACKEND_OUTCOME: ${{ steps.explorer_backend.outcome }}
          EXPLORER_WEB_OUTCOME: ${{ steps.parallel_domains.outputs.explorer_web_outcome }}
          NETWORK_OUTCOME: ${{ steps.parallel_domains.outputs.network_outcome }}
          PARALLEL_OUTCOME: ${{ steps.parallel_domains.outcome }}
        run: |
          set -euo pipefail
          failures=()
          record_failure() {
            local domain="$1"
            local outcome="$2"
            case "$outcome" in
              failure|cancelled)
                failures+=("${domain}:${outcome}")
                ;;
            esac
          }

          record_failure admin "$ADMIN_OUTCOME"
          record_failure sdk "$SDK_OUTCOME"
          record_failure cli "$CLI_OUTCOME"
          record_failure explorer-backend "$EXPLORER_BACKEND_OUTCOME"
          record_failure explorer-web "$EXPLORER_WEB_OUTCOME"
          record_failure network "$NETWORK_OUTCOME"

          # A selected child normally records its own failure. If the parent
          # orchestration step itself failed before producing a child outcome,
          # fail closed rather than allowing an empty output to mask the error.
          if [ "$PARALLEL_OUTCOME" = "failure" ] || [ "$PARALLEL_OUTCOME" = "cancelled" ]; then
            if [ "$EXPLORER_WEB_OUTCOME" != "failure" ] && [ "$EXPLORER_WEB_OUTCOME" != "cancelled" ] &&
               [ "$NETWORK_OUTCOME" != "failure" ] && [ "$NETWORK_OUTCOME" != "cancelled" ]; then
              failures+=("parallel-domains:${PARALLEL_OUTCOME}")
            fi
          fi

          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'One or more PR domains failed after all selected domains were exercised:\n' >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi

          echo "All selected PR domains passed."

      # Package registries are irreversible release channels, so publish SDKs
      # only after every selected validation/build succeeds.
      - name: Publish changed SDK packages
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.sdk_release_any == 'true'
        uses: ./.github/actions/devops/sdk-publish
        with:
          js: ${{ steps.changes.outputs.sdk_release_js }}
          node: ${{ steps.changes.outputs.sdk_release_node }}
          python: ${{ steps.changes.outputs.sdk_release_python }}
          rust: ${{ steps.changes.outputs.sdk_release_rust }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          crates-token: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Promote only validated Docker images to latest
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.dockerized == 'true'
        uses: ./.github/actions/devops/promote-images
        with:
          registry-user: ${{ secrets.DOCKERHUB_USERNAME }}
          sha-tag: ${{ steps.release.outputs.sha_tag }}
          network: ${{ (steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}
          admin: ${{ (steps.changes.outputs.admin == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}
          cli: ${{ (steps.changes.outputs.cli == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}
          explorer-backend: ${{ (steps.changes.outputs.explorer_backend == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}
          explorer-web: ${{ (steps.changes.outputs.explorer_web == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.packaging == 'true') && 'true' || 'false' }}

      - name: Trigger production deployment after successful promotion
        if: steps.release.outputs.publish == 'true' && steps.changes.outputs.deployable == 'true'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
        run: |
          set -euo pipefail
          : "${WEBHOOK_URL:?WEBHOOK_URL secret is required}"
          : "${WEBHOOK_API_KEY:?WEBHOOK_API_KEY secret is required}"
          # GitHub secrets can accidentally include a trailing CR/LF when copied.
          # Coolify's deploy endpoint is POST-only; normalize only line endings,
          # never echo either secret.
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '\r\n')"
          WEBHOOK_API_KEY="$(printf '%s' "$WEBHOOK_API_KEY" | tr -d '\r\n')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${WEBHOOK_API_KEY}" \
            "$WEBHOOK_URL"
