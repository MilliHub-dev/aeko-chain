name: AEKO DevOps (single runner)

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeko-devops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  classify:
    name: Classify change set
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      admin: ${{ steps.changes.outputs.admin }}
      cli: ${{ steps.changes.outputs.cli }}
      core: ${{ steps.changes.outputs.core }}
      packaging: ${{ steps.changes.outputs.packaging }}
      explorer_backend: ${{ steps.changes.outputs.explorer_backend }}
      explorer_web: ${{ steps.changes.outputs.explorer_web }}
      coolify_bootstrap: ${{ steps.changes.outputs.coolify_bootstrap }}
      coolify_faucet_tools: ${{ steps.changes.outputs.coolify_faucet_tools }}
      coolify_validator: ${{ steps.changes.outputs.coolify_validator }}
      coolify_explorer_api: ${{ steps.changes.outputs.coolify_explorer_api }}
      coolify_explorer_ui: ${{ steps.changes.outputs.coolify_explorer_ui }}
      coolify_operations_web: ${{ steps.changes.outputs.coolify_operations_web }}
      sdk_js: ${{ steps.changes.outputs.sdk_js }}
      sdk_node: ${{ steps.changes.outputs.sdk_node }}
      sdk_python: ${{ steps.changes.outputs.sdk_python }}
      sdk_rust: ${{ steps.changes.outputs.sdk_rust }}
      sdk_release_js: ${{ steps.changes.outputs.sdk_release_js }}
      sdk_release_node: ${{ steps.changes.outputs.sdk_release_node }}
      sdk_release_python: ${{ steps.changes.outputs.sdk_release_python }}
      sdk_release_rust: ${{ steps.changes.outputs.sdk_release_rust }}
      dockerized: ${{ steps.changes.outputs.dockerized }}
      deployable: ${{ steps.changes.outputs.deployable }}
      ci_pipeline: ${{ steps.changes.outputs.ci_pipeline }}
      publish: ${{ steps.release.outputs.publish }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
      run_admin: ${{ steps.plan.outputs.run_admin }}
      run_cli: ${{ steps.plan.outputs.run_cli }}
      run_explorer_backend: ${{ steps.plan.outputs.run_explorer_backend }}
      run_explorer_web: ${{ steps.plan.outputs.run_explorer_web }}
      run_network: ${{ steps.plan.outputs.run_network }}
      run_sdk_non_rust: ${{ steps.plan.outputs.run_sdk_non_rust }}
      run_sdk_rust: ${{ steps.plan.outputs.run_sdk_rust }}
      run_ci_contract: ${{ steps.plan.outputs.run_ci_contract }}
      deploy_explorer_api: ${{ steps.plan.outputs.deploy_explorer_api }}
      deploy_explorer_ui: ${{ steps.plan.outputs.deploy_explorer_ui }}
      deploy_operations_web: ${{ steps.plan.outputs.deploy_operations_web }}
      stateful_coolify_release: ${{ steps.plan.outputs.stateful_coolify_release }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed domains
        id: changes
        uses: ./.github/actions/devops/detect-changes

      - name: Reject unowned app paths
        if: steps.changes.outputs.unmapped_app == 'true'
        shell: bash
        run: |
          echo "An apps/** path changed without explicit DevOps ownership." >&2
          echo "Add a classifier mapping and self-contained app action before merging." >&2
          exit 1

      - name: Resolve release mode
        id: release
        shell: bash
        env:
          DOCKERIZED: ${{ steps.changes.outputs.dockerized }}
          CI_PIPELINE: ${{ steps.changes.outputs.ci_pipeline }}
        run: bash .github/actions/devops/pipeline/resolve-release.sh

      - name: Plan independent domain jobs
        id: plan
        shell: bash
        env:
          ADMIN: ${{ steps.changes.outputs.admin }}
          CLI: ${{ steps.changes.outputs.cli }}
          CORE: ${{ steps.changes.outputs.core }}
          PACKAGING: ${{ steps.changes.outputs.packaging }}
          EXPLORER_BACKEND: ${{ steps.changes.outputs.explorer_backend }}
          EXPLORER_WEB: ${{ steps.changes.outputs.explorer_web }}
          COOLIFY_BOOTSTRAP: ${{ steps.changes.outputs.coolify_bootstrap }}
          COOLIFY_FAUCET_TOOLS: ${{ steps.changes.outputs.coolify_faucet_tools }}
          COOLIFY_VALIDATOR: ${{ steps.changes.outputs.coolify_validator }}
          COOLIFY_EXPLORER_API: ${{ steps.changes.outputs.coolify_explorer_api }}
          COOLIFY_EXPLORER_UI: ${{ steps.changes.outputs.coolify_explorer_ui }}
          COOLIFY_OPERATIONS_WEB: ${{ steps.changes.outputs.coolify_operations_web }}
          SDK_JS: ${{ steps.changes.outputs.sdk_js }}
          SDK_NODE: ${{ steps.changes.outputs.sdk_node }}
          SDK_PYTHON: ${{ steps.changes.outputs.sdk_python }}
          SDK_RUST: ${{ steps.changes.outputs.sdk_rust }}
          CI_PIPELINE: ${{ steps.changes.outputs.ci_pipeline }}
        run: bash .github/actions/devops/pipeline/plan.sh

  ci_contract:
    name: CI contract smoke
    needs: classify
    if: needs.classify.outputs.run_ci_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate DevOps action contracts
        uses: ./.github/actions/devops/pipeline/ci-contract
        with:
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  admin:
    name: Operations Web
    needs: classify
    if: needs.classify.outputs.run_admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Operations Web runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          node: ${{ needs.classify.outputs.admin }}
          docker: "true"

      - name: Log in to Docker Hub
        if: needs.classify.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and build Operations Web
        uses: ./.github/actions/devops/admin
        with:
          validate-source: ${{ needs.classify.outputs.admin }}
          build-image: "true"
          publish: ${{ needs.classify.outputs.publish }}
          registry-user: ${{ needs.classify.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  explorer_web:
    name: Explorer Web
    needs: classify
    if: needs.classify.outputs.run_explorer_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Explorer Web runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          node: ${{ needs.classify.outputs.explorer_web }}
          docker: "true"

      - name: Log in to Docker Hub
        if: needs.classify.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and build Explorer Web
        uses: ./.github/actions/devops/explorer-web
        with:
          validate-source: ${{ needs.classify.outputs.explorer_web }}
          build-image: "true"
          publish: ${{ needs.classify.outputs.publish }}
          registry-user: ${{ needs.classify.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  cli:
    name: CLI and tools
    needs: classify
    if: needs.classify.outputs.run_cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare CLI runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: ${{ needs.classify.outputs.cli }}
          docker: "true"

      - name: Log in to Docker Hub
        if: needs.classify.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and build CLI image
        uses: ./.github/actions/devops/cli
        with:
          validate-source: ${{ needs.classify.outputs.cli }}
          host-build: "false"
          build-image: "true"
          publish: ${{ needs.classify.outputs.publish }}
          registry-user: ${{ needs.classify.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  explorer_backend:
    name: Explorer backend
    needs: classify
    if: needs.classify.outputs.run_explorer_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Explorer backend runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: ${{ needs.classify.outputs.explorer_backend }}
          docker: "true"

      - name: Log in to Docker Hub
        if: needs.classify.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and build Explorer backend image
        uses: ./.github/actions/devops/explorer-backend
        with:
          validate-source: ${{ needs.classify.outputs.explorer_backend }}
          host-build: "false"
          build-image: "true"
          publish: ${{ needs.classify.outputs.publish }}
          registry-user: ${{ needs.classify.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  network:
    name: Blockchain network
    needs: classify
    if: needs.classify.outputs.run_network == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare network runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: ${{ needs.classify.outputs.core }}
          python: ${{ needs.classify.outputs.core }}
          docker: "true"

      - name: Log in to Docker Hub
        if: needs.classify.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate and build network images
        uses: ./.github/actions/devops/network
        with:
          run-preflight: ${{ (needs.classify.outputs.core == 'true' || needs.classify.outputs.packaging == 'true') && 'true' || 'false' }}
          validate-source: ${{ needs.classify.outputs.core }}
          build-image: "true"
          publish: ${{ needs.classify.outputs.publish }}
          registry-user: ${{ needs.classify.outputs.publish == 'true' && secrets.DOCKERHUB_USERNAME || '' }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}

  sdk_non_rust:
    name: External SDKs (JS / Node / Python)
    needs: classify
    if: needs.classify.outputs.run_sdk_non_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare non-Rust SDK runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          node: ${{ (needs.classify.outputs.sdk_js == 'true' || needs.classify.outputs.sdk_node == 'true' || needs.classify.outputs.ci_pipeline == 'true') && 'true' || 'false' }}
          python: ${{ (needs.classify.outputs.sdk_python == 'true' || needs.classify.outputs.ci_pipeline == 'true') && 'true' || 'false' }}

      - name: Validate selected non-Rust SDKs
        uses: ./.github/actions/devops/sdk
        with:
          js: ${{ (needs.classify.outputs.sdk_js == 'true' || needs.classify.outputs.ci_pipeline == 'true') && 'true' || 'false' }}
          node: ${{ (needs.classify.outputs.sdk_node == 'true' || needs.classify.outputs.ci_pipeline == 'true') && 'true' || 'false' }}
          python: ${{ (needs.classify.outputs.sdk_python == 'true' || needs.classify.outputs.ci_pipeline == 'true') && 'true' || 'false' }}
          rust: "false"
          release-js: "false"
          release-node: "false"
          release-python: "false"
          release-rust: "false"

  sdk_rust:
    name: External SDK (Rust)
    needs: classify
    if: needs.classify.outputs.run_sdk_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Rust SDK runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: "true"

      - name: Validate Rust SDK
        uses: ./.github/actions/devops/sdk
        with:
          js: "false"
          node: "false"
          python: "false"
          rust: "true"
          release-js: "false"
          release-node: "false"
          release-python: "false"
          release-rust: "false"
          enforce-lockfile-clean: ${{ needs.classify.outputs.sdk_rust }}

  devops:
    name: devops
    needs:
      - classify
      - ci_contract
      - admin
      - explorer_web
      - cli
      - explorer_backend
      - network
      - sdk_non_rust
      - sdk_rust
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Aggregate selected job results
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EXPECT_CI_CONTRACT: ${{ needs.classify.outputs.run_ci_contract }}
          CI_CONTRACT_RESULT: ${{ needs.ci_contract.result }}
          EXPECT_ADMIN: ${{ needs.classify.outputs.run_admin }}
          ADMIN_RESULT: ${{ needs.admin.result }}
          EXPECT_EXPLORER_WEB: ${{ needs.classify.outputs.run_explorer_web }}
          EXPLORER_WEB_RESULT: ${{ needs.explorer_web.result }}
          EXPECT_CLI: ${{ needs.classify.outputs.run_cli }}
          CLI_RESULT: ${{ needs.cli.result }}
          EXPECT_EXPLORER_BACKEND: ${{ needs.classify.outputs.run_explorer_backend }}
          EXPLORER_BACKEND_RESULT: ${{ needs.explorer_backend.result }}
          EXPECT_NETWORK: ${{ needs.classify.outputs.run_network }}
          NETWORK_RESULT: ${{ needs.network.result }}
          EXPECT_SDK_NON_RUST: ${{ needs.classify.outputs.run_sdk_non_rust }}
          SDK_NON_RUST_RESULT: ${{ needs.sdk_non_rust.result }}
          EXPECT_SDK_RUST: ${{ needs.classify.outputs.run_sdk_rust }}
          SDK_RUST_RESULT: ${{ needs.sdk_rust.result }}
        run: bash .github/actions/devops/pipeline/verify-results.sh

  sdk_publish:
    name: Publish SDKs (best effort)
    needs:
      - classify
      - devops
    if: ${{ needs.devops.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.classify.outputs.sdk_release_js == 'true' || needs.classify.outputs.sdk_release_node == 'true' || needs.classify.outputs.sdk_release_python == 'true' || needs.classify.outputs.sdk_release_rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare SDK release runner
        continue-on-error: true
        uses: ./.github/actions/devops/pipeline/setup
        with:
          node: ${{ (needs.classify.outputs.sdk_release_js == 'true' || needs.classify.outputs.sdk_release_node == 'true') && 'true' || 'false' }}
          python: ${{ needs.classify.outputs.sdk_release_python }}
          rust: ${{ needs.classify.outputs.sdk_release_rust }}

      - name: Publish selected SDK packages without blocking Docker release
        id: sdk_release
        continue-on-error: true
        uses: ./.github/actions/devops/sdk-publish
        with:
          js: ${{ needs.classify.outputs.sdk_release_js }}
          node: ${{ needs.classify.outputs.sdk_release_node }}
          python: ${{ needs.classify.outputs.sdk_release_python }}
          rust: ${{ needs.classify.outputs.sdk_release_rust }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          crates-token: ${{ secrets.CRATES_IO_TOKEN }}
          best-effort: "true"

      - name: Record SDK release continuation
        if: always()
        shell: bash
        env:
          SDK_RELEASE_OUTCOME: ${{ steps.sdk_release.outcome }}
        run: |
          echo "SDK registry publication is best-effort in AEKO DevOps."
          echo "Composite publication step outcome: ${SDK_RELEASE_OUTCOME:-unknown}"
          echo "Docker image promotion and production deployment are independent of SDK registry availability."

  release:
    name: Promote and deploy
    needs:
      - classify
      - devops
    if: needs.classify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Prepare release runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          docker: "true"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote only validated Docker images to latest
        uses: ./.github/actions/devops/promote-images
        with:
          registry-user: ${{ secrets.DOCKERHUB_USERNAME }}
          sha-tag: ${{ needs.classify.outputs.sha_tag }}
          network: ${{ needs.classify.outputs.run_network }}
          admin: ${{ needs.classify.outputs.run_admin }}
          cli: ${{ needs.classify.outputs.run_cli }}
          explorer-backend: ${{ needs.classify.outputs.run_explorer_backend }}
          explorer-web: ${{ needs.classify.outputs.run_explorer_web }}

      - name: Trigger legacy production deployment after successful promotion
        if: (needs.classify.outputs.deployable == 'true' || needs.classify.outputs.ci_pipeline == 'true') && vars.COOLIFY_DEPLOYMENT_MODE != 'split'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
        run: |
          set -euo pipefail
          : "${WEBHOOK_URL:?WEBHOOK_URL secret is required}"
          : "${WEBHOOK_API_KEY:?WEBHOOK_API_KEY secret is required}"
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '\r\n')"
          WEBHOOK_API_KEY="$(printf '%s' "$WEBHOOK_API_KEY" | tr -d '\r\n')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${WEBHOOK_API_KEY}" \
            "$WEBHOOK_URL"

      - name: Trigger selected split Coolify application deployments
        if: vars.COOLIFY_DEPLOYMENT_MODE == 'split' && (needs.classify.outputs.deploy_explorer_api == 'true' || needs.classify.outputs.deploy_explorer_ui == 'true' || needs.classify.outputs.deploy_operations_web == 'true' || needs.classify.outputs.stateful_coolify_release == 'true')
        shell: bash
        env:
          DEPLOY_EXPLORER_API: ${{ needs.classify.outputs.deploy_explorer_api }}
          DEPLOY_EXPLORER_UI: ${{ needs.classify.outputs.deploy_explorer_ui }}
          DEPLOY_OPERATIONS_WEB: ${{ needs.classify.outputs.deploy_operations_web }}
          STATEFUL_COOLIFY_RELEASE: ${{ needs.classify.outputs.stateful_coolify_release }}
          COOLIFY_EXPLORER_API_WEBHOOK_URL: ${{ secrets.COOLIFY_EXPLORER_API_WEBHOOK_URL }}
          COOLIFY_EXPLORER_API_WEBHOOK_API_KEY: ${{ secrets.COOLIFY_EXPLORER_API_WEBHOOK_API_KEY }}
          COOLIFY_EXPLORER_UI_WEBHOOK_URL: ${{ secrets.COOLIFY_EXPLORER_UI_WEBHOOK_URL }}
          COOLIFY_EXPLORER_UI_WEBHOOK_API_KEY: ${{ secrets.COOLIFY_EXPLORER_UI_WEBHOOK_API_KEY }}
          COOLIFY_OPERATIONS_WEB_WEBHOOK_URL: ${{ secrets.COOLIFY_OPERATIONS_WEB_WEBHOOK_URL }}
          COOLIFY_OPERATIONS_WEB_WEBHOOK_API_KEY: ${{ secrets.COOLIFY_OPERATIONS_WEB_WEBHOOK_API_KEY }}
        run: bash .github/actions/devops/pipeline/deploy-coolify-split.sh
