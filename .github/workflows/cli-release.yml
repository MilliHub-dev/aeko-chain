name: AEKO CLI release binaries

# Normal main/PR CLI validation and the aeko-tools image are owned by the
# single-runner AEKO DevOps workflow. Cross-platform release binaries are built
# only after that workflow completes successfully on a push to main, so failed
# main builds cannot publish CLI assets. Explicit v* tags remain supported for
# operator-managed versioned releases, and workflow_dispatch remains build-only.
on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
  workflow_run:
    workflows: ["AEKO DevOps (single runner)"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: cli-binaries-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    if: >
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: aeko-cli-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: aeko-cli-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_STRIP: symbols
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Require release tag commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "CLI release tags may only publish commits already contained in main." >&2
            exit 1
          fi

      - name: Stamp CLI source commit
        shell: bash
        run: echo "CI_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add --toolchain 1.85.0 "$TARGET"
          rustup default 1.85.0
          rustc --version
          cargo --version
          sccache --version

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libclang-dev \
            libudev-dev \
            pkg-config \
            protobuf-compiler

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          vcpkg install openssl:x64-windows-static-md
          vcpkg integrate install
          choco install protoc -y --no-progress
          printf 'PROTOC=C:\\ProgramData\\chocolatey\\lib\\protoc\\tools\\bin\\protoc.exe\n' >> "$GITHUB_ENV"

      - name: Build CLI and keygen only
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET" -p aeko-cli -p aeko-keygen

      - name: Verify Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "target/$TARGET/release/aeko" --version
          "target/$TARGET/release/aeko-keygen" --version

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/$TARGET/release/aeko" dist/package/aeko
          cp "target/$TARGET/release/aeko-keygen" dist/package/aeko-keygen
          chmod 0755 dist/package/aeko dist/package/aeko-keygen
          tar -C dist/package -czf "dist/$ARCHIVE" aeko aeko-keygen
          (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")

      - name: Verify and package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "target/$env:TARGET/release/aeko.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'aeko.exe --version failed' }
          & "target/$env:TARGET/release/aeko-keygen.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'aeko-keygen.exe --version failed' }
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/$env:TARGET/release/aeko.exe" dist/package/aeko.exe
          Copy-Item "target/$env:TARGET/release/aeko-keygen.exe" dist/package/aeko-keygen.exe
          Compress-Archive -Path dist/package/aeko.exe,dist/package/aeko-keygen.exe -DestinationPath "dist/$env:ARCHIVE" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$env:ARCHIVE").Hash.ToLowerInvariant()
          "$hash  $env:ARCHIVE" | Set-Content -NoNewline "dist/$env:ARCHIVE.sha256"

      - name: Exercise Linux CLI update check and installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/aeko-cli-install-test"
          mkdir -p dist/mock
          cp install/aeko-cli-install.sh dist/mock/aeko-cli-install.sh
          short_sha="$(git rev-parse --short=12 HEAD)"
          printf '{"tag_name":"cli-main-%s","html_url":"https://example.invalid/aeko-cli"}\n' "$short_sha" > dist/mock/latest.json

          python3 -m http.server 18765 --bind 127.0.0.1 --directory dist >"$RUNNER_TEMP/aeko-cli-http.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT HUP INT TERM

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18765/mock/latest.json >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:18765/mock/latest.json >/dev/null

          AEKO_CLI_RELEASE_API_URL=http://127.0.0.1:18765/mock/latest.json \
            "target/$TARGET/release/aeko" update --check | tee "$RUNNER_TEMP/aeko-update-check.log"
          grep -Fq "AEKO CLI is up to date." "$RUNNER_TEMP/aeko-update-check.log"
          "target/$TARGET/release/aeko" --help | grep -Fq "AEKO QUICK START"

          self_update_dir="$RUNNER_TEMP/aeko-cli-self-update-test"
          mkdir -p "$self_update_dir"
          cp "target/$TARGET/release/aeko" "$self_update_dir/aeko"
          cp "target/$TARGET/release/aeko-keygen" "$self_update_dir/aeko-keygen"
          printf '{"tag_name":"cli-main-ffffffffffff","html_url":"https://example.invalid/aeko-cli-update"}\n' > dist/mock/update.json
          AEKO_CLI_RELEASE_API_URL=http://127.0.0.1:18765/mock/update.json \
            AEKO_CLI_ASSET_BASE_URL=http://127.0.0.1:18765 \
            "$self_update_dir/aeko" update --yes | tee "$RUNNER_TEMP/aeko-self-update.log"
          grep -Fq "AEKO CLI is updated to cli-main-ffffffffffff." "$RUNNER_TEMP/aeko-self-update.log"
          "$self_update_dir/aeko" --version
          "$self_update_dir/aeko-keygen" --version

          curl -fsSL http://127.0.0.1:18765/mock/aeko-cli-install.sh | \
            AEKO_CLI_ASSET_BASE_URL=http://127.0.0.1:18765 \
            AEKO_INSTALL_DIR="$install_dir" \
            sh
          "$install_dir/aeko" --version
          "$install_dir/aeko-keygen" --version

      - name: Exercise Windows PowerShell 5.1 CLI update check and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'aeko-cli-install-test'
          New-Item -ItemType Directory -Force -Path dist/mock | Out-Null
          Copy-Item install/aeko-cli-install.ps1 dist/mock/aeko-cli-install.ps1
          $shortSha = (git rev-parse --short=12 HEAD).Trim()
          @{
            tag_name = "cli-main-$shortSha"
            html_url = "https://example.invalid/aeko-cli"
          } | ConvertTo-Json -Compress | Set-Content -Encoding ascii dist/mock/latest.json

          $server = Start-Process -FilePath python -ArgumentList '-m','http.server','18766','--bind','127.0.0.1','--directory','dist' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18766/mock/latest.json | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw 'local CLI release test server did not become ready' }

            $env:AEKO_CLI_RELEASE_API_URL = 'http://127.0.0.1:18766/mock/latest.json'
            $check = (& "target/$env:TARGET/release/aeko.exe" update --check 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "aeko update --check failed: $check" }
            if ($check -notmatch 'AEKO CLI is up to date\.') { throw "unexpected update output: $check" }
            $help = (& "target/$env:TARGET/release/aeko.exe" --help 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $help -notmatch 'AEKO QUICK START') { throw 'AEKO CLI rich help is missing' }

            $selfUpdateDir = Join-Path $env:RUNNER_TEMP 'aeko-cli-self-update-test'
            New-Item -ItemType Directory -Force -Path $selfUpdateDir | Out-Null
            Copy-Item "target/$env:TARGET/release/aeko.exe" (Join-Path $selfUpdateDir 'aeko.exe')
            Copy-Item "target/$env:TARGET/release/aeko-keygen.exe" (Join-Path $selfUpdateDir 'aeko-keygen.exe')
            @{
              tag_name = 'cli-main-ffffffffffff'
              html_url = 'https://example.invalid/aeko-cli-update'
            } | ConvertTo-Json -Compress | Set-Content -Encoding ascii dist/mock/update.json
            $env:AEKO_CLI_RELEASE_API_URL = 'http://127.0.0.1:18766/mock/update.json'
            $env:AEKO_CLI_ASSET_BASE_URL = 'http://127.0.0.1:18766'
            $selfUpdate = (& (Join-Path $selfUpdateDir 'aeko.exe') update --yes 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "aeko update --yes failed: $selfUpdate" }
            if ($selfUpdate -notmatch 'AEKO update cli-main-ffffffffffff started') { throw "unexpected self-update output: $selfUpdate" }
            Start-Sleep -Seconds 5
            & (Join-Path $selfUpdateDir 'aeko.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'self-updated aeko.exe failed' }
            & (Join-Path $selfUpdateDir 'aeko-keygen.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'self-updated aeko-keygen.exe failed' }

            $env:AEKO_CLI_RELEASE_API_URL = 'http://127.0.0.1:18766/mock/latest.json'
            $env:AEKO_CLI_ASSET_BASE_URL = 'http://127.0.0.1:18766'
            $env:AEKO_INSTALL_DIR = $installDir
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "irm 'http://127.0.0.1:18766/mock/aeko-cli-install.ps1' | iex"
            if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 irm | iex installer failed with exit code $LASTEXITCODE" }

            & (Join-Path $installDir 'aeko.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'installed aeko.exe failed' }
            & (Join-Path $installDir 'aeko-keygen.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'installed aeko-keygen.exe failed' }
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Validate POSIX installer syntax
        if: runner.os == 'Linux'
        shell: bash
        run: sh -n install/aeko-cli-install.sh

      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -LiteralPath install/aeko-cli-install.ps1 -Raw)) | Out-Null

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release assets
    if: >
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      ) ||
      startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Reconfirm successful main source
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Reconfirm tag commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            short_sha="${SOURCE_SHA:0:12}"
            TAG="cli-main-${short_sha}"
            TITLE="AEKO CLI main ${short_sha}"
          else
            TAG="$REF_NAME"
            TITLE="$REF_NAME"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch --tags origin
            existing_sha="$(git rev-list -n 1 "$TAG")"
            if [ "$existing_sha" != "$SOURCE_SHA" ]; then
              echo "Existing release $TAG points to $existing_sha, expected $SOURCE_SHA." >&2
              exit 1
            fi
            echo "GitHub Release $TAG already exists for $SOURCE_SHA; leaving published assets unchanged."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --tags origin
            existing_sha="$(git rev-list -n 1 "$TAG")"
            if [ "$existing_sha" != "$SOURCE_SHA" ]; then
              echo "Existing tag $TAG points to $existing_sha, expected $SOURCE_SHA." >&2
              exit 1
            fi
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            notes_file="$(mktemp)"
            trap 'rm -f "$notes_file"' EXIT
            cat > "$notes_file" <<EOF
          Automated AEKO CLI binaries published after successful AEKO DevOps main run #${SOURCE_RUN_NUMBER}.

          Source commit: https://github.com/${GH_REPO}/commit/${SOURCE_SHA}
          Validating workflow: https://github.com/${GH_REPO}/actions/runs/${SOURCE_RUN_ID}
          EOF

            gh release create "$TAG" release-assets/* \
              --target "$SOURCE_SHA" \
              --title "$TITLE" \
              --notes-file "$notes_file" \
              --latest
          else
            gh release create "$TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "$TITLE" \
              --latest
          fi
