name: AEKO CLI binaries

on:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "keygen/**"
      - "remote-wallet/**"
      - "rpc-client/**"
      - "sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "install/aeko-cli-install.sh"
      - "install/aeko-cli-install.ps1"
      - ".github/workflows/cli-release.yml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: cli-binaries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: aeko-cli-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: aeko-cli-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_STRIP: symbols
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add --toolchain 1.85.0 "$TARGET"
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libclang-dev \
            libudev-dev \
            pkg-config \
            protobuf-compiler

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          vcpkg install openssl:x64-windows-static-md
          vcpkg integrate install
          choco install protoc -y --no-progress
          printf 'PROTOC=C:\\ProgramData\\chocolatey\\lib\\protoc\\tools\\bin\\protoc.exe\n' >> "$GITHUB_ENV"

      - name: Build CLI and keygen only
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET" -p aeko-cli -p aeko-keygen

      - name: Verify Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "target/$TARGET/release/aeko" --version
          "target/$TARGET/release/aeko-keygen" --version

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/$TARGET/release/aeko" dist/package/aeko
          cp "target/$TARGET/release/aeko-keygen" dist/package/aeko-keygen
          chmod 0755 dist/package/aeko dist/package/aeko-keygen
          tar -C dist/package -czf "dist/$ARCHIVE" aeko aeko-keygen
          (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")

      - name: Verify and package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "target/$env:TARGET/release/aeko.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'aeko.exe --version failed' }
          & "target/$env:TARGET/release/aeko-keygen.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'aeko-keygen.exe --version failed' }
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/$env:TARGET/release/aeko.exe" dist/package/aeko.exe
          Copy-Item "target/$env:TARGET/release/aeko-keygen.exe" dist/package/aeko-keygen.exe
          Compress-Archive -Path dist/package/aeko.exe,dist/package/aeko-keygen.exe -DestinationPath "dist/$env:ARCHIVE" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$env:ARCHIVE").Hash.ToLowerInvariant()
          "$hash  $env:ARCHIVE" | Set-Content -NoNewline "dist/$env:ARCHIVE.sha256"

      - name: Validate POSIX installer syntax
        if: runner.os == 'Linux'
        shell: bash
        run: sh -n install/aeko-cli-install.sh

      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -LiteralPath install/aeko-cli-install.ps1 -Raw)) | Out-Null

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --generate-notes --title "$TAG"
          fi
