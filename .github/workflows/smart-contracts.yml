name: AEKO Smart Contracts (non-blocking)

on:
  pull_request:
    branches: ["main"]
    paths:
      - "contracts/**"
      - "scripts/smoke-hello-program.py"
      - ".github/actions/devops/smart-contracts/**"
      - ".github/workflows/smart-contracts.yml"
  push:
    branches: ["main"]
    paths:
      - "contracts/**"
      - "scripts/smoke-hello-program.py"
      - ".github/actions/devops/smart-contracts/**"
      - ".github/workflows/smart-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeko-smart-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  AEKO_SMART_CONTRACT_RPC_URL: https://rpc.aeko.online
  AEKO_SMART_CONTRACT_FUNDING_URL: https://api.aeko.online
  AEKO_SMART_CONTRACT_AIRDROP_AEKO: "10"

jobs:
  contract:
    name: Live Testnet SBF deploy and invoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare smart-contract runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: "true"
          python: "true"

      - name: Probe RPC, fund wallet, deploy and invoke
        id: live_contract
        continue-on-error: true
        uses: ./.github/actions/devops/smart-contracts
        with:
          validate-source: "true"
          live-testnet: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'true' || 'false' }}

      - name: Report smart-contract result without blocking core CI
        if: always()
        shell: bash
        env:
          CONTRACT_OUTCOME: ${{ steps.live_contract.outcome }}
        run: |
          if [ "$CONTRACT_OUTCOME" = "success" ]; then
            echo "### Smart-contract Testnet smoke: passed" >> "$GITHUB_STEP_SUMMARY"
            echo "SBF build and requested live AEKO Testnet deploy/invoke completed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Smart-contract Testnet smoke failed. This workflow is intentionally non-blocking and does not gate AEKO DevOps, Docker publication, SDK publication, or CLI releases."
            echo "### Smart-contract Testnet smoke: non-blocking failure" >> "$GITHUB_STEP_SUMMARY"
            echo "Inspect the contract job for RPC, funding, SBF build, deploy, or invoke diagnostics. Core release pipelines continue independently." >> "$GITHUB_STEP_SUMMARY"
          fi
