name: AEKO DevOps / Runtime producers

on:
  workflow_call:
    inputs:
      validate_explorer_backend:
        required: true
        type: string
      build_explorer_backend:
        required: true
        type: string
      validate_network:
        required: true
        type: string
      build_network:
        required: true
        type: string
      sha_tag:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  explorer_backend_quality:
    name: Explorer API / Quality
    if: inputs.validate_explorer_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Explorer backend quality runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: "true"

      - name: Validate Explorer backend source
        uses: ./.github/actions/devops/explorer-backend
        with:
          validate-source: "true"
          host-build: "false"
          build-image: "false"
          publish: "false"
          sha-tag: ${{ inputs.sha_tag }}

  explorer_backend_image:
    name: Explorer API / Image
    if: inputs.build_explorer_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Explorer backend image runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          docker: "true"

      - name: Build Explorer API image
        uses: ./.github/actions/devops/explorer-backend
        with:
          validate-source: "false"
          host-build: "false"
          build-image: "true"
          publish: "false"
          sha-tag: ${{ inputs.sha_tag }}

      - name: Package Explorer API runtime image
        shell: bash
        env:
          SHA_TAG: ${{ inputs.sha_tag }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/aeko-runtime-explorer-api"
          rm -rf "$out"
          mkdir -p "$out"
          image="aeko-ci/aeko-explorer-api:$SHA_TAG"
          docker image inspect "$image" >/dev/null
          docker save "$image" | gzip -1 > "$out/aeko-explorer-api-image.tar.gz"
          printf '%s\n' "$GITHUB_SHA" > "$out/ci-source-sha.txt"

      - name: Upload Explorer API runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeko-runtime-explorer-api
          path: ${{ runner.temp }}/aeko-runtime-explorer-api
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  network_quality:
    name: Blockchain network / Quality
    if: inputs.validate_network == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare network quality runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          rust: "true"
          python: "true"

      - name: Validate network source and lifecycle contracts
        uses: ./.github/actions/devops/network
        with:
          run-preflight: "true"
          validate-source: "true"
          build-image: "false"
          publish: "false"
          sha-tag: ${{ inputs.sha_tag }}

  network_image:
    name: Blockchain network / Images
    if: inputs.build_network == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare network image runner
        uses: ./.github/actions/devops/pipeline/setup
        with:
          docker: "true"

      - name: Build network images
        uses: ./.github/actions/devops/network
        with:
          run-preflight: "false"
          validate-source: "false"
          build-image: "true"
          publish: "false"
          sha-tag: ${{ inputs.sha_tag }}

      - name: Package network runtime images
        shell: bash
        env:
          SHA_TAG: ${{ inputs.sha_tag }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/aeko-runtime-network"
          rm -rf "$out"
          mkdir -p "$out"
          images=(
            "aeko-ci/aeko-validator:$SHA_TAG"
            "aeko-ci/aeko-faucet:$SHA_TAG"
            "aeko-ci/aeko-social-bootstrap:$SHA_TAG"
            "aeko-ci/aeko-protocol-bootstrap:$SHA_TAG"
          )
          for image in "${images[@]}"; do
            docker image inspect "$image" >/dev/null
          done
          docker save "${images[@]}" | gzip -1 > "$out/aeko-network-images.tar.gz"
          printf '%s\n' "$GITHUB_SHA" > "$out/ci-source-sha.txt"

      - name: Upload network runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeko-runtime-network
          path: ${{ runner.temp }}/aeko-runtime-network
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
