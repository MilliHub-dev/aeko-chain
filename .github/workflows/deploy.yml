name: Build Aeko Stack & Deploy via Dokploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.validator
            image_name: aeko-node
          - dockerfile: Dockerfile.explorer
            image_name: aeko-explorer-backend
          - dockerfile: Dockerfile.explorer-ui
            image_name: aeko-explorer-ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:latest"
          docker build -f "${{ matrix.dockerfile }}" -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

  trigger-dokploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Webhook to Auto-Deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error --request POST "$DOKPLOY_WEBHOOK_URL"
