name: AEKO network DevOps
description: Validate the blockchain/network release and publish only network-owned container images on main.

inputs:
  publish:
    description: Build and push immutable network images. Must only be true on main.
    required: false
    default: "false"
  registry-user:
    description: Docker Hub namespace used when publishing.
    required: false
    default: ""
  sha-tag:
    description: Immutable release tag.
    required: true

runs:
  using: composite
  steps:
    - name: Validate network deployment contracts
      shell: bash
      env:
        AEKO_PUBLIC_IP: 203.0.113.10
        AEKO_KEYS_DIR: ../files/aeko-keys
        EXPLORER_DATABASE_URL: postgres://aeko:aeko@postgres:5432/aeko_explorer
        AEKO_IMAGE_TAG: ci
      run: |
        set -euo pipefail
        bash -n docker/validator-entrypoint.sh
        bash -n scripts/deploy-testnet.sh
        python3 scripts/validate-deployment-contract.py
        docker compose -f docker-compose.yml config >/dev/null
        docker compose -f docker-compose.dokploy.yml config >/dev/null

    - name: Network Rust format
      shell: bash
      run: cargo fmt --all -- --check

    - name: Network binary type and target check
      shell: bash
      run: >-
        cargo check --locked --all-targets
        -p aeko-validator
        -p aeko-genesis
        -p aeko-faucet
        -p aeko-social-bootstrap

    - name: Network binary lint
      shell: bash
      run: >-
        cargo clippy --locked --all-targets
        -p aeko-validator
        -p aeko-genesis
        -p aeko-faucet
        -p aeko-social-bootstrap
        -- -D warnings

    - name: Network binary tests
      shell: bash
      run: >-
        cargo test --locked
        -p aeko-validator
        -p aeko-genesis
        -p aeko-faucet
        -p aeko-social-bootstrap

    - name: Network release build for non-publishing runs
      if: ${{ inputs.publish != 'true' }}
      shell: bash
      run: >-
        cargo build --locked --release
        -p aeko-validator
        -p aeko-genesis
        -p aeko-faucet
        -p aeko-social-bootstrap

    - name: Build and push immutable network images
      if: ${{ inputs.publish == 'true' }}
      shell: bash
      env:
        REGISTRY_USER: ${{ inputs.registry-user }}
        SHA_TAG: ${{ inputs.sha-tag }}
      run: |
        set -euo pipefail
        : "${REGISTRY_USER:?registry-user is required when publishing}"

        build_target() {
          local target="$1"
          shift
          local tags=()
          local image
          for image in "$@"; do
            tags+=(--tag "${REGISTRY_USER}/${image}:${SHA_TAG}")
          done
          docker buildx build \
            --file Dockerfile \
            --target "$target" \
            "${tags[@]}" \
            --push \
            .
        }

        # The validator target's network-rust-builder compiles validator,
        # genesis, faucet, and social-bootstrap once. Subsequent targets reuse
        # that BuildKit stage/cache instead of compiling independent copies.
        build_target validator aeko-validator aeko-node
        build_target faucet aeko-faucet
        build_target social-bootstrap aeko-social-bootstrap
