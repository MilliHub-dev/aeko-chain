name: AEKO network DevOps
description: Fully validate core changes, build network images locally on PRs, and publish them only from main.

inputs:
  validate-source:
    description: Run network Rust format, check, lint, and tests.
    required: false
    default: "true"
  publish:
    description: Push immutable network images. This is accepted only on main.
    required: false
    default: "false"
  registry-user:
    description: Docker Hub namespace used when publishing.
    required: false
    default: ""
  sha-tag:
    description: Immutable release tag.
    required: true

runs:
  using: composite
  steps:
    - name: Guard network publication branch
      if: ${{ inputs.publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          echo "Network publication is permitted only from the main branch." >&2
          exit 1
        fi

    - name: Validate network deployment contracts
      shell: bash
      env:
        AEKO_PUBLIC_IP: 203.0.113.10
        AEKO_KEYS_DIR: /tmp/aeko-keys
        EXPLORER_DATABASE_URL: postgres://aeko:aeko@postgres:5432/aeko_explorer
        AEKO_IMAGE_TAG: ci
      run: |
        set -euo pipefail
        bash -n docker/validator-entrypoint.sh
        bash -n scripts/deploy-testnet.sh
        python3 scripts/validate-deployment-contract.py
        docker compose -f docker/compose.local.yml config >/dev/null
        docker compose -f docker/compose.dokploy.yml config >/dev/null
        docker compose -f docker/compose.coolify.yml config >/dev/null

    - name: Network Rust format
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          cargo fmt --all -- --check
          exit 0
        fi

        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          BASE_SHA=$(jq -r '.pull_request.base.sha // empty' "${GITHUB_EVENT_PATH}")
          HEAD_SHA=$(jq -r '.pull_request.head.sha // empty' "${GITHUB_EVENT_PATH}")
        else
          BASE_SHA=$(jq -r '.before // empty' "${GITHUB_EVENT_PATH}")
          HEAD_SHA="${GITHUB_SHA}"
        fi

        if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ] || [[ "${BASE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          cargo fmt --all -- --check
          exit 0
        fi

        mapfile -t changed_rust < <(
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '\.rs$' || true
        )

        if [ "${#changed_rust[@]}" -eq 0 ]; then
          echo "No changed Rust files to format-check."
          exit 0
        fi

        cargo fmt --all

        format_failures=()
        for file in "${changed_rust[@]}"; do
          if [ -f "${file}" ] && ! git diff --quiet -- "${file}"; then
            format_failures+=("${file}")
          fi
        done

        if [ "${#format_failures[@]}" -gt 0 ]; then
          echo "rustfmt changed Rust files touched by this change set:" >&2
          printf '  %s\n' "${format_failures[@]}" >&2
          git diff -- "${format_failures[@]}" >&2
          git restore --worktree -- .
          exit 1
        fi

        git restore --worktree -- .
        echo "Changed Rust files are rustfmt-clean; unrelated legacy formatting debt was ignored."

    - name: Network binary type and target check
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      run: >-
        cargo check --locked --all-targets
        -p aeko-validator
        -p aeko-genesis
        -p aeko-faucet
        -p aeko-social-bootstrap
        -p aeko-social-staking-program
        -p aeko-social-monetization-program

    - name: Network binary lint
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      run: >-
        cargo clippy --locked --all-targets
        -p aeko-validator
        -p aeko-genesis
        -p aeko-faucet
        -p aeko-social-bootstrap
        -p aeko-social-staking-program
        -p aeko-social-monetization-program
        -- -D warnings

    - name: Network binary tests
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      run: >-
        cargo test --locked
        -p aeko-validator
        -p aeko-genesis
        -p aeko-faucet
        -p aeko-social-bootstrap
        -p aeko-social-staking-program
        -p aeko-social-monetization-program

    - name: Build network image set
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        SHA_TAG: ${{ inputs.sha-tag }}
      run: |
        set -euo pipefail
        output=(--load)
        prefix="aeko-ci"

        if [ "$PUBLISH" = "true" ]; then
          : "${REGISTRY_USER:?registry-user is required when publishing}"
          prefix="$REGISTRY_USER"
          output=(--push)
        fi

        build_target() {
          local target="$1"
          shift
          local tags=()
          local image
          for image in "$@"; do
            tags+=(--tag "${prefix}/${image}:${SHA_TAG}")
          done
          docker buildx build \
            --file docker/Dockerfile \
            --target "$target" \
            "${tags[@]}" \
            "${output[@]}" \
            .
        }

        # network-rust-builder compiles validator, genesis, faucet and
        # social-bootstrap once. BuildKit reuses that stage for these targets.
        build_target validator aeko-validator aeko-node
        build_target faucet aeko-faucet
        build_target social-bootstrap aeko-social-bootstrap

        if [ "$PUBLISH" = "true" ]; then
          echo "Published immutable network images for ${SHA_TAG}."
        else
          echo "Built the network image set locally for validation only; nothing was pushed."
        fi
