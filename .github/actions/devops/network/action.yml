name: AEKO network DevOps
description: Validate core/network changes and build the complete immutable AEKO Docker release set.

inputs:
  publish:
    description: Push immutable network images. This is accepted only on main.
    required: false
    default: "false"
  registry-user:
    description: Docker Hub namespace used when publishing.
    required: false
    default: ""
  sha-tag:
    description: Immutable release tag.
    required: true

runs:
  using: composite
  steps:
    - name: Guard network publication branch
      if: ${{ inputs.publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          echo "Network publication is permitted only from the main branch." >&2
          exit 1
        fi

    - name: Validate network deployment contracts
      shell: bash
      env:
        AEKO_PUBLIC_IP: 203.0.113.10
        AEKO_KEYS_DIR: /tmp/aeko-keys
        EXPLORER_DATABASE_URL: postgres://aeko:aeko@postgres:5432/aeko_explorer
        AEKO_IMAGE_TAG: ci
      run: |
        set -euo pipefail
        bash -n docker/validator-entrypoint.sh
        bash -n scripts/deploy-testnet.sh
        python3 scripts/validate-deployment-contract.py
        docker compose -f docker/compose.local.yml config >/dev/null
        docker compose -f docker/compose.dokploy.yml config >/dev/null
        docker compose -f docker/compose.coolify.yml config >/dev/null

    - name: Network Rust format
      shell: bash
      run: |
        cargo fmt --package aeko-validator -- --check
        cargo fmt --package aeko-genesis -- --check
        cargo fmt --package aeko-faucet -- --check
        cargo fmt --package aeko-social-bootstrap -- --check

    - name: Network binary type and target check
      shell: bash
      run: >-
        cargo check --locked --all-targets
        -p aeko-validator
        -p aeko-genesis
        -p aeko-faucet
        -p aeko-social-bootstrap

    - name: Network binary lint
      shell: bash
      run: >-
        cargo clippy --locked --all-targets
        -p aeko-validator
        -p aeko-genesis
        -p aeko-faucet
        -p aeko-social-bootstrap
        -- -D warnings

    - name: Network binary tests
      shell: bash
      run: >-
        cargo test --locked
        -p aeko-validator
        -p aeko-genesis
        -p aeko-faucet
        -p aeko-social-bootstrap

    - name: Build complete immutable image set
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        SHA_TAG: ${{ inputs.sha-tag }}
      run: |
        set -euo pipefail
        output=(--load)
        prefix="aeko-ci"

        if [ "$PUBLISH" = "true" ]; then
          : "${REGISTRY_USER:?registry-user is required when publishing}"
          prefix="$REGISTRY_USER"
          output=(--push)
        fi

        build_target() {
          local target="$1"
          shift
          local tags=()
          local image
          for image in "$@"; do
            tags+=(--tag "${prefix}/${image}:${SHA_TAG}")
          done
          docker buildx build \
            --file docker/Dockerfile \
            --target "$target" \
            "${tags[@]}" \
            "${output[@]}" \
            .
        }

        # A core change can alter shared Rust/build inputs or the canonical
        # Dockerfile, so the core release owns every published container target.
        # BuildKit reuses the shared Rust/Node stages across these target builds.
        build_target validator aeko-validator aeko-node
        build_target faucet aeko-faucet
        build_target social-bootstrap aeko-social-bootstrap
        build_target tools aeko-tools
        build_target explorer-api aeko-explorer-api aeko-explorer-backend
        build_target explorer-ui aeko-explorer-ui
        build_target admin aeko-admin

        if [ "$PUBLISH" = "true" ]; then
          echo "Published complete immutable AEKO image set for ${SHA_TAG}."
        else
          echo "Built the complete AEKO image set locally for validation only; nothing was pushed."
        fi
