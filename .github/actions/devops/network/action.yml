name: AEKO network DevOps
description: Fully validate core changes, build network images locally on PRs, and publish them only from main.

inputs:
  validate-source:
    description: Run network Rust format, strict changed-program lint, and full selected network tests.
    required: false
    default: "true"
  publish:
    description: Push immutable network images. This is accepted only on main.
    required: false
    default: "false"
  registry-user:
    description: Docker Hub namespace used when publishing.
    required: false
    default: ""
  sha-tag:
    description: Immutable release tag.
    required: true

runs:
  using: composite
  steps:
    - name: Run network preflight
      shell: bash
      env:
        VALIDATE_SOURCE: ${{ inputs.validate-source }}
        PUBLISH: ${{ inputs.publish }}
      run: bash "$GITHUB_ACTION_PATH/preflight.sh"

    - name: Run network validation and image build
      shell: bash
      env:
        VALIDATE_SOURCE: ${{ inputs.validate-source }}
        PUBLISH: ${{ inputs.publish }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        SHA_TAG: ${{ inputs.sha-tag }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
