name: AEKO smart-contract DevOps
description: Build deployable SBF contracts and exercise them against the live AEKO Testnet without owning network images.

inputs:
  validate-source:
    description: Build and verify the repository smart-contract starter.
    required: false
    default: "true"
  live-testnet:
    description: Probe the public AEKO Testnet, create/fund an ephemeral wallet, deploy, invoke, and verify the contract.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Build and exercise smart contract
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      env:
        AEKO_SMART_CONTRACT_LIVE_TESTNET: ${{ inputs.live-testnet }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
