name: Explorer backend DevOps
description: Fully format, check, lint, test, build, and package the Explorer PostgreSQL backend without building network binaries.

inputs:
  validate-source:
    description: Run source lint, type-check, tests, and host build gates.
    required: false
    default: "true"
  host-build:
    description: Build the release Explorer binary on the host after validation.
    required: false
    default: "true"
  build-image:
    description: Build the Explorer API container image.
    required: false
    default: "false"
  publish:
    description: Push immutable SHA-tagged images to Docker Hub.
    required: false
    default: "false"
  registry-user:
    description: Docker Hub namespace used when publishing.
    required: false
    default: ""
  sha-tag:
    description: Immutable release tag.
    required: true

runs:
  using: composite
  steps:
    - name: Guard Explorer API publication branch
      if: ${{ inputs.publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ "${AEKO_ALLOW_INTERNAL_PR_IMAGE_PUSH:-0}" != "1" ]; then
            echo "Explorer API publication is permitted only from main or an explicitly authorized same-repository PR." >&2
            exit 1
          fi
        fi

    - name: Explorer backend and editor runner format
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      run: |
        cargo fmt --manifest-path apps/explorer/backend/Cargo.toml -- --check
        cargo fmt --manifest-path apps/editor-runner/Cargo.toml -- --check

    - name: Explorer backend and editor runner lint
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      run: cargo clippy --locked -p aeko-explorer-backend -p aeko-editor-runner --all-targets --no-deps -- -D warnings

    - name: Start isolated PostgreSQL
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        docker rm -f aeko-explorer-backend-ci-postgres >/dev/null 2>&1 || true
        docker run -d --name aeko-explorer-backend-ci-postgres \
          -e POSTGRES_USER=aeko \
          -e POSTGRES_PASSWORD=aeko \
          -e POSTGRES_DB=aeko_explorer_test \
          -p 5432:5432 \
          postgres:16-alpine >/dev/null

        ready=0
        for _ in $(seq 1 30); do
          if docker exec aeko-explorer-backend-ci-postgres \
            pg_isready -U aeko -d aeko_explorer_test >/dev/null 2>&1; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          docker logs aeko-explorer-backend-ci-postgres || true
          exit 1
        fi

    - name: Explorer backend tests
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      env:
        AEKO_EXPLORER_TEST_DATABASE_URL: postgres://aeko:aeko@127.0.0.1:5432/aeko_explorer_test
      run: cargo test --locked -p aeko-explorer-backend -p aeko-editor-runner

    - name: Stop isolated PostgreSQL
      if: ${{ always() && inputs.validate-source == 'true' }}
      shell: bash
      run: docker rm -f aeko-explorer-backend-ci-postgres >/dev/null 2>&1 || true

    - name: Explorer backend release build
      if: ${{ inputs.validate-source == 'true' && inputs.host-build == 'true' && inputs.build-image != 'true' }}
      shell: bash
      run: cargo build --locked --release -p aeko-explorer-backend -p aeko-editor-runner

    - name: Build Explorer API image
      if: ${{ inputs.build-image == 'true' }}
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        SHA_TAG: ${{ inputs.sha-tag }}
      run: |
        set -euo pipefail
        tags=(--tag "aeko-ci/aeko-explorer-api:${SHA_TAG}")

        if [ "$PUBLISH" = "true" ]; then
          : "${REGISTRY_USER:?registry-user is required when publishing}"
          tags+=(--tag "${REGISTRY_USER}/aeko-explorer-api:${SHA_TAG}")
          tags+=(--tag "${REGISTRY_USER}/aeko-explorer-backend:${SHA_TAG}")
        fi

        docker buildx build \
          --file docker/Dockerfile \
          --target explorer-api \
          --cache-from "type=gha,scope=aeko-explorer-api" \
          --cache-to "type=gha,scope=aeko-explorer-api,mode=max,ignore-error=true" \
          "${tags[@]}" \
          --load \
          .

        runner_tags=(--tag "aeko-ci/aeko-editor-runner:${SHA_TAG}")
        if [ "$PUBLISH" = "true" ]; then
          runner_tags+=(--tag "${REGISTRY_USER}/aeko-editor-runner:${SHA_TAG}")
        fi
        docker buildx build \
          --file apps/editor-runner/Dockerfile \
          --cache-from "type=gha,scope=aeko-editor-runner" \
          --cache-to "type=gha,scope=aeko-editor-runner,mode=max,ignore-error=true" \
          "${runner_tags[@]}" \
          --load \
          .

        if [ "$PUBLISH" = "true" ]; then
          docker push "${REGISTRY_USER}/aeko-explorer-api:${SHA_TAG}"
          docker push "${REGISTRY_USER}/aeko-explorer-backend:${SHA_TAG}"
          docker push "${REGISTRY_USER}/aeko-editor-runner:${SHA_TAG}"
        fi

    - name: Smoke isolated editor runner image
      if: ${{ inputs.build-image == 'true' }}
      shell: bash
      env:
        SHA_TAG: ${{ inputs.sha-tag }}
      run: |
        set -euo pipefail
        container="aeko-editor-runner-ci"
        network="aeko-editor-runner-ci-internal"

        cleanup() {
          docker rm -f "$container" >/dev/null 2>&1 || true
          docker network rm "$network" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        cleanup

        docker network create --internal "$network" >/dev/null
        docker run -d \
          --name "$container" \
          --network "$network" \
          --read-only \
          --tmpfs /work:rw,nosuid,size=2147483648 \
          --tmpfs /tmp:rw,nosuid,noexec,size=67108864 \
          --cap-drop ALL \
          --security-opt no-new-privileges:true \
          --pids-limit 160 \
          --memory 2g \
          --cpus 2 \
          -e AEKO_EDITOR_RUNNER_BIND=0.0.0.0:8090 \
          -e AEKO_EDITOR_REPO_ROOT=/opt/aeko \
          -e AEKO_EDITOR_WORK_ROOT=/work \
          -e AEKO_EDITOR_MAX_FILES=48 \
          -e AEKO_EDITOR_MAX_SOURCE_BYTES=786432 \
          -e AEKO_EDITOR_MAX_OUTPUT_BYTES=524288 \
          -e AEKO_EDITOR_MAX_ARTIFACT_BYTES=2097152 \
          -e AEKO_EDITOR_JOB_TIMEOUT_SECS=120 \
          -e AEKO_EDITOR_MAX_CONCURRENCY=2 \
          "aeko-ci/aeko-editor-runner:${SHA_TAG}" >/dev/null

        ready=0
        for _ in $(seq 1 30); do
          if docker exec "$container" curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          docker logs "$container" >&2 || true
          exit 1
        fi

        python3 - <<'PY' >/tmp/aeko-editor-build.json
        import json
        source = """use aeko_program::{
            account_info::AccountInfo,
            entrypoint,
            entrypoint::ProgramResult,
            pubkey::Pubkey,
        };

        entrypoint!(process_instruction);

        pub fn process_instruction(
            _program_id: &Pubkey,
            _accounts: &[AccountInfo],
            _instruction_data: &[u8],
        ) -> ProgramResult {
            Ok(())
        }
        """
        print(json.dumps({"files": [{"path": "src/lib.rs", "content": source}]}))
        PY

        docker exec -i "$container" \
          curl --fail-with-body --silent --show-error \
          -H 'Content-Type: application/json' \
          --data-binary @- \
          http://127.0.0.1:8090/v1/build \
          </tmp/aeko-editor-build.json \
          >/tmp/aeko-editor-build-response.json
        jq -e '.status == "succeeded" and (.artifact.byteLength > 0) and (.artifact.base64 | length > 0)' \
          /tmp/aeko-editor-build-response.json >/dev/null

        python3 - <<'PY' >/tmp/aeko-editor-test.json
        import json
        files = [
            {
                "path": "src/lib.rs",
                "content": "pub fn add(left: u64, right: u64) -> u64 { left + right }\n",
            },
            {
                "path": "tests/smoke.rs",
                "content": "#[test]\nfn adds() { assert_eq!(2 + 2, 4); }\n",
            },
        ]
        print(json.dumps({"files": files}))
        PY

        docker exec -i "$container" \
          curl --fail-with-body --silent --show-error \
          -H 'Content-Type: application/json' \
          --data-binary @- \
          http://127.0.0.1:8090/v1/test \
          </tmp/aeko-editor-test.json \
          >/tmp/aeko-editor-test-response.json
        jq -e '.status == "succeeded" and .testSummary.failed == 0' \
          /tmp/aeko-editor-test-response.json >/dev/null

        status="$(
          printf '%s' '{"files":[{"path":"../Cargo.toml","content":"bad"}]}' |
            docker exec -i "$container" curl --silent --output /tmp/reject.json --write-out '%{http_code}' \
              -H 'Content-Type: application/json' --data-binary @- http://127.0.0.1:8090/v1/build
        )"
        test "$status" = "400"
        docker exec "$container" grep -q '"code":"INVALID_PROJECT"' /tmp/reject.json

        echo "[PASS] isolated editor runner image: health -> real SBF build -> real tests -> hostile path rejection"

    - name: Verify Explorer API image exists
      if: ${{ inputs.build-image == 'true' }}
      shell: bash
      env:
        SHA_TAG: ${{ inputs.sha-tag }}
      run: |
        docker image inspect "aeko-ci/aeko-explorer-api:${SHA_TAG}" >/dev/null
        docker image inspect "aeko-ci/aeko-editor-runner:${SHA_TAG}" >/dev/null
