name: Explorer web DevOps
description: Gate lint/type errors introduced by changed Explorer source, then run tests, build, and optional packaging.

inputs:
  validate-source:
    description: Run source lint, type-check, tests, and host build gates.
    required: false
    default: "true"
  build-image:
    description: Build the Explorer UI container image.
    required: false
    default: "false"
  publish:
    description: Push the immutable SHA-tagged image to Docker Hub.
    required: false
    default: "false"
  registry-user:
    description: Docker Hub namespace used when publishing.
    required: false
    default: ""
  sha-tag:
    description: Immutable release tag.
    required: true

runs:
  using: composite
  steps:
    - name: Run Explorer web validation and image build
      shell: bash
      env:
        VALIDATE_SOURCE: ${{ inputs.validate-source }}
        BUILD_IMAGE: ${{ inputs.build-image }}
        PUBLISH: ${{ inputs.publish }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        SHA_TAG: ${{ inputs.sha-tag }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
