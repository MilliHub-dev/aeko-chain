name: Explorer web DevOps
description: Lint changed Explorer source against the legacy baseline, then type-check, test, build, and optionally package the application.

inputs:
  validate-source:
    description: Run source lint, type-check, tests, and host build gates.
    required: false
    default: "true"
  build-image:
    description: Build the Explorer UI container image.
    required: false
    default: "false"
  publish:
    description: Push the immutable SHA-tagged image to Docker Hub.
    required: false
    default: "false"
  registry-user:
    description: Docker Hub namespace used when publishing.
    required: false
    default: ""
  sha-tag:
    description: Immutable release tag.
    required: true

runs:
  using: composite
  steps:
    - name: Guard Explorer UI publication branch
      if: ${{ inputs.publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          echo "Explorer UI publication is permitted only from main." >&2
          exit 1
        fi

    - name: Install Explorer web dependencies
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      working-directory: apps/explorer/web
      run: npm ci

    - name: Explorer web lint
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      working-directory: apps/explorer/web
      run: |
        set -euo pipefail

        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          npm run lint
          exit 0
        fi

        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          BASE_SHA=$(jq -r '.pull_request.base.sha // empty' "${GITHUB_EVENT_PATH}")
          HEAD_SHA=$(jq -r '.pull_request.head.sha // empty' "${GITHUB_EVENT_PATH}")
        else
          BASE_SHA=$(jq -r '.before // empty' "${GITHUB_EVENT_PATH}")
          HEAD_SHA="${GITHUB_SHA}"
        fi

        if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ] || [[ "${BASE_SHA}" =~ ^0+$ ]] || ! git -C "${GITHUB_WORKSPACE}" cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          npm run lint
          exit 0
        fi

        mapfile -t changed < <(
          git -C "${GITHUB_WORKSPACE}" diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- apps/explorer/web
        )

        for file in "${changed[@]}"; do
          case "${file}" in
            apps/explorer/web/eslint.config.js|apps/explorer/web/package.json|apps/explorer/web/package-lock.json)
              npm run lint
              exit 0
              ;;
          esac
        done

        lint_files=()
        for file in "${changed[@]}"; do
          case "${file}" in
            apps/explorer/web/src/*.js|apps/explorer/web/src/*.jsx|apps/explorer/web/src/**/*.js|apps/explorer/web/src/**/*.jsx)
              relative="${file#apps/explorer/web/}"
              if [ -f "${relative}" ]; then
                lint_files+=("${relative}")
              fi
              ;;
          esac
        done

        if [ "${#lint_files[@]}" -eq 0 ]; then
          echo "No changed Explorer JavaScript/JSX files to lint."
          exit 0
        fi

        printf 'Linting changed Explorer files:\n'
        printf '  %s\n' "${lint_files[@]}"
        npm exec eslint -- "${lint_files[@]}"

    - name: Explorer web JavaScript type-check
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      working-directory: apps/explorer/web
      run: |
        set -euo pipefail
        mapfile -d '' sources < <(find src -type f \( -name '*.js' -o -name '*.jsx' \) -print0)
        test "${#sources[@]}" -gt 0
        npx --yes --package=typescript@5.9.3 tsc \
          --noEmit \
          --allowJs \
          --checkJs \
          --jsx react-jsx \
          --target ES2022 \
          --module ESNext \
          --moduleResolution Bundler \
          --lib ES2022,DOM,DOM.Iterable \
          --types vite/client \
          --skipLibCheck \
          "${sources[@]}"

    - name: Explorer web tests
      if: ${{ inputs.validate-source == 'true' }}
      shell: bash
      working-directory: apps/explorer/web
      run: npm test

    - name: Explorer web production build
      if: ${{ inputs.validate-source == 'true' && inputs.build-image != 'true' }}
      shell: bash
      working-directory: apps/explorer/web
      run: npm run build

    - name: Build Explorer UI image
      if: ${{ inputs.build-image == 'true' }}
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        SHA_TAG: ${{ inputs.sha-tag }}
      run: |
        set -euo pipefail
        tags=()
        output=(--load)

        if [ "$PUBLISH" = "true" ]; then
          : "${REGISTRY_USER:?registry-user is required when publishing}"
          tags+=(--tag "${REGISTRY_USER}/aeko-explorer-ui:${SHA_TAG}")
          output=(--push)
        else
          tags+=(--tag "aeko-ci/aeko-explorer-ui:${SHA_TAG}")
        fi

        # Keep PR and main image contents equivalent: both use the canonical
        # production endpoint configuration rather than baking localhost
        # endpoints into a release artifact.
        # The Docker target runs npm run build, so this is also the production
        # build gate when packaging is selected; we do not compile Vite twice.
        docker buildx build \
          --file docker/Dockerfile \
          --target explorer-ui \
          "${tags[@]}" \
          "${output[@]}" \
          .

    - name: Verify PR-built Explorer UI image exists
      if: ${{ inputs.build-image == 'true' && inputs.publish != 'true' }}
      shell: bash
      env:
        SHA_TAG: ${{ inputs.sha-tag }}
      run: docker image inspect "aeko-ci/aeko-explorer-ui:${SHA_TAG}" >/dev/null
