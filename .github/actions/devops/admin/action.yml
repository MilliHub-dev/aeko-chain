name: Admin application DevOps
description: Type-check and production-build the AEKO admin application, while running any app-owned lint/test scripts when present.

runs:
  using: composite
  steps:
    - name: Install admin dependencies
      shell: bash
      working-directory: apps/admin
      run: npm ci

    - name: Admin lint
      shell: bash
      working-directory: apps/admin
      run: npm run lint --if-present

    - name: Admin type-check
      shell: bash
      working-directory: apps/admin
      run: npx tsc --noEmit

    - name: Admin tests
      shell: bash
      working-directory: apps/admin
      run: npm test --if-present

    - name: Admin production build
      shell: bash
      working-directory: apps/admin
      run: npm run build
