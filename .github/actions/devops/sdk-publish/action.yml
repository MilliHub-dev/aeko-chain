name: Publish AEKO SDK packages
description: Publish already-validated SDK package versions to their native registries from main only.

inputs:
  js:
    description: Publish @aeko-chain/web3.js to npm.
    required: false
    default: "false"
  node:
    description: Publish @aeko-chain/sdk to npm.
    required: false
    default: "false"
  python:
    description: Publish aeko-sdk to PyPI.
    required: false
    default: "false"
  rust:
    description: Publish aeko-rust-sdk to crates.io.
    required: false
    default: "false"
  npm-token:
    description: npm automation/access token.
    required: false
    default: ""
  pypi-token:
    description: PyPI API token.
    required: false
    default: ""
  crates-token:
    description: crates.io API token.
    required: false
    default: ""
  best-effort:
    description: Log registry publication failures and return success so Docker release may continue.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Require main branch publication
      shell: bash
      run: |
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          echo "SDK packages may only be published from main." >&2
          exit 1
        fi

    - name: Publish selected SDK packages
      shell: bash
      env:
        PUBLISH_JS: ${{ inputs.js }}
        PUBLISH_NODE: ${{ inputs.node }}
        PUBLISH_PYTHON: ${{ inputs.python }}
        PUBLISH_RUST: ${{ inputs.rust }}
        NPM_TOKEN: ${{ inputs.npm-token }}
        PYPI_API_TOKEN: ${{ inputs.pypi-token }}
        CRATES_IO_TOKEN: ${{ inputs.crates-token }}
        BEST_EFFORT: ${{ inputs.best-effort }}
      run: bash "$GITHUB_ACTION_PATH/publish-selected.sh"
