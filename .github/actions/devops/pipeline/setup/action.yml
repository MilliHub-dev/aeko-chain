name: AEKO DevOps runner setup
description: Prepare only the toolchains required by one independently scheduled DevOps domain job.

inputs:
  rust:
    description: Install the pinned Rust toolchain, native prerequisites, and sccache.
    required: false
    default: "false"
  node:
    description: Install the shared Node runtime and npm dependency cache.
    required: false
    default: "false"
  python:
    description: Install the shared Python runtime.
    required: false
    default: "false"
  docker:
    description: Configure Docker Buildx for image builds.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain and native prerequisites
      if: ${{ inputs.rust == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
        rustup default 1.85.0

        native_packages=()
        if ! command -v protoc >/dev/null 2>&1; then
          native_packages+=(protobuf-compiler)
        fi
        if ! command -v pkg-config >/dev/null 2>&1 || ! pkg-config --exists libudev; then
          native_packages+=(pkg-config libudev-dev)
        fi
        if [ "${#native_packages[@]}" -gt 0 ]; then
          run_apt() {
            local attempt status
            for attempt in 1 2 3; do
              echo "apt-get attempt ${attempt}/3: $*"
              if sudo env DEBIAN_FRONTEND=noninteractive \
                timeout --kill-after=10s 90s \
                apt-get \
                  -o Acquire::Retries=2 \
                  -o Acquire::http::Timeout=15 \
                  -o Acquire::https::Timeout=15 \
                  "$@"; then
                return 0
              else
                status=$?
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "apt-get failed after 3 bounded attempts (exit ${status})." >&2
                return "$status"
              fi
              sleep $((attempt * 2))
            done
          }

          run_apt update
          run_apt install -y --no-install-recommends "${native_packages[@]}"
        fi

        rustc --version
        cargo --version
        protoc --version
        pkg-config --modversion libudev

    - name: Install local Rust compilation cache
      if: ${{ inputs.rust == 'true' }}
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      env:
        SCCACHE_GHA_ENABLED: "false"

    - name: Configure resilient Rust compiler cache
      if: ${{ inputs.rust == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cache_dir="${RUNNER_TEMP}/aeko-sccache"
        mkdir -p "$cache_dir"

        sccache_bin="${SCCACHE_PATH:-}"
        if [ -z "$sccache_bin" ]; then
          sccache_bin="$(command -v sccache || true)"
        fi

        if [ -n "$sccache_bin" ] && \
          SCCACHE_GHA_ENABLED=false \
          SCCACHE_DIR="$cache_dir" \
          SCCACHE_CACHE_SIZE=4G \
          "$sccache_bin" --start-server; then
          {
            echo "SCCACHE_GHA_ENABLED=false"
            echo "SCCACHE_DIR=$cache_dir"
            echo "SCCACHE_CACHE_SIZE=4G"
            echo "RUSTC_WRAPPER=$sccache_bin"
          } >> "$GITHUB_ENV"
          SCCACHE_GHA_ENABLED=false SCCACHE_DIR="$cache_dir" "$sccache_bin" --show-stats
        else
          echo "::warning::sccache is unavailable; continuing with direct rustc instead of failing the job."
          {
            echo "SCCACHE_GHA_ENABLED=false"
            echo "RUSTC_WRAPPER="
          } >> "$GITHUB_ENV"
        fi

    - name: Verify shared Rust cache or fall back to direct rustc
      if: ${{ inputs.rust == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if timeout 20s sccache --start-server >/tmp/aeko-sccache-start.log 2>&1; then
          echo "Shared Rust compilation cache is available."
        else
          status=$?
          echo "::warning::sccache backend unavailable (exit ${status}); compiling without the shared cache."
          cat /tmp/aeko-sccache-start.log >&2 || true
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
        fi

    - name: Set up shared Node runtime and cache
      if: ${{ inputs.node == 'true' }}
      uses: actions/setup-node@v5
      with:
        node-version: "22"
        registry-url: "https://registry.npmjs.org"
        cache: npm
        cache-dependency-path: |
          apps/admin/package-lock.json
          apps/explorer/web/package-lock.json
          apps/sdk/js/package-lock.json
          apps/sdk/node/package-lock.json

    - name: Set up shared Python runtime
      if: ${{ inputs.python == 'true' }}
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set up Docker Buildx
      if: ${{ inputs.docker == 'true' }}
      uses: docker/setup-buildx-action@v4
