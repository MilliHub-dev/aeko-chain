name: Detect AEKO DevOps changes
description: Classify a change set into independently owned AEKO application and network domains.

outputs:
  core:
    description: Blockchain/network-critical files changed.
    value: ${{ steps.classify.outputs.core }}
  admin:
    description: Admin application changed or must be validated by the orchestrator change.
    value: ${{ steps.classify.outputs.admin }}
  cli:
    description: CLI application changed or must be validated by the orchestrator change.
    value: ${{ steps.classify.outputs.cli }}
  explorer_backend:
    description: Explorer backend changed or must be validated by the orchestrator change.
    value: ${{ steps.classify.outputs.explorer_backend }}
  explorer_web:
    description: Explorer web application changed or must be validated by the orchestrator change.
    value: ${{ steps.classify.outputs.explorer_web }}
  sdk_js:
    description: JavaScript SDK must be validated.
    value: ${{ steps.classify.outputs.sdk_js }}
  sdk_node:
    description: Node SDK must be validated.
    value: ${{ steps.classify.outputs.sdk_node }}
  sdk_python:
    description: Python SDK must be validated.
    value: ${{ steps.classify.outputs.sdk_python }}
  sdk_rust:
    description: Rust client SDK must be validated.
    value: ${{ steps.classify.outputs.sdk_rust }}
  sdk_release_js:
    description: JavaScript SDK source/package changed and is eligible for a main-branch registry release.
    value: ${{ steps.classify.outputs.sdk_release_js }}
  sdk_release_node:
    description: Node SDK source/package changed and is eligible for a main-branch registry release.
    value: ${{ steps.classify.outputs.sdk_release_node }}
  sdk_release_python:
    description: Python SDK source/package changed and is eligible for a main-branch registry release.
    value: ${{ steps.classify.outputs.sdk_release_python }}
  sdk_release_rust:
    description: Rust client SDK source/package changed and is eligible for a main-branch registry release.
    value: ${{ steps.classify.outputs.sdk_release_rust }}
  sdk_any:
    description: Any external client SDK needs validation.
    value: ${{ steps.classify.outputs.sdk_any }}
  sdk_release_any:
    description: At least one external SDK package changed and is eligible for release.
    value: ${{ steps.classify.outputs.sdk_release_any }}
  rust_needed:
    description: The run needs Rust tooling/cache.
    value: ${{ steps.classify.outputs.rust_needed }}
  node_needed:
    description: The run needs Node tooling/cache.
    value: ${{ steps.classify.outputs.node_needed }}
  python_needed:
    description: The run needs Python tooling.
    value: ${{ steps.classify.outputs.python_needed }}
  dockerized:
    description: At least one Docker image-owning domain changed or a full core release is selected.
    value: ${{ steps.classify.outputs.dockerized }}
  deployable:
    description: The change affects a Dokploy-managed service or the network.
    value: ${{ steps.classify.outputs.deployable }}
  unmapped_app:
    description: A new/unmapped apps/ path changed and requires explicit CI ownership.
    value: ${{ steps.classify.outputs.unmapped_app }}

runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      run: |
        set -euo pipefail

        core=false
        admin=false
        cli=false
        explorer_backend=false
        explorer_web=false
        sdk_js=false
        sdk_node=false
        sdk_python=false
        sdk_rust=false
        sdk_release_js=false
        sdk_release_node=false
        sdk_release_python=false
        sdk_release_rust=false
        unmapped_app=false

        mark_all_apps() {
          admin=true
          cli=true
          explorer_backend=true
          explorer_web=true
          sdk_js=true
          sdk_node=true
          sdk_python=true
          sdk_rust=true
        }

        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          # Manual main runs validate the complete release surface, but do not
          # republish SDK package versions that did not change.
          core=true
          mark_all_apps
        else
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
          else
            BASE_SHA=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
          fi
          HEAD_SHA="${GITHUB_SHA}"

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA")
          else
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          printf 'Changed paths:\n'
          printf '  %s\n' "${changed_files[@]:-<none>}"

          for file in "${changed_files[@]}"; do
            case "$file" in
              apps/admin/*|.github/actions/devops/admin/*)
                admin=true
                ;;
              apps/cli/*|.github/actions/devops/cli/*)
                cli=true
                ;;
              apps/explorer/backend/*|.github/actions/devops/explorer-backend/*)
                explorer_backend=true
                ;;
              apps/explorer/web/*|.github/actions/devops/explorer-web/*)
                explorer_web=true
                ;;
              apps/explorer/*)
                # Shared Explorer-level files can affect both deployable surfaces.
                explorer_backend=true
                explorer_web=true
                ;;
              apps/sdk/js/*)
                sdk_js=true
                sdk_release_js=true
                ;;
              apps/sdk/node/*)
                sdk_node=true
                sdk_release_node=true
                ;;
              apps/sdk/python/*)
                sdk_python=true
                sdk_release_python=true
                ;;
              apps/sdk/rust-client/*)
                sdk_rust=true
                sdk_release_rust=true
                ;;
              .github/actions/devops/sdk/*)
                # CI implementation changes exercise every SDK without causing a
                # registry release when the workflow later lands on main.
                sdk_js=true
                sdk_node=true
                sdk_python=true
                sdk_rust=true
                ;;
              apps/sdk/*)
                # A future non-document shared SDK contract may affect every SDK.
                case "$file" in
                  *.md) ;;
                  *)
                    sdk_js=true
                    sdk_node=true
                    sdk_python=true
                    sdk_rust=true
                    sdk_release_js=true
                    sdk_release_node=true
                    sdk_release_python=true
                    sdk_release_rust=true
                    ;;
                esac
                ;;
              .github/actions/devops/network/*|.github/actions/devops/network-dogfood/*)
                core=true
                ;;
              .github/actions/devops/detect-changes/*|.github/workflows/build-images.yml)
                # Orchestrator/classifier changes exercise every owned path, but
                # are not application/package source releases themselves.
                core=true
                mark_all_apps
                ;;
              .github/actions/devops/promote-images/*)
                core=true
                ;;
              apps/README.md)
                ;;
              apps/*)
                # Fail closed for new app surfaces rather than silently skipping CI.
                unmapped_app=true
                ;;
              docs/*|*.md|LICENSE*|NOTICE*)
                # Documentation-only edits do not rebuild the chain.
                ;;
              *)
                core=true
                ;;
            esac
          done
        fi

        sdk_any=false
        if [ "$sdk_js" = true ] || [ "$sdk_node" = true ] || [ "$sdk_python" = true ] || [ "$sdk_rust" = true ]; then
          sdk_any=true
        fi

        sdk_release_any=false
        if [ "$sdk_release_js" = true ] || [ "$sdk_release_node" = true ] || [ "$sdk_release_python" = true ] || [ "$sdk_release_rust" = true ]; then
          sdk_release_any=true
        fi

        rust_needed=false
        if [ "$core" = true ] || [ "$cli" = true ] || [ "$explorer_backend" = true ] || [ "$sdk_rust" = true ]; then
          rust_needed=true
        fi

        node_needed=false
        if [ "$core" = true ] || [ "$admin" = true ] || [ "$explorer_web" = true ] || [ "$sdk_js" = true ] || [ "$sdk_node" = true ]; then
          node_needed=true
        fi

        python_needed=false
        if [ "$core" = true ] || [ "$sdk_python" = true ]; then
          python_needed=true
        fi

        dockerized=false
        if [ "$core" = true ] || [ "$admin" = true ] || [ "$cli" = true ] || [ "$explorer_backend" = true ] || [ "$explorer_web" = true ]; then
          dockerized=true
        fi

        deployable=false
        if [ "$core" = true ] || [ "$explorer_backend" = true ] || [ "$explorer_web" = true ]; then
          deployable=true
        fi

        {
          echo "core=$core"
          echo "admin=$admin"
          echo "cli=$cli"
          echo "explorer_backend=$explorer_backend"
          echo "explorer_web=$explorer_web"
          echo "sdk_js=$sdk_js"
          echo "sdk_node=$sdk_node"
          echo "sdk_python=$sdk_python"
          echo "sdk_rust=$sdk_rust"
          echo "sdk_release_js=$sdk_release_js"
          echo "sdk_release_node=$sdk_release_node"
          echo "sdk_release_python=$sdk_release_python"
          echo "sdk_release_rust=$sdk_release_rust"
          echo "sdk_any=$sdk_any"
          echo "sdk_release_any=$sdk_release_any"
          echo "rust_needed=$rust_needed"
          echo "node_needed=$node_needed"
          echo "python_needed=$python_needed"
          echo "dockerized=$dockerized"
          echo "deployable=$deployable"
          echo "unmapped_app=$unmapped_app"
        } >> "$GITHUB_OUTPUT"

        printf 'Selection: core=%s admin=%s cli=%s backend=%s web=%s sdk(js=%s,node=%s,python=%s,rust=%s) sdk-release(js=%s,node=%s,python=%s,rust=%s) unmapped=%s\n' \
          "$core" "$admin" "$cli" "$explorer_backend" "$explorer_web" \
          "$sdk_js" "$sdk_node" "$sdk_python" "$sdk_rust" \
          "$sdk_release_js" "$sdk_release_node" "$sdk_release_python" "$sdk_release_rust" "$unmapped_app"
