# Coolify resource: private Faucet daemon plus opt-in wallet/operator tools.
# Faucet is raw TCP. DNS names the host, but TCP 9900 still needs an
# operator-controlled route/firewall from the Validator host.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  faucet:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-faucet:${AEKO_IMAGE_TAG:?Set an immutable published AEKO image tag}
    pull_policy: always
    restart: unless-stopped
    volumes:
      - type: bind
        source: /data/aeko/keys
        target: /keys
        read_only: true
    command:
      - --keypair
      - /keys/faucet-keypair.json
      - --per-request-cap
      - ${AEKO_FAUCET_PER_REQUEST_CAP:-100}
    expose:
      - "9900"
    ports:
      - "${AEKO_TESTNET_FAUCET_PORT:-9900}:9900"
    healthcheck:
      test: ["CMD-SHELL", "test -s /keys/faucet-keypair.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  wallet-tools:
    profiles: ["ops"]
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-tools:${AEKO_IMAGE_TAG:?Set an immutable published AEKO image tag}
    pull_policy: always
    restart: "no"
    command: ["aeko", "--help"]
    volumes:
      - type: bind
        source: /data/aeko/keys
        target: /keys
    logging: *default-logging
