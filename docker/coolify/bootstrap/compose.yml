# Coolify split resource: one-shot chain bootstrap lifecycle plus a read-only
# registry endpoint. Validator RPC is reached by the canonical testnet domain
# and may live on a different Ubuntu/Coolify instance.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  key-bootstrap:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-tools:${AEKO_IMAGE_TAG:?Set an immutable published AEKO image tag}
    pull_policy: always
    restart: "no"
    environment:
      AEKO_KEYS_SOURCE: /data/aeko/keys
      AEKO_ALLOW_CHAIN_KEY_GENERATION: ${AEKO_ALLOW_CHAIN_KEY_GENERATION:-0}
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
    entrypoint: ["/usr/local/bin/aeko-key-preflight"]
    volumes:
      - type: bind
        source: /data/aeko/keys
        target: /keys
      - type: bind
        source: /data/aeko/protocol-state
        target: /protocol-state
        read_only: true
      - type: bind
        source: /data/aeko/protocol-continuity
        target: /protocol-continuity
        read_only: true
    logging: *default-logging

  social-bootstrap:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-social-bootstrap:${AEKO_IMAGE_TAG:?Set an immutable published AEKO image tag}
    pull_policy: always
    restart: "no"
    environment:
      AEKO_RPC_URL: ${AEKO_TESTNET_RPC_URL:-https://rpc.aeko.online}
      AEKO_PAYER_KEYPAIR: /keys/faucet-keypair.json
      AEKO_BOOTSTRAP_OUT_DIR: /state
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      AEKO_REWARDS_TREASURY_SEED_LAMPORTS: ${AEKO_REWARDS_TREASURY_SEED_LAMPORTS:-0}
      AEKO_REWARD_VAULT_SEED_LAMPORTS: ${AEKO_REWARD_VAULT_SEED_LAMPORTS:-0}
      AEKO_STAKE_REWARD_VAULT_SEED_LAMPORTS: ${AEKO_STAKE_REWARD_VAULT_SEED_LAMPORTS:-0}
      AEKO_PLATFORM_FEE_BPS: ${AEKO_PLATFORM_FEE_BPS:-200}
    volumes:
      - type: bind
        source: /data/aeko/keys
        target: /keys
        read_only: true
      - type: bind
        source: /data/aeko/social-state
        target: /state
    depends_on:
      key-bootstrap:
        condition: service_completed_successfully
    logging: *default-logging

  protocol-bootstrap:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-protocol-bootstrap:${AEKO_IMAGE_TAG:?Set an immutable published AEKO image tag}
    pull_policy: always
    restart: "no"
    environment:
      AEKO_RPC_URL: ${AEKO_TESTNET_RPC_URL:-https://rpc.aeko.online}
      AEKO_PAYER_KEYPAIR: /keys/faucet-keypair.json
      AEKO_PROTOCOL_AUTHORITY_KEYPAIR: /keys/protocol-authority-keypair.json
      AEKO_PROTOCOL_OUT_DIR: /state
      AEKO_PROTOCOL_CONTINUITY_DIR: /continuity
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      AEKO_TOKENOMICS_BASE_FEE_ATOMIC: ${AEKO_TOKENOMICS_BASE_FEE_ATOMIC:-250000}
      AEKO_REFERENCE_MINT_NAME: ${AEKO_REFERENCE_MINT_NAME:-AEKO-20 Testnet Reference}
      AEKO_REFERENCE_MINT_SYMBOL: ${AEKO_REFERENCE_MINT_SYMBOL:-A20T}
      AEKO_REFERENCE_MINT_DECIMALS: ${AEKO_REFERENCE_MINT_DECIMALS:-9}
      AEKO_PUBLIC_MINT_ENABLED: ${AEKO_PUBLIC_MINT_ENABLED:-true}
      AEKO_PUBLIC_MINT_PER_WALLET_LIMIT: ${AEKO_PUBLIC_MINT_PER_WALLET_LIMIT:-1000000000000}
      AEKO_PUBLIC_MINT_WINDOW_EPOCHS: ${AEKO_PUBLIC_MINT_WINDOW_EPOCHS:-30}
      AEKO_PUBLIC_MINT_COOLDOWN_EPOCHS: ${AEKO_PUBLIC_MINT_COOLDOWN_EPOCHS:-1}
      AEKO_PUBLIC_MINT_REQUIRES_ALLOWLIST: ${AEKO_PUBLIC_MINT_REQUIRES_ALLOWLIST:-false}
      AEKO_PUBLIC_MINT_ANOMALY_THRESHOLD: ${AEKO_PUBLIC_MINT_ANOMALY_THRESHOLD:-3}
      AEKO_PROTOCOL_MULTISIG_SIGNERS: ${AEKO_PROTOCOL_MULTISIG_SIGNERS:-}
      AEKO_PROTOCOL_MULTISIG_FREEZE_QUORUM: ${AEKO_PROTOCOL_MULTISIG_FREEZE_QUORUM:-1}
      AEKO_PROTOCOL_MULTISIG_REVOKE_QUORUM: ${AEKO_PROTOCOL_MULTISIG_REVOKE_QUORUM:-1}
      AEKO_PROTOCOL_MULTISIG_POLICY_QUORUM: ${AEKO_PROTOCOL_MULTISIG_POLICY_QUORUM:-1}
    volumes:
      - type: bind
        source: /data/aeko/keys
        target: /keys
        read_only: true
      - type: bind
        source: /data/aeko/protocol-state
        target: /state
      - type: bind
        source: /data/aeko/protocol-continuity
        target: /continuity
    depends_on:
      key-bootstrap:
        condition: service_completed_successfully
    logging: *default-logging

  bootstrap-registry:
    image: nginx:1.27-alpine
    pull_policy: always
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        cat >/etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 8080;
          server_name _;
          location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
          }
          location = /social-registry.env {
            alias /registry-social/social-registry.env;
            default_type text/plain;
            add_header Cache-Control "no-store";
          }
          location = /protocol-registry.env {
            alias /registry-protocol/protocol-registry.env;
            default_type text/plain;
            add_header Cache-Control "no-store";
          }
          location / {
            return 404;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    expose:
      - "8080"
    volumes:
      - type: bind
        source: /data/aeko/social-state
        target: /registry-social
        read_only: true
      - type: bind
        source: /data/aeko/protocol-state
        target: /registry-protocol
        read_only: true
    depends_on:
      social-bootstrap:
        condition: service_completed_successfully
      protocol-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /registry-social/social-registry.env &&
          test -s /registry-protocol/protocol-registry.env &&
          wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
