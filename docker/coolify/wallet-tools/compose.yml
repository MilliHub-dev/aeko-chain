# Coolify split resource: opt-in operator tooling job.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  wallet-tools:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-tools:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    command: ["aeko", "--help"]
    volumes:
      - type: bind
        source: /data/aeko/keys
        target: /keys
    logging: *default-logging
