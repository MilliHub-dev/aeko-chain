# Coolify split resource: global Aeko Scan UI.
# Scan has one active/default network plus optional endpoint sets for other
# independently deployed networks that users may switch to.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  explorer-ui:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-explorer-ui:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      AEKO_NETWORK: ${AEKO_NETWORK:?Set the default Scan network}
      AEKO_RPC_URL: ${AEKO_RPC_URL:?Set the active network RPC URL}
      AEKO_WS_URL: ${AEKO_WS_URL:?Set the active network WebSocket URL}
      AEKO_EXPLORER_API_URL: ${AEKO_EXPLORER_API_URL:?Set the active network Explorer API URL}

      # Optional alternate networks. Configure each triplet completely or
      # leave it empty. The active network does not need its prefixed triplet.
      AEKO_MAINNET_RPC_URL: ${AEKO_MAINNET_RPC_URL:-}
      AEKO_MAINNET_WS_URL: ${AEKO_MAINNET_WS_URL:-}
      AEKO_MAINNET_EXPLORER_API_URL: ${AEKO_MAINNET_EXPLORER_API_URL:-}
      AEKO_TESTNET_RPC_URL: ${AEKO_TESTNET_RPC_URL:-}
      AEKO_TESTNET_WS_URL: ${AEKO_TESTNET_WS_URL:-}
      AEKO_TESTNET_EXPLORER_API_URL: ${AEKO_TESTNET_EXPLORER_API_URL:-}
      AEKO_DEVNET_RPC_URL: ${AEKO_DEVNET_RPC_URL:-}
      AEKO_DEVNET_WS_URL: ${AEKO_DEVNET_WS_URL:-}
      AEKO_DEVNET_EXPLORER_API_URL: ${AEKO_DEVNET_EXPLORER_API_URL:-}
      AEKO_LOCALNET_RPC_URL: ${AEKO_LOCALNET_RPC_URL:-}
      AEKO_LOCALNET_WS_URL: ${AEKO_LOCALNET_WS_URL:-}
      AEKO_LOCALNET_EXPLORER_API_URL: ${AEKO_LOCALNET_EXPLORER_API_URL:-}

      AEKO_DEMO_RPC_URL: ${AEKO_DEMO_RPC_URL:-}
      AEKO_DEMO_COLLECTION: ${AEKO_DEMO_COLLECTION:-}
      AEKO_DEMO_TOKEN: ${AEKO_DEMO_TOKEN:-}
      AEKO_DEMO_METADATA_URI: ${AEKO_DEMO_METADATA_URI:-}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
