# Coolify split resource: Aeko Scan UI only.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  explorer-ui:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-explorer-ui:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      AEKO_TESTNET_RPC_URL: ${AEKO_TESTNET_RPC_URL:-https://rpc.aeko.online}
      AEKO_TESTNET_WS_URL: ${AEKO_TESTNET_WS_URL:-wss://ws.aeko.online}
      AEKO_ENV: ${AEKO_ENV:-production}
      AEKO_TESTNET_EXPLORER_API_URL: ${AEKO_TESTNET_EXPLORER_API_URL:-https://api.aeko.online}
      AEKO_MAINNET_RPC_URL: ${AEKO_MAINNET_RPC_URL:-}
      AEKO_MAINNET_WS_URL: ${AEKO_MAINNET_WS_URL:-}
      AEKO_MAINNET_EXPLORER_API_URL: ${AEKO_MAINNET_EXPLORER_API_URL:-}
      AEKO_DEMO_RPC_URL: ${AEKO_DEMO_RPC_URL:-}
      AEKO_DEMO_COLLECTION: ${AEKO_DEMO_COLLECTION:-}
      AEKO_DEMO_TOKEN: ${AEKO_DEMO_TOKEN:-}
      AEKO_DEMO_METADATA_URI: ${AEKO_DEMO_METADATA_URI:-}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
