# Coolify split resource: voting validator only.
# This resource has no Compose dependency on Faucet, bootstrap jobs, or Explorer.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  validator:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-validator:${AEKO_IMAGE_TAG:?Set an immutable published AEKO image tag}
    pull_policy: always
    restart: unless-stopped
    environment:
      AEKO_NODE_ROLE: validator
      AEKO_NETWORK: ${AEKO_NETWORK:?Set mainnet, testnet, devnet, or localnet}
      AEKO_BOOTSTRAP: "1"
      AEKO_IDENTITY_FILE: /keys/validator-1-keypair.json
      AEKO_VOTE_FILE: /keys/vote-1-keypair.json
      AEKO_STAKE_FILE: /keys/stake-keypair.json
      AEKO_FAUCET_FILE: /keys/faucet-keypair.json
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      AEKO_REQUIRE_EXISTING_LEDGER: ${AEKO_REQUIRE_EXISTING_LEDGER:-1}
      AEKO_FAUCET_ADDRESS: ${AEKO_FAUCET_ADDRESS:-faucet.aeko.online:9900}
      AEKO_GOSSIP_HOST: ${AEKO_GOSSIP_HOST:-gossip.aeko.online}
      AEKO_GOSSIP_PORT: "8001"
      AEKO_DYNAMIC_PORT_RANGE: 8000-8050
      AEKO_RPC_SEND_TRANSACTION_TPU_PEER: ${AEKO_VALIDATOR_TPU_QUIC_PEER:-127.0.0.1:8009}
      AEKO_LEDGER_LIMIT: ${AEKO_LEDGER_LIMIT:-8000000}
      AEKO_MAX_FULL_SNAPSHOTS: ${AEKO_MAX_FULL_SNAPSHOTS:-1}
      AEKO_MAX_INCREMENTAL_SNAPSHOTS: ${AEKO_MAX_INCREMENTAL_SNAPSHOTS:-1}
      AEKO_ACCOUNTS_SHRINK_OPTIMIZE_TOTAL_SPACE: ${AEKO_ACCOUNTS_SHRINK_OPTIMIZE_TOTAL_SPACE:-true}
      AEKO_ACCOUNTS_DB_CACHE_LIMIT_MB: ${AEKO_ACCOUNTS_DB_CACHE_LIMIT_MB:-512}
      AEKO_ACCOUNTS_INDEX_MEMORY_LIMIT_MB: ${AEKO_ACCOUNTS_INDEX_MEMORY_LIMIT_MB:-512}
      AEKO_MIN_FREE_DISK_KB: ${AEKO_MIN_FREE_DISK_KB:-2097152}
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    ports:
      - "8000-8050:8000-8050/tcp"
      - "8000-8050:8000-8050/udp"
    expose:
      - "8899"
      - "8900"
    volumes:
      - type: bind
        source: /data/aeko/validator-ledger
        target: /ledger
      - type: bind
        source: /data/aeko/keys
        target: /keys
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(df -Pk /ledger | awk 'NR==2 {print $$4}')" -ge "$${AEKO_MIN_FREE_DISK_KB:-2097152}" &&
          curl -fsS -X POST -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
          http://127.0.0.1:8899 | grep -q '"result":"ok"'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 2m
    logging: *default-logging
