# Coolify split resource: private Aeko Scan/Explorer API only.
# Bootstrap registry identity is supplied through this resource's environment
# so the API can run on a different host/provider without shared /data mounts.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  explorer-api:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-explorer-api:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      AEKO_EXPLORER_RPC: ${AEKO_INTERNAL_RPC_URL:?Set a reachable validator RPC endpoint}
      AEKO_EXPLORER_NETWORK: ${AEKO_EXPLORER_NETWORK:-testnet}
      AEKO_EXPLORER_BIND: 0.0.0.0:8088
      AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN: ${AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN:?Set the Explorer settings admin token}
      AEKO_EXPLORER_START_SLOT: ${AEKO_EXPLORER_START_SLOT:-0}
      AEKO_EXPLORER_MAX_BATCH_SIZE: ${AEKO_EXPLORER_MAX_BATCH_SIZE:-256}
      AEKO_EXPLORER_PERSIST_SOCIALFI_VIEWS: ${AEKO_EXPLORER_PERSIST_SOCIALFI_VIEWS:-true}
      AEKO_EXPLORER_ASSET_REFRESH_SLOTS: ${AEKO_EXPLORER_ASSET_REFRESH_SLOTS:-64}
      AEKO_EXPLORER_SOCIAL_REFRESH_SLOTS: ${AEKO_EXPLORER_SOCIAL_REFRESH_SLOTS:-16}
      AEKO_EXPLORER_MAX_READY_LAG_SLOTS: ${AEKO_EXPLORER_MAX_READY_LAG_SLOTS:-128}
      AEKO_EXPLORER_DB_MAX_CONNECTIONS: ${AEKO_EXPLORER_DB_MAX_CONNECTIONS:-16}
      AEKO_EXPLORER_DB_MIN_CONNECTIONS: ${AEKO_EXPLORER_DB_MIN_CONNECTIONS:-1}
      AEKO_EXPLORER_DB_ACQUIRE_TIMEOUT_SECS: ${AEKO_EXPLORER_DB_ACQUIRE_TIMEOUT_SECS:-10}
      AEKO_EXPLORER_RPC_TIMEOUT_SECS: ${AEKO_EXPLORER_RPC_TIMEOUT_SECS:-15}
      AEKO_EXPLORER_REQUEST_TIMEOUT_SECS: ${AEKO_EXPLORER_REQUEST_TIMEOUT_SECS:-30}
      AEKO_EXPLORER_MAX_BODY_BYTES: ${AEKO_EXPLORER_MAX_BODY_BYTES:-1048576}
      AEKO_EXPLORER_SYNC_INTERVAL_SECS: ${AEKO_EXPLORER_SYNC_INTERVAL_SECS:-2}
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      AEKO_SCAN_AIRDROP_KEY: ${AEKO_SCAN_AIRDROP_KEY:-}
      DATABASE_URL: ${EXPLORER_DATABASE_URL:?Set persistent PostgreSQL for Explorer}
      # Canonical registry values exported from the bootstrap resource.
      AEKO_REGISTRY_SCHEMA_VERSION: ${AEKO_REGISTRY_SCHEMA_VERSION:-}
      AEKO_CHAIN_GENESIS_HASH: ${AEKO_CHAIN_GENESIS_HASH:-}
      AEKO_SOCIAL_POSTS_STATE: ${AEKO_SOCIAL_POSTS_STATE:-}
      AEKO_SOCIAL_REWARDS_STATE: ${AEKO_SOCIAL_REWARDS_STATE:-}
      AEKO_SOCIAL_STAKING_STATE: ${AEKO_SOCIAL_STAKING_STATE:-}
      AEKO_SOCIAL_ANTI_SPAM_STATE: ${AEKO_SOCIAL_ANTI_SPAM_STATE:-}
      AEKO_SOCIAL_MONETIZATION_STATE: ${AEKO_SOCIAL_MONETIZATION_STATE:-}
      AEKO_REWARDS_TREASURY_ACCOUNT: ${AEKO_REWARDS_TREASURY_ACCOUNT:-}
      AEKO_REWARD_VAULT_ACCOUNT: ${AEKO_REWARD_VAULT_ACCOUNT:-}
      AEKO_STAKE_VAULT_ACCOUNT: ${AEKO_STAKE_VAULT_ACCOUNT:-}
      AEKO_STAKE_REWARD_VAULT_ACCOUNT: ${AEKO_STAKE_REWARD_VAULT_ACCOUNT:-}
      AEKO_TREASURY_ADDRESS: ${AEKO_TREASURY_ADDRESS:-}
      AEKO_PLATFORM_FEE_BPS: ${AEKO_PLATFORM_FEE_BPS:-}

      AEKO_PROTOCOL_AUTHORITY: ${AEKO_PROTOCOL_AUTHORITY:-}
      AEKO_TOKEN_PROGRAMS_FEATURE: ${AEKO_TOKEN_PROGRAMS_FEATURE:-}
      AEKO_TOKEN_PROGRAMS_FEATURE_ACTIVATED_AT: ${AEKO_TOKEN_PROGRAMS_FEATURE_ACTIVATED_AT:-}
      AEKO_PERMISSION_LAYER_FEATURE: ${AEKO_PERMISSION_LAYER_FEATURE:-}
      AEKO_PERMISSION_LAYER_FEATURE_ACTIVATED_AT: ${AEKO_PERMISSION_LAYER_FEATURE_ACTIVATED_AT:-}
      AEKO_TOKENOMICS_PROGRAM_ID: ${AEKO_TOKENOMICS_PROGRAM_ID:-}
      AEKO_TOKEN_20_PROGRAM_ID: ${AEKO_TOKEN_20_PROGRAM_ID:-}
      AEKO_PUBLIC_MINT_PROGRAM_ID: ${AEKO_PUBLIC_MINT_PROGRAM_ID:-}
      AEKO_TOKEN_721_PROGRAM_ID: ${AEKO_TOKEN_721_PROGRAM_ID:-}
      AEKO_NFT_MARKETPLACE_PROGRAM_ID: ${AEKO_NFT_MARKETPLACE_PROGRAM_ID:-}
      AEKO_WALLET_PERMISSIONS_PROGRAM_ID: ${AEKO_WALLET_PERMISSIONS_PROGRAM_ID:-}
      AEKO_PERMISSION_REGISTRY_PROGRAM_ID: ${AEKO_PERMISSION_REGISTRY_PROGRAM_ID:-}
      AEKO_REVOCATION_REGISTRY_PROGRAM_ID: ${AEKO_REVOCATION_REGISTRY_PROGRAM_ID:-}
      AEKO_SUBNET_REGISTRY_PROGRAM_ID: ${AEKO_SUBNET_REGISTRY_PROGRAM_ID:-}
      AEKO_EMERGENCY_MULTISIG_PROGRAM_ID: ${AEKO_EMERGENCY_MULTISIG_PROGRAM_ID:-}
      AEKO_FINALITY_ORACLE_PROGRAM_ID: ${AEKO_FINALITY_ORACLE_PROGRAM_ID:-}
      AEKO_TOKENOMICS_STATE: ${AEKO_TOKENOMICS_STATE:-}
      AEKO_AEKO20_REFERENCE_MINT: ${AEKO_AEKO20_REFERENCE_MINT:-}
      AEKO_PUBLIC_MINT_STATE: ${AEKO_PUBLIC_MINT_STATE:-}
      AEKO_PERMISSION_REGISTRY_STATE: ${AEKO_PERMISSION_REGISTRY_STATE:-}
      AEKO_REVOCATION_REGISTRY_STATE: ${AEKO_REVOCATION_REGISTRY_STATE:-}
      AEKO_SUBNET_REGISTRY_STATE: ${AEKO_SUBNET_REGISTRY_STATE:-}
      AEKO_EMERGENCY_MULTISIG_STATE: ${AEKO_EMERGENCY_MULTISIG_STATE:-}
      AEKO_FINALITY_ORACLE_STATE: ${AEKO_FINALITY_ORACLE_STATE:-}
      AEKO_TOKENOMICS_TREASURY_ACCOUNT: ${AEKO_TOKENOMICS_TREASURY_ACCOUNT:-}
      AEKO_VALIDATOR_REWARDS_ACCOUNT: ${AEKO_VALIDATOR_REWARDS_ACCOUNT:-}
      AEKO_COMMUNITY_REWARDS_ACCOUNT: ${AEKO_COMMUNITY_REWARDS_ACCOUNT:-}
    expose:
      - "8088"
    # Keep the API private by default. Bind to a VPN/private NIC only when UI
    # or Operations Web is intentionally hosted on another server.
    ports:
      - "${AEKO_EXPLORER_API_BIND_IP:-127.0.0.1}:${AEKO_EXPLORER_API_HOST_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging
