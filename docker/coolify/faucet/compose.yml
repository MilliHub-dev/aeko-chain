# Coolify split resource: private Faucet daemon.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  faucet:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-faucet:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    volumes:
      - type: bind
        source: /data/aeko/keys
        target: /keys
        read_only: true
    command:
      - --keypair
      - /keys/faucet-keypair.json
      - --per-request-cap
      - ${AEKO_FAUCET_PER_REQUEST_CAP:-100}
    expose:
      - "9900"
    healthcheck:
      test: ["CMD-SHELL", "test -s /keys/faucet-keypair.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
