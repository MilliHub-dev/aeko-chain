# Coolify split resource: authenticated Operations/Admin Web only.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  operations-web:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-operations-web:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      AEKO_OPERATIONS_ROLE: admin
      AEKO_TESTNET_RPC_URL: ${AEKO_TESTNET_RPC_URL:-https://rpc.aeko.online}
      AEKO_MAINNET_RPC_URL: ${AEKO_MAINNET_RPC_URL:-}
      AEKO_TESTNET_EXPLORER_API_URL: ${AEKO_TESTNET_EXPLORER_API_URL:-https://api.aeko.online}
      AEKO_MAINNET_EXPLORER_API_URL: ${AEKO_MAINNET_EXPLORER_API_URL:-}
      AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN: ${AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN:?Set the Explorer settings admin token}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set the Admin password}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set a strong Admin session secret}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
