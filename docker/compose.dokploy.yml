name: aeko-public-network

# Dokploy production/testnet deployment contract.
# Images are pulled from Docker Hub; no service builds locally.
# Required operator values:
#   AEKO_PUBLIC_IP=<public address advertised by validator>
#   AEKO_KEYS_DIR=/data/aeko/keys
#   EXPLORER_DATABASE_URL=postgres://...
#
# Low-resource Dokploy defaults target small test servers. The validator keeps
# only a bounded recent blockstore; the Explorer PostgreSQL database is the
# durable historical query store. On a ~45GB host, EXPLORER_DATABASE_URL should
# point to managed/external PostgreSQL or storage that is not competing with the
# validator root disk. AEKO_VALIDATOR_LEDGER_VOLUME may be set to an absolute
# host path such as /mnt/aeko-ledger when a separate Scaleway block volume is
# attached. Because this Compose file lives under docker/, use an absolute
# AEKO_KEYS_DIR so the key location does not depend on Compose path resolution.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  key-preflight:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-tools:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for key in \
          faucet-keypair.json \
          stake-keypair.json \
          validator-1-keypair.json \
          vote-1-keypair.json
        do
          path="/keys/$$key"
          if [ ! -f "$$path" ] || [ ! -s "$$path" ]; then
            echo "error: required AEKO keypair is missing, empty, or not a regular file: $$path" >&2
            exit 64
          fi
          if ! aeko-keygen pubkey "$$path" >/dev/null 2>&1; then
            echo "error: invalid AEKO keypair: $$path" >&2
            exit 65
          fi
          echo "validated $$key"
        done
        protocol_path="/keys/protocol-authority-keypair.json"
        if [ ! -s "$$protocol_path" ]; then
          echo "==> Initializing missing AEKO protocol authority key"
          aeko-keygen new --no-bip39-passphrase --silent --outfile "$$protocol_path"
        fi
        if ! aeko-keygen pubkey "$$protocol_path" >/dev/null 2>&1; then
          echo "error: invalid AEKO protocol authority keypair: $$protocol_path" >&2
          exit 65
        fi
        echo "validated protocol-authority-keypair.json"
        echo "AEKO key preflight complete"
    volumes:
      - ${AEKO_KEYS_DIR:?Set AEKO_KEYS_DIR to a persistent Dokploy key directory}:/keys
    logging: *default-logging
    networks: [aeko]

  faucet:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-faucet:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ${AEKO_KEYS_DIR:?Set AEKO_KEYS_DIR to a persistent Dokploy key directory}:/keys:ro
    command:
      - --keypair
      - /keys/faucet-keypair.json
      # Hard ceiling per airdrop request, enforced by the faucet itself. Per-wallet
      # cooldown and the daily budget live in the Operations Web Funding Gateway.
      - --per-request-cap
      - ${AEKO_FAUCET_PER_REQUEST_CAP:-100}
    depends_on:
      key-preflight:
        condition: service_completed_successfully
    expose:
      - "9900"
    logging: *default-logging
    networks: [aeko]

  validator:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-validator:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      AEKO_NODE_ROLE: validator
      AEKO_BOOTSTRAP: "1"
      AEKO_IDENTITY_FILE: /keys/validator-1-keypair.json
      AEKO_VOTE_FILE: /keys/vote-1-keypair.json
      AEKO_STAKE_FILE: /keys/stake-keypair.json
      AEKO_FAUCET_FILE: /keys/faucet-keypair.json
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      AEKO_FAUCET_ADDRESS: ${AEKO_INTERNAL_FAUCET_ADDRESS:-faucet:9900}
      AEKO_FUNDING_GATEWAY_KEY: ${FUNDING_GATEWAY_KEY:?}
      AEKO_GOSSIP_HOST: ${AEKO_PUBLIC_IP:?Set AEKO_PUBLIC_IP to the public address of this Dokploy server}
      AEKO_GOSSIP_PORT: "8001"
      AEKO_DYNAMIC_PORT_RANGE: 8000-8050
      AEKO_RPC_SEND_TRANSACTION_TPU_PEER: ${AEKO_VALIDATOR_TPU_QUIC_PEER:-validator:8009}

      # Constrained testnet profile. 8m shreds is roughly a ~16GB blockstore
      # target at ~2KB/shred before RocksDB overhead. This is retention, not an
      # exact byte quota. The validator still preserves current AccountsDB and
      # snapshots required to continue the chain.
