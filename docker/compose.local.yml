name: aeko-network

# Portable AEKO local-network runtime definition.
# PostgreSQL is external/managed and is mandatory for Explorer. Supply a
# database dedicated to this local chain. Explorer now binds the database to
# the validator genesis and refuses to mix histories from another chain.

services:
  faucet:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-faucet:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-faucet
    restart: unless-stopped
    volumes:
      - ${AEKO_KEYS_DIR:-../local-testnet}/faucet-keypair.json:/keys/faucet.json:ro
    command:
      - --keypair
      - /keys/faucet.json
      - --per-request-cap
      - ${AEKO_FAUCET_PER_REQUEST_CAP:-100}
    networks: [aeko]

  validator:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-validator:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-validator
    restart: unless-stopped
    environment:
      AEKO_NODE_ROLE: validator
      AEKO_BOOTSTRAP: ${AEKO_BOOTSTRAP:-1}
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      AEKO_REQUIRE_EXISTING_LEDGER: ${AEKO_REQUIRE_EXISTING_LEDGER:-0}
      AEKO_FAUCET_ADDRESS: ${AEKO_INTERNAL_FAUCET_ADDRESS:-faucet:9900}
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    ports:
      - "${AEKO_GOSSIP_HOST_PORT:-8001}:8001/udp"
      - "${AEKO_GOSSIP_HOST_PORT:-8001}:8001/tcp"
      - "${AEKO_RPC_HOST_PORT:-8899}:8899"
      - "${AEKO_WS_HOST_PORT:-8900}:8900"
    volumes:
      - validator-ledger:/ledger
      - ${AEKO_KEYS_DIR:-../local-testnet}/validator-1-keypair.json:/keys/identity.json:ro
      - ${AEKO_KEYS_DIR:-../local-testnet}/vote-1-keypair.json:/keys/vote.json:ro
      - ${AEKO_KEYS_DIR:-../local-testnet}/stake-keypair.json:/keys/stake.json:ro
      - ${AEKO_KEYS_DIR:-../local-testnet}/faucet-keypair.json:/keys/faucet.json:ro
    depends_on:
      faucet:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
          http://127.0.0.1:8899 | grep -q '"result":"ok"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [aeko]

  rpc-node:
    profiles: ["rpc"]
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-validator:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-rpc-node
    restart: unless-stopped
    environment:
      AEKO_NODE_ROLE: rpc
      AEKO_ENTRYPOINT: validator:8001
      AEKO_FAUCET_ADDRESS: ${AEKO_INTERNAL_FAUCET_ADDRESS:-faucet:9900}
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    ports:
      - "${AEKO_RPC_REPLICA_HOST_PORT:-8898}:8899"
      - "${AEKO_WS_REPLICA_HOST_PORT:-8896}:8900"
    volumes:
      - rpc-ledger:/ledger
      - ${AEKO_KEYS_DIR:-../local-testnet}/rpc-node-keypair.json:/keys/identity.json:ro
    depends_on:
      validator:
        condition: service_healthy
      faucet:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
          http://127.0.0.1:8899 | grep -q '"result":"ok"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    networks: [aeko]

  social-bootstrap:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-social-bootstrap:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-social-bootstrap
    environment:
      AEKO_RPC_URL: ${AEKO_INTERNAL_RPC_URL:-http://validator:8899}
      AEKO_PAYER_KEYPAIR: /keys/faucet.json
      AEKO_BOOTSTRAP_OUT_DIR: /state
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      AEKO_REWARDS_TREASURY_SEED_LAMPORTS: ${AEKO_REWARDS_TREASURY_SEED_LAMPORTS:-0}
      AEKO_REWARD_VAULT_SEED_LAMPORTS: ${AEKO_REWARD_VAULT_SEED_LAMPORTS:-0}
      AEKO_STAKE_REWARD_VAULT_SEED_LAMPORTS: ${AEKO_STAKE_REWARD_VAULT_SEED_LAMPORTS:-0}
      AEKO_PLATFORM_FEE_BPS: ${AEKO_PLATFORM_FEE_BPS:-200}
    volumes:
      - ${AEKO_KEYS_DIR:-../local-testnet}/faucet-keypair.json:/keys/faucet.json:ro
      - social-state:/state
    depends_on:
      validator:
        condition: service_healthy
    restart: on-failure:20
    networks: [aeko]


  protocol-bootstrap:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-protocol-bootstrap:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-protocol-bootstrap
    environment:
      AEKO_RPC_URL: ${AEKO_INTERNAL_RPC_URL:-http://validator:8899}
      AEKO_PAYER_KEYPAIR: /keys/faucet.json
      AEKO_PROTOCOL_AUTHORITY_KEYPAIR: /keys/protocol-authority.json
      AEKO_PROTOCOL_OUT_DIR: /state
      AEKO_PROTOCOL_CONTINUITY_DIR: /continuity
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      AEKO_TOKENOMICS_BASE_FEE_ATOMIC: ${AEKO_TOKENOMICS_BASE_FEE_ATOMIC:-250000}
      AEKO_REFERENCE_MINT_NAME: ${AEKO_REFERENCE_MINT_NAME:-AEKO-20 Testnet Reference}
      AEKO_REFERENCE_MINT_SYMBOL: ${AEKO_REFERENCE_MINT_SYMBOL:-A20T}
      AEKO_REFERENCE_MINT_DECIMALS: ${AEKO_REFERENCE_MINT_DECIMALS:-9}
      AEKO_PUBLIC_MINT_ENABLED: ${AEKO_PUBLIC_MINT_ENABLED:-true}
      AEKO_PUBLIC_MINT_PER_WALLET_LIMIT: ${AEKO_PUBLIC_MINT_PER_WALLET_LIMIT:-1000000000000}
      AEKO_PUBLIC_MINT_WINDOW_EPOCHS: ${AEKO_PUBLIC_MINT_WINDOW_EPOCHS:-30}
      AEKO_PUBLIC_MINT_COOLDOWN_EPOCHS: ${AEKO_PUBLIC_MINT_COOLDOWN_EPOCHS:-1}
      AEKO_PUBLIC_MINT_REQUIRES_ALLOWLIST: ${AEKO_PUBLIC_MINT_REQUIRES_ALLOWLIST:-false}
      AEKO_PUBLIC_MINT_ANOMALY_THRESHOLD: ${AEKO_PUBLIC_MINT_ANOMALY_THRESHOLD:-3}
      AEKO_PROTOCOL_MULTISIG_SIGNERS: ${AEKO_PROTOCOL_MULTISIG_SIGNERS:-}
      AEKO_PROTOCOL_MULTISIG_FREEZE_QUORUM: ${AEKO_PROTOCOL_MULTISIG_FREEZE_QUORUM:-1}
      AEKO_PROTOCOL_MULTISIG_REVOKE_QUORUM: ${AEKO_PROTOCOL_MULTISIG_REVOKE_QUORUM:-1}
      AEKO_PROTOCOL_MULTISIG_POLICY_QUORUM: ${AEKO_PROTOCOL_MULTISIG_POLICY_QUORUM:-1}
    volumes:
      - ${AEKO_KEYS_DIR:-../local-testnet}/faucet-keypair.json:/keys/faucet.json:ro
      - ${AEKO_KEYS_DIR:-../local-testnet}/protocol-authority-keypair.json:/keys/protocol-authority.json:ro
      - protocol-state:/state
      - protocol-continuity:/continuity
    depends_on:
      validator:
        condition: service_healthy
    restart: "no"
    networks: [aeko]

  explorer-api:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-explorer-api:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-explorer-api
    restart: unless-stopped
    environment:
      AEKO_EXPLORER_RPC: ${AEKO_INTERNAL_RPC_URL:-http://validator:8899}
      AEKO_EXPLORER_NETWORK: ${AEKO_EXPLORER_NETWORK:-localnet}
      AEKO_EXPLORER_BIND: 0.0.0.0:8088
      AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN: ${AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN:-local-dev-settings-admin-token-32-characters}
      AEKO_EXPLORER_START_SLOT: ${AEKO_EXPLORER_START_SLOT:-0}
      AEKO_EXPLORER_MAX_BATCH_SIZE: ${AEKO_EXPLORER_MAX_BATCH_SIZE:-256}
      AEKO_EXPLORER_PERSIST_SOCIALFI_VIEWS: ${AEKO_EXPLORER_PERSIST_SOCIALFI_VIEWS:-true}
      AEKO_EXPLORER_ASSET_REFRESH_SLOTS: ${AEKO_EXPLORER_ASSET_REFRESH_SLOTS:-64}
      AEKO_EXPLORER_SOCIAL_REFRESH_SLOTS: ${AEKO_EXPLORER_SOCIAL_REFRESH_SLOTS:-16}
      AEKO_EXPLORER_MAX_READY_LAG_SLOTS: ${AEKO_EXPLORER_MAX_READY_LAG_SLOTS:-128}
      AEKO_EXPLORER_DB_MAX_CONNECTIONS: ${AEKO_EXPLORER_DB_MAX_CONNECTIONS:-16}
      AEKO_EXPLORER_DB_MIN_CONNECTIONS: ${AEKO_EXPLORER_DB_MIN_CONNECTIONS:-1}
      AEKO_EXPLORER_DB_ACQUIRE_TIMEOUT_SECS: ${AEKO_EXPLORER_DB_ACQUIRE_TIMEOUT_SECS:-10}
      AEKO_EXPLORER_RPC_TIMEOUT_SECS: ${AEKO_EXPLORER_RPC_TIMEOUT_SECS:-15}
      AEKO_EXPLORER_REQUEST_TIMEOUT_SECS: ${AEKO_EXPLORER_REQUEST_TIMEOUT_SECS:-30}
      AEKO_EXPLORER_MAX_BODY_BYTES: ${AEKO_EXPLORER_MAX_BODY_BYTES:-1048576}
      AEKO_EXPLORER_SYNC_INTERVAL_SECS: ${AEKO_EXPLORER_SYNC_INTERVAL_SECS:-2}
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      DATABASE_URL: ${EXPLORER_DATABASE_URL:?Set EXPLORER_DATABASE_URL to a PostgreSQL database dedicated to this local chain}
      AEKO_SOCIAL_REGISTRY_FILE: /state/social-registry.env
      AEKO_PROTOCOL_REGISTRY_FILE: /protocol-state/protocol-registry.env
      AEKO_SOCIAL_POSTS_STATE: ${AEKO_SOCIAL_POSTS_STATE:-}
      AEKO_SOCIAL_REWARDS_STATE: ${AEKO_SOCIAL_REWARDS_STATE:-}
      AEKO_SOCIAL_STAKING_STATE: ${AEKO_SOCIAL_STAKING_STATE:-}
      AEKO_SOCIAL_ANTI_SPAM_STATE: ${AEKO_SOCIAL_ANTI_SPAM_STATE:-}
      AEKO_SOCIAL_MONETIZATION_STATE: ${AEKO_SOCIAL_MONETIZATION_STATE:-}
      AEKO_REWARDS_TREASURY_ACCOUNT: ${AEKO_REWARDS_TREASURY_ACCOUNT:-}
      AEKO_REWARD_VAULT_ACCOUNT: ${AEKO_REWARD_VAULT_ACCOUNT:-}
      AEKO_STAKE_VAULT_ACCOUNT: ${AEKO_STAKE_VAULT_ACCOUNT:-}
      AEKO_STAKE_REWARD_VAULT_ACCOUNT: ${AEKO_STAKE_REWARD_VAULT_ACCOUNT:-}
      AEKO_TREASURY_ADDRESS: ${AEKO_TREASURY_ADDRESS:-}
      AEKO_PLATFORM_FEE_BPS: ${AEKO_PLATFORM_FEE_BPS:-}
    ports:
      - "${AEKO_EXPLORER_API_HOST_PORT:-8088}:8088"
    volumes:
      - social-state:/state:ro
      - protocol-state:/protocol-state:ro
    depends_on:
      social-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      # Container liveness is intentionally weaker than operational readiness.
      # `/` proves the API process is serving; `/health` remains the strict
      # DB/RPC/indexer/Social readiness endpoint used by monitoring and CI.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [aeko]

  explorer-ui:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-explorer-ui:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-explorer-ui
    restart: unless-stopped
    environment:
      AEKO_PUBLIC_RPC_URL: ${AEKO_PUBLIC_RPC_URL:-http://localhost:8899}
      AEKO_PUBLIC_WS_URL: ${AEKO_PUBLIC_WS_URL:-ws://localhost:8900}
      AEKO_PUBLIC_FUNDING_URL: ${AEKO_PUBLIC_FUNDING_URL:-http://localhost:3002}
      # Deploy rule: local exposes ONLY localnet; production exposes
      # testnet + mainnet. There is no "public testnet" — testnet is testnet.
      # This local Compose file defaults to a local deploy.
      AEKO_ENV: ${AEKO_ENV:-local}
      AEKO_INTERNAL_EXPLORER_API_URL: ${AEKO_INTERNAL_EXPLORER_API_URL:-http://explorer-api:8088}
      AEKO_INTERNAL_LOCALNET_EXPLORER_API_URL: ${AEKO_INTERNAL_LOCALNET_EXPLORER_API_URL:-http://explorer-api:8088}
      AEKO_LOCALNET_FUNDING_URL: ${AEKO_LOCALNET_FUNDING_URL:-http://localhost:3002}
      AEKO_MAINNET_RPC_URL: ${AEKO_MAINNET_RPC_URL:-}
      AEKO_MAINNET_WS_URL: ${AEKO_MAINNET_WS_URL:-}
      AEKO_INTERNAL_MAINNET_EXPLORER_API_URL: ${AEKO_INTERNAL_MAINNET_EXPLORER_API_URL:-}
      AEKO_DEMO_RPC_URL: ${AEKO_DEMO_RPC_URL:-}
      AEKO_DEMO_COLLECTION: ${AEKO_DEMO_COLLECTION:-}
      AEKO_DEMO_TOKEN: ${AEKO_DEMO_TOKEN:-}
      AEKO_DEMO_METADATA_URI: ${AEKO_DEMO_METADATA_URI:-}
    ports:
      - "${AEKO_FRONTEND_HOST_PORT:-4000}:4000"
    depends_on:
      explorer-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [aeko]

  funding-gateway:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-operations-web:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-funding-gateway
    restart: unless-stopped
    environment:
      AEKO_OPERATIONS_ROLE: funding
      AEKO_RPC_URL: ${AEKO_INTERNAL_RPC_URL:-http://validator:8899}
      # Optional explicit pin for the funding chain RPC. Funding is
      # testnet-pinned and never reads AEKO_MAINNET_RPC_URL; when this is
      # unset the funding RPC falls back to AEKO_RPC_URL above.
      AEKO_TESTNET_RPC_URL: ${AEKO_TESTNET_RPC_URL:-}
      AEKO_PUBLIC_FUNDING_URL: ${AEKO_PUBLIC_FUNDING_URL:-http://localhost:3002}
      FUNDING_GATEWAY_KEY: ${FUNDING_GATEWAY_KEY:-}
      FUNDING_ADMIN_API_KEY: ${FUNDING_ADMIN_API_KEY:-local-dev-funding-admin-key-32-chars}
      FUNDING_ALLOWED_ORIGINS: ${FUNDING_ALLOWED_ORIGINS:-http://localhost:4000}
      FUNDING_STATE_DIR: /data
      FUNDING_DEFAULT_AMOUNT_AEKO: ${FUNDING_DEFAULT_AMOUNT_AEKO:-5}
      FUNDING_DEFAULT_COOLDOWN_HOURS: ${FUNDING_DEFAULT_COOLDOWN_HOURS:-24}
      FUNDING_DEFAULT_DAILY_BUDGET_AEKO: ${FUNDING_DEFAULT_DAILY_BUDGET_AEKO:-5000}
      FUNDING_MAX_MANUAL_GRANT_AEKO: ${FUNDING_MAX_MANUAL_GRANT_AEKO:-100}
      FUNDING_MAX_CONSOLE_AIRDROP_AEKO: ${FUNDING_MAX_CONSOLE_AIRDROP_AEKO:-25}
    ports:
      - "${AEKO_FUNDING_HOST_PORT:-3002}:3001"
    volumes:
      - admin-state:/data
    networks: [aeko]

  operations-web:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-operations-web:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-operations-web
    restart: unless-stopped
    environment:
      AEKO_OPERATIONS_ROLE: admin
      AEKO_RPC_URL: ${AEKO_INTERNAL_RPC_URL:-http://validator:8899}
      # Admin/operator reads always use mainnet when available. Funding chain
      # calls ignore these and stay testnet-pinned (see funding-gateway).
      AEKO_MAINNET_RPC_URL: ${AEKO_MAINNET_RPC_URL:-}
      AEKO_INTERNAL_EXPLORER_API_URL: ${AEKO_INTERNAL_EXPLORER_API_URL:-http://explorer-api:8088}
      AEKO_INTERNAL_MAINNET_EXPLORER_API_URL: ${AEKO_INTERNAL_MAINNET_EXPLORER_API_URL:-}
      AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN: ${AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN:-local-dev-settings-admin-token-32-characters}
      AEKO_INTERNAL_FUNDING_URL: ${AEKO_INTERNAL_FUNDING_URL:-http://funding-gateway:3001}
      FUNDING_ADMIN_API_KEY: ${FUNDING_ADMIN_API_KEY:-local-dev-funding-admin-key-32-chars}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-local-dev-session-secret}
    ports:
      - "${AEKO_OPERATIONS_WEB_HOST_PORT:-3001}:3001"
    depends_on:
      funding-gateway:
        condition: service_started
    networks: [aeko]


networks:
  aeko:
    driver: bridge

volumes:
  admin-state:
  validator-ledger:
  rpc-ledger:
  social-state:
  protocol-state:
  protocol-continuity:
