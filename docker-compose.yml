name: aeko-network

# Portable AEKO testnet runtime definition.
#
# This file intentionally contains NO PostgreSQL service and NO platform-
# specific reverse-proxy labels. Supply EXPLORER_DATABASE_URL from Dokploy,
# RDS, Neon, Supabase, or any PostgreSQL provider. Configure HTTP domains in
# your deployment platform against the container ports documented below.
#
# Keypairs are mounted from AEKO_KEYS_DIR. For local use it defaults to
# ./local-testnet. In Dokploy you can point AEKO_KEYS_DIR at a persistent host
# directory or mount managed secret files at the same filenames.

services:
  faucet:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-faucet:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-faucet
    restart: unless-stopped
    volumes:
      - ${AEKO_KEYS_DIR:-./local-testnet}/faucet-keypair.json:/keys/faucet.json:ro
    command:
      - --keypair
      - /keys/faucet.json
    networks: [aeko]

  validator:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-validator:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-validator
    restart: unless-stopped
    environment:
      AEKO_NODE_ROLE: validator
      AEKO_BOOTSTRAP: ${AEKO_BOOTSTRAP:-1}
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      AEKO_FAUCET_ADDRESS: faucet:9900
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    ports:
      - "${AEKO_GOSSIP_HOST_PORT:-8001}:8001/udp"
      - "${AEKO_GOSSIP_HOST_PORT:-8001}:8001/tcp"
      - "${AEKO_RPC_HOST_PORT:-8899}:8899"
      - "${AEKO_WS_HOST_PORT:-8900}:8900"
    volumes:
      - validator-ledger:/ledger
      - ${AEKO_KEYS_DIR:-./local-testnet}/validator-1-keypair.json:/keys/identity.json:ro
      - ${AEKO_KEYS_DIR:-./local-testnet}/vote-1-keypair.json:/keys/vote.json:ro
      - ${AEKO_KEYS_DIR:-./local-testnet}/stake-keypair.json:/keys/stake.json:ro
      - ${AEKO_KEYS_DIR:-./local-testnet}/faucet-keypair.json:/keys/faucet.json:ro
    depends_on:
      faucet:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
          http://127.0.0.1:8899 | grep -q '"result":"ok"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [aeko]

  # Optional public RPC replica. It uses the SAME validator image because the
  # underlying executable is the same; AEKO_NODE_ROLE changes runtime behavior
  # to a non-voting gossip-connected RPC node.
  rpc-node:
    profiles: ["rpc"]
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-validator:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-rpc-node
    restart: unless-stopped
    environment:
      AEKO_NODE_ROLE: rpc
      AEKO_ENTRYPOINT: validator:8001
      AEKO_FAUCET_ADDRESS: faucet:9900
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    ports:
      - "${AEKO_RPC_REPLICA_HOST_PORT:-8898}:8899"
      - "${AEKO_WS_REPLICA_HOST_PORT:-8896}:8900"
    volumes:
      - rpc-ledger:/ledger
      - ${AEKO_KEYS_DIR:-./local-testnet}/rpc-node-keypair.json:/keys/identity.json:ro
    depends_on:
      validator:
        condition: service_healthy
      faucet:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
          http://127.0.0.1:8899 | grep -q '"result":"ok"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    networks: [aeko]

  explorer-api:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-explorer-api:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-explorer-api
    restart: unless-stopped
    environment:
      AEKO_EXPLORER_RPC: http://validator:8899
      AEKO_EXPLORER_NETWORK: ${AEKO_EXPLORER_NETWORK:-testnet}
      AEKO_EXPLORER_BIND: 0.0.0.0:8088
      AEKO_EXPLORER_START_SLOT: ${AEKO_EXPLORER_START_SLOT:-0}
      DATABASE_URL: ${EXPLORER_DATABASE_URL:-}
      AEKO_SOCIAL_POSTS_STATE: ${AEKO_SOCIAL_POSTS_STATE:-}
      AEKO_SOCIAL_REWARDS_STATE: ${AEKO_SOCIAL_REWARDS_STATE:-}
      AEKO_SOCIAL_STAKING_STATE: ${AEKO_SOCIAL_STAKING_STATE:-}
      AEKO_SOCIAL_ANTI_SPAM_STATE: ${AEKO_SOCIAL_ANTI_SPAM_STATE:-}
      AEKO_SOCIAL_MONETIZATION_STATE: ${AEKO_SOCIAL_MONETIZATION_STATE:-}
      AEKO_REWARD_VAULT_ACCOUNT: ${AEKO_REWARD_VAULT_ACCOUNT:-}
      AEKO_TREASURY_ADDRESS: ${AEKO_TREASURY_ADDRESS:-}
      AEKO_PLATFORM_FEE_BPS: ${AEKO_PLATFORM_FEE_BPS:-200}
    ports:
      - "${AEKO_EXPLORER_API_HOST_PORT:-8088}:8088"
    depends_on:
      validator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [aeko]

  explorer-ui:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-explorer-ui:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-explorer-ui
    restart: unless-stopped
    ports:
      - "${AEKO_FRONTEND_HOST_PORT:-4000}:4000"
    depends_on:
      explorer-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [aeko]

  # One-shot initialization of SocialFi state accounts. Run only after the
  # validator is healthy, then persist the emitted addresses as deployment env.
  social-bootstrap:
    profiles: ["bootstrap"]
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-social-bootstrap:${AEKO_IMAGE_TAG:-latest}
    container_name: aeko-social-bootstrap
    environment:
      AEKO_RPC_URL: http://validator:8899
      AEKO_PAYER_KEYPAIR: /keys/faucet.json
      AEKO_BOOTSTRAP_OUT_DIR: /state
    volumes:
      - ${AEKO_KEYS_DIR:-./local-testnet}/faucet-keypair.json:/keys/faucet.json:ro
      - social-state:/state
    depends_on:
      validator:
        condition: service_healthy
    restart: on-failure:20
    networks: [aeko]

networks:
  aeko:
    driver: bridge

volumes:
  validator-ledger:
  rpc-ledger:
  social-state:
