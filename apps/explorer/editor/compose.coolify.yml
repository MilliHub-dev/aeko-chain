x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  editor-web:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-editor-web:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: "4100"
      AEKO_EDITOR_PUBLIC_ORIGIN: ${AEKO_EDITOR_PUBLIC_ORIGIN:-https://editor.aeko.online}
      AEKO_EDITOR_ACCESS_TOKEN: ${AEKO_EDITOR_ACCESS_TOKEN:?AEKO_EDITOR_ACCESS_TOKEN is required}
      AEKO_LOG_FORMAT: ${AEKO_LOG_FORMAT:-json}
      AEKO_LOG_LEVEL: ${AEKO_LOG_LEVEL:-info}
      AEKO_NETWORK: ${AEKO_NETWORK:-testnet}
      AEKO_RPC_URL: ${AEKO_RPC_URL:-https://rpc.aeko.online}
      AEKO_WS_URL: ${AEKO_WS_URL:-wss://ws.aeko.online}
      AEKO_EXPLORER_URL: ${AEKO_EXPLORER_URL:-https://scan.aeko.online}
      AEKO_EDITOR_WORKSPACE_ROOT: /workspaces
      AEKO_EDITOR_SANDBOX_UID_START: ${AEKO_EDITOR_SANDBOX_UID_START:-20000}
      AEKO_EDITOR_MAX_SESSIONS: ${AEKO_EDITOR_MAX_SESSIONS:-128}
      AEKO_EDITOR_SESSION_TTL_SECONDS: ${AEKO_EDITOR_SESSION_TTL_SECONDS:-43200}
      AEKO_EDITOR_WORKSPACE_TTL_SECONDS: ${AEKO_EDITOR_WORKSPACE_TTL_SECONDS:-43200}
      AEKO_EDITOR_MAX_WORKSPACES: ${AEKO_EDITOR_MAX_WORKSPACES:-8}
      AEKO_EDITOR_MAX_FILES: ${AEKO_EDITOR_MAX_FILES:-2000}
      AEKO_EDITOR_MAX_FILE_BYTES: ${AEKO_EDITOR_MAX_FILE_BYTES:-2097152}
      AEKO_EDITOR_MAX_WORKSPACE_BYTES: ${AEKO_EDITOR_MAX_WORKSPACE_BYTES:-67108864}
    expose:
      - "4100"
    read_only: true
    tmpfs:
      - /workspaces:rw,nosuid,nodev,size=512m,mode=0711
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4100/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
