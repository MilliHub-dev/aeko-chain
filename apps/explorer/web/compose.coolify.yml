# Coolify split resource owned by apps/explorer/web.
# Public Aeko Scan exposes Mainnet and Testnet only.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  explorer-ui:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-explorer-ui:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      AEKO_NETWORK: ${AEKO_NETWORK:?Set mainnet or testnet as the default Scan network}
      AEKO_RPC_URL: ${AEKO_RPC_URL:?Set the active network RPC URL}
      AEKO_WS_URL: ${AEKO_WS_URL:?Set the active network WebSocket URL}
      AEKO_EXPLORER_API_URL: ${AEKO_EXPLORER_API_URL:?Set the active network Explorer API URL}
      AEKO_EXPLORER_PROXY_UPSTREAM_URL: ${AEKO_EXPLORER_PROXY_UPSTREAM_URL:?Set a private or DNS-only Explorer API origin for the Scan proxy}
      AEKO_MAINNET_RPC_URL: ${AEKO_MAINNET_RPC_URL:-}
      AEKO_MAINNET_WS_URL: ${AEKO_MAINNET_WS_URL:-}
      AEKO_MAINNET_EXPLORER_API_URL: ${AEKO_MAINNET_EXPLORER_API_URL:-}
      AEKO_MAINNET_EXPLORER_PROXY_UPSTREAM_URL: ${AEKO_MAINNET_EXPLORER_PROXY_UPSTREAM_URL:-}
      AEKO_TESTNET_RPC_URL: ${AEKO_TESTNET_RPC_URL:-}
      AEKO_TESTNET_WS_URL: ${AEKO_TESTNET_WS_URL:-}
      AEKO_TESTNET_EXPLORER_API_URL: ${AEKO_TESTNET_EXPLORER_API_URL:-}
      AEKO_TESTNET_EXPLORER_PROXY_UPSTREAM_URL: ${AEKO_TESTNET_EXPLORER_PROXY_UPSTREAM_URL:-}
      AEKO_EXPLORER_PROXY_TIMEOUT_MS: ${AEKO_EXPLORER_PROXY_TIMEOUT_MS:-45000}
      AEKO_LOG_FORMAT: ${AEKO_LOG_FORMAT:-json}
      AEKO_LOG_LEVEL: ${AEKO_LOG_LEVEL:-info}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/healthz | grep -qx ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
