[package]
name = "aeko-explorer-backend"
description = "AEKO Explorer backend and indexer"
documentation = "https://github.com/MilliHub-dev/aeko-chain/tree/main/apps/explorer/backend"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
borsh = { workspace = true }
bs58 = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
url = { workspace = true }

axum = { version = "0.7.5", features = ["macros", "tokio"] }
tower = { version = "0.4.13", features = ["util"] }
tower-http = { version = "0.5.2", features = [
    "cors",
    "trace",
    "compression-gzip",
    "request-id",
    "limit",
    "set-header",
    "timeout",
] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt", "json"] }

# PostgreSQL is the mandatory durable Explorer store. There is deliberately no
# Redis or production in-memory-store dependency: RPC owns authoritative live
# chain state and PostgreSQL owns durable indexed/query state.
sqlx = { version = "0.7.4", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
] }
chrono = { version = "0.4.35", default-features = false, features = ["serde", "clock"] }

aeko-rpc-client-api = { workspace = true }
aeko-sdk = { workspace = true }
aeko-social-anti-spam-program = { workspace = true }
aeko-social-monetization-program = { workspace = true }
aeko-social-posts-program = { workspace = true }
aeko-social-rewards-program = { workspace = true }
aeko-social-staking-program = { workspace = true }
aeko-token-20-program = { workspace = true }
aeko-token-721-program = { workspace = true }

[lib]
crate-type = ["lib"]
name = "aeko_explorer_backend"

[[bin]]
name = "aeko-explorer-backend"
path = "src/main.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
