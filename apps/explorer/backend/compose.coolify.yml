# Coolify split resource owned by apps/explorer/backend.
# Server dependencies use private addresses or DNS-only origins. Public edge
# domains are intentionally not used for Explorer -> Validator/Registry traffic.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  explorer-api:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-explorer-api:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      # Coolify has treated message-bearing required-variable expressions as
      # literal values in production. Pass raw values and validate in-process.
      AEKO_NETWORK: ${AEKO_NETWORK:-}
      AEKO_RPC_URL: ${AEKO_RPC_URL:-}
      AEKO_WS_URL: ${AEKO_WS_URL:-}
      AEKO_EXPLORER_BIND: 0.0.0.0:8088
      AEKO_EXPLORER_CORS_ORIGINS: ${AEKO_EXPLORER_CORS_ORIGINS:-}
      AEKO_REGISTRY_URL: ${AEKO_REGISTRY_URL:-}
      AEKO_REQUIRE_REMOTE_REGISTRY: "1"
      AEKO_REGISTRY_REFRESH_SECONDS: ${AEKO_REGISTRY_REFRESH_SECONDS:-30}
      AEKO_REGISTRY_FETCH_TIMEOUT_SECONDS: ${AEKO_REGISTRY_FETCH_TIMEOUT_SECONDS:-10}
      AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN: ${AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN:-}
      AEKO_EXPLORER_START_SLOT: ${AEKO_EXPLORER_START_SLOT:-0}
      AEKO_EXPLORER_MAX_BATCH_SIZE: ${AEKO_EXPLORER_MAX_BATCH_SIZE:-256}
      AEKO_EXPLORER_PERSIST_SOCIALFI_VIEWS: ${AEKO_EXPLORER_PERSIST_SOCIALFI_VIEWS:-true}
      AEKO_EXPLORER_ASSET_REFRESH_SLOTS: ${AEKO_EXPLORER_ASSET_REFRESH_SLOTS:-64}
      AEKO_EXPLORER_SOCIAL_REFRESH_SLOTS: ${AEKO_EXPLORER_SOCIAL_REFRESH_SLOTS:-16}
      AEKO_EXPLORER_MAX_READY_LAG_SLOTS: ${AEKO_EXPLORER_MAX_READY_LAG_SLOTS:-128}
      AEKO_EXPLORER_DB_MAX_CONNECTIONS: ${AEKO_EXPLORER_DB_MAX_CONNECTIONS:-16}
      AEKO_EXPLORER_DB_MIN_CONNECTIONS: ${AEKO_EXPLORER_DB_MIN_CONNECTIONS:-1}
      AEKO_EXPLORER_DB_ACQUIRE_TIMEOUT_SECS: ${AEKO_EXPLORER_DB_ACQUIRE_TIMEOUT_SECS:-10}
      AEKO_EXPLORER_RPC_TIMEOUT_SECS: ${AEKO_EXPLORER_RPC_TIMEOUT_SECS:-15}
      AEKO_EXPLORER_REQUEST_TIMEOUT_SECS: ${AEKO_EXPLORER_REQUEST_TIMEOUT_SECS:-30}
      AEKO_EXPLORER_MAX_BODY_BYTES: ${AEKO_EXPLORER_MAX_BODY_BYTES:-1048576}
      AEKO_EXPLORER_SYNC_INTERVAL_SECS: ${AEKO_EXPLORER_SYNC_INTERVAL_SECS:-2}
      AEKO_EXPLORER_LOG_FORMAT: ${AEKO_EXPLORER_LOG_FORMAT:-json}
      AEKO_EXPLORER_LOG_FILTER: ${AEKO_EXPLORER_LOG_FILTER:-info,tower_http=info,hyper=warn,reqwest=warn,sqlx=warn}
      AEKO_RESET_LEDGER: ${AEKO_RESET_LEDGER:-0}
      AEKO_FUNDING_AUTHORIZATION_KEY: ${AEKO_FUNDING_AUTHORIZATION_KEY:-}
      AEKO_FUNDING_REQUESTS_PER_10_MIN: ${AEKO_FUNDING_REQUESTS_PER_10_MIN:-5}
      AEKO_FUNDING_RECONCILE_INTERVAL_SECS: ${AEKO_FUNDING_RECONCILE_INTERVAL_SECS:-5}
      AEKO_FAUCET_PER_REQUEST_CAP: ${AEKO_FAUCET_PER_REQUEST_CAP:-100}
      DATABASE_URL: ${EXPLORER_DATABASE_URL:-}
    expose:
      - "8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging
