# Coolify split resource owned by apps/admin.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${AEKO_LOG_MAX_SIZE:-10m}
    max-file: ${AEKO_LOG_MAX_FILES:-3}

services:
  operations-web:
    image: ${AEKO_IMAGE_REPOSITORY:-surdma}/aeko-operations-web:${AEKO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      AEKO_NETWORK: ${AEKO_NETWORK:?Set mainnet, testnet, devnet, or localnet}
      AEKO_RPC_URL: ${AEKO_INTERNAL_RPC_URL:?Set private or DNS-only Validator RPC URL}
      AEKO_EXPLORER_API_URL: ${AEKO_INTERNAL_EXPLORER_API_URL:?Set private or DNS-only Explorer API URL}
      AEKO_EXPLORER_UPSTREAM_TIMEOUT_MS: ${AEKO_EXPLORER_UPSTREAM_TIMEOUT_MS:-45000}
      AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN: ${AEKO_EXPLORER_SETTINGS_ADMIN_TOKEN:?Set the Explorer settings admin token}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set the Admin password}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set a strong Admin session secret}
      AEKO_LOG_FORMAT: ${AEKO_LOG_FORMAT:-json}
      AEKO_LOG_LEVEL: ${AEKO_LOG_LEVEL:-info}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz | grep -qx ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
