[package]
name = "aeko-wallet-core"
description = "AEKO wallet core primitives"
documentation = "https://github.com/MilliHub-dev/aeko-chain/tree/main/wallet-core"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[dependencies]
aes-gcm-siv = { workspace = true }
aeko-remote-wallet = { workspace = true, features = ["hidapi"] }
aeko-rpc-client = { workspace = true }
aeko-wallet-permissions-program = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
aeko-sdk = { workspace = true }
tiny-bip39 = { workspace = true }

[lib]
crate-type = ["rlib"]
name = "aeko_wallet_core"

[lints]
workspace = true
