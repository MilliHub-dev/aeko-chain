[package]
name = "hello-aeko-program"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "hello_aeko_program"

[dependencies]
aeko-program = { path = "../../sdk/program" }

[dev-dependencies]
aeko-sdk = { path = "../../sdk" }
aeko-rust-sdk = "2.0.0"
bincode = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
