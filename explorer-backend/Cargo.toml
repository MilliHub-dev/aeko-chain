[package]
name = "aeko-explorer-backend"
description = "AEKO Explorer backend and indexer"
documentation = "https://github.com/MilliHub-dev/aeko-chain/tree/main/explorer-backend"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
borsh = { workspace = true }
bs58 = { workspace = true }
hyper = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
url = { workspace = true }
aeko-rpc-client-api = { workspace = true }
aeko-sdk = { workspace = true }
aeko-social-anti-spam-program = { workspace = true }
aeko-social-posts-program = { workspace = true }
aeko-social-rewards-program = { workspace = true }
aeko-social-staking-program = { workspace = true }
aeko-token-20-program = { workspace = true }
aeko-token-721-program = { workspace = true }

[lib]
crate-type = ["lib"]
name = "aeko_explorer_backend"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
