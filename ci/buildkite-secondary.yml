#
# Legacy Buildkite secondary validation.
#
# Release publication is owned by GitHub Actions:
# - Docker Hub: deployable container images
# - GitHub Releases: CLI/keygen binaries
# - npm/PyPI/crates.io: external SDK packages
#
# Keep this pipeline validation-only so it cannot publish a second competing
# set of tarballs, installers, Docker tags, or crates.
steps:
  - name: "cargo audit"
    command: "ci/docker-run-default-image.sh ci/do-audit.sh"
    agents:
      queue: "release-build"
    timeout_in_minutes: 10
