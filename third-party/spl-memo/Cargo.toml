[package]
name = "spl-memo"
version = "4.0.1"
edition = "2021"
description = "AEKO Program Library Memo (forked from Solana Program Library)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
aeko-program = { path = "../../sdk/program" }

[features]
default = []
no-entrypoint = []
test-sbf = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("aeko", "AEKO", "solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
] }
