[package]
name = "spl-associated-token-account"
version = "2.3.1"
edition = "2021"
description = "AEKO Program Library Associated Token Account (forked from Solana Program Library)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
assert_matches = "1.5.0"
borsh = "0.10"
num-derive = "0.4"
num-traits = "0.2"
thiserror = "1.0"
aeko-program = { path = "../../sdk/program" }
spl-token = { path = "../spl-token", features = ["no-entrypoint"] }
spl-token-2022 = { path = "../spl-token-2022", features = ["no-entrypoint"] }

[features]
default = []
no-entrypoint = []
test-sbf = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("aeko", "AEKO", "solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
] }
